<title>The Hollow Wick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Vollkorn:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --night-deep:#0b1220;
    --night-mid:#16233a;
    --night-panel:#1c2d47;
    --frame-brass:#8a6a3c;
    --frame-brass-lit:#c79a52;
    --moss:#4f7a5b;
    --moss-dark:#2c4636;
    --amber:#ffb648;
    --amber-dim:#c98a2e;
    --wisp:#6be8d0;
    --parchment:#e9e2c9;
    --parchment-dim:#a89a78;
    --danger:#c0463c;
  }

  *{ box-sizing:border-box; }

  html{ height:100%; }

  body{
    margin:0;
    height:100%;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, #1c2d47 0%, transparent 60%),
      radial-gradient(ellipse 90% 70% at 50% 100%, #0e1626 0%, transparent 55%),
      var(--night-deep);
    color:var(--parchment);
    font-family:'Vollkorn', Georgia, serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    width:100%;
    transform-origin:center center;
    will-change:transform;
  }

  .frame{
    width:min(96vw, 860px);
    background:
      linear-gradient(180deg, var(--frame-brass-lit) 0%, var(--frame-brass) 5%, #4a3620 96%, #382a18 100%);
    border-radius:18px;
    padding:14px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.75),
      0 0 0 1px rgba(255,255,255,0.05) inset;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .title-plate{
    text-align:center;
    padding:8px 6px 4px;
  }

  .title-plate h1{
    margin:0;
    font-family:'Cinzel', 'Vollkorn', serif;
    font-weight:700;
    font-size:clamp(1.15rem, 4vw, 1.7rem);
    letter-spacing:2px;
    color:var(--amber);
    text-shadow:0 0 12px rgba(255,182,72,0.45);
  }

  .title-plate p{
    margin:2px 0 0;
    font-size:0.78rem;
    color:var(--parchment-dim);
    letter-spacing:1px;
    font-style:italic;
  }

  .viewport{
    position:relative;
    border-radius:8px;
    overflow:hidden;
    background:var(--night-deep);
    box-shadow:
      0 0 0 5px #241a10,
      0 0 0 7px var(--frame-brass),
      0 12px 26px rgba(0,0,0,0.55) inset;
    line-height:0;
  }

  canvas{
    display:block;
    width:100%;
    height:auto;
    touch-action:none;
  }

  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:rgba(6,8,16,0.88);
    text-align:center;
    padding:24px;
  }

  .overlay.hidden{ display:none; }

  .overlay h2{
    margin:0;
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:clamp(1rem, 4.4vw, 1.5rem);
    color:var(--amber);
    text-shadow:0 0 14px rgba(255,182,72,0.5);
    text-wrap:balance;
  }

  .overlay p{
    margin:0;
    color:var(--parchment-dim);
    font-size:0.95rem;
    max-width:38ch;
    line-height:1.5;
  }

  .overlay-btns{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .btn{
    font-family:'Vollkorn', serif;
    font-weight:700;
    font-size:0.95rem;
    color:var(--night-deep);
    background:linear-gradient(180deg, #ffd27a, var(--amber));
    border:none;
    border-radius:8px;
    padding:10px 20px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--amber-dim), 0 6px 14px rgba(0,0,0,0.4);
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--amber-dim); }

  .btn.secondary{
    background:linear-gradient(180deg, #3a4c6c, var(--night-panel));
    color:var(--parchment);
    box-shadow:0 4px 0 #0f1a2c, 0 6px 14px rgba(0,0,0,0.4);
  }
  .btn.secondary:active{ box-shadow:0 1px 0 #0f1a2c; }

  .deck{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:clamp(8px, 3vw, 16px);
  }

  .dpad{
    display:grid;
    grid-template-columns:repeat(3, clamp(30px, 9vw, 40px));
    grid-template-rows:repeat(3, clamp(30px, 9vw, 40px));
    gap:clamp(3px, 1vw, 4px);
    flex:0 0 auto;
  }

  .ctrl-btn{
    font-family:'Vollkorn', serif;
    font-weight:700;
    border:none;
    cursor:pointer;
    color:var(--parchment);
    background:linear-gradient(180deg, #3a4c6c, var(--night-panel));
    border-radius:8px;
    font-size:clamp(0.75rem, 2.6vw, 1rem);
    box-shadow:0 3px 0 #0f1a2c, 0 5px 8px rgba(0,0,0,0.3);
    user-select:none;
    -webkit-user-select:none;
  }
  .ctrl-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #0f1a2c; }
  .ctrl-btn.up{ grid-column:2; grid-row:1; }
  .ctrl-btn.left{ grid-column:1; grid-row:2; }
  .ctrl-btn.right{ grid-column:3; grid-row:2; }
  .ctrl-btn.down{ grid-column:2; grid-row:3; }

  .action-btns{
    display:flex;
    gap:clamp(6px, 2vw, 8px);
    align-items:center;
    flex:0 0 auto;
  }

  .action-btn{
    font-family:'Vollkorn', serif;
    font-weight:700;
    border:none;
    cursor:pointer;
    border-radius:999px;
    width:clamp(42px, 13vw, 58px);
    height:clamp(42px, 13vw, 58px);
    font-size:clamp(0.6rem, 2vw, 0.75rem);
    letter-spacing:0.5px;
    user-select:none;
    -webkit-user-select:none;
  }
  .action-btn:active{ transform:translateY(2px); }

  #btnAttack{
    background:linear-gradient(180deg, #ffd27a, var(--amber));
    color:var(--night-deep);
    box-shadow:0 4px 0 var(--amber-dim), 0 6px 12px rgba(255,182,72,0.3);
  }
  #btnSkill{
    background:linear-gradient(180deg, #8ff2de, var(--wisp));
    color:var(--night-deep);
    box-shadow:0 4px 0 #3fae98, 0 6px 12px rgba(107,232,208,0.3);
  }
  #btnInteract{
    background:linear-gradient(180deg, #3a4c6c, var(--night-panel));
    color:var(--parchment);
    box-shadow:0 4px 0 #0f1a2c, 0 6px 12px rgba(0,0,0,0.3);
  }

  .menu-btn{
    position:absolute;
    top:8px;
    right:8px;
    font-family:'Vollkorn', serif;
    font-weight:700;
    font-size:0.7rem;
    letter-spacing:1px;
    color:var(--parchment);
    background:rgba(10,15,26,0.55);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:6px;
    padding:5px 9px;
    cursor:pointer;
  }

  .hint{
    margin:0;
    font-size:0.76rem;
    color:var(--parchment-dim);
    text-align:center;
    opacity:0.85;
  }
  .hint kbd{
    font-family:inherit;
    background:rgba(255,255,255,0.08);
    border-radius:4px;
    padding:1px 6px;
    font-size:0.76rem;
  }

  :focus-visible{ outline:2px solid var(--wisp); outline-offset:2px; }
</style>

<div class="stage">
  <div class="frame">
    <div class="title-plate">
      <h1>THE HOLLOW WICK</h1>
      <p>relight the beacons &middot; return the light</p>
    </div>

    <div class="viewport">
      <canvas id="game" width="800" height="520" role="img" aria-label="The Hollow Wick game viewport"></canvas>
      <button class="menu-btn" id="btnMenu" aria-label="Open menu">MENU</button>
      <div class="overlay hidden" id="overlay">
        <h2 id="ovTitle">THE HOLLOW WICK</h2>
        <p id="ovText">Your village's flame was stolen by the dark. Relight three ancient beacons to call it home.</p>
        <div class="overlay-btns" id="ovButtons"></div>
      </div>
    </div>

    <div class="deck">
      <div class="dpad">
        <button class="ctrl-btn up" id="btnUp" aria-label="Move up">&#9650;</button>
        <button class="ctrl-btn left" id="btnLeft" aria-label="Move left">&#9664;</button>
        <button class="ctrl-btn right" id="btnRight" aria-label="Move right">&#9654;</button>
        <button class="ctrl-btn down" id="btnDown" aria-label="Move down">&#9660;</button>
      </div>
      <div class="action-btns">
        <button class="action-btn" id="btnInteract" aria-label="Interact">TALK</button>
        <button class="action-btn" id="btnSkill" aria-label="Light bolt">BOLT</button>
        <button class="action-btn" id="btnAttack" aria-label="Attack">SWING</button>
      </div>
    </div>

    <p class="hint">
      <kbd>&#8592;&#8593;&#8595;&#8594;</kbd> move &middot; <kbd>Space</kbd> swing &middot; <kbd>K</kbd> light bolt &middot; <kbd>E</kbd> talk / interact
    </p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var stage = document.querySelector('.stage');
  function fitStage(){
    if(!stage) return;
    stage.style.transform = 'none';
    var rect = stage.getBoundingClientRect();
    var doc = document.documentElement;
    var naturalW = Math.max(rect.width, doc.scrollWidth);
    var naturalH = Math.max(rect.height, doc.scrollHeight);
    var availW = window.innerWidth - 20;
    var availH = window.innerHeight - 20;
    var scale = Math.min(1, availW / naturalW, availH / naturalH);
    stage.style.transform = scale < 0.999 ? 'scale(' + scale.toFixed(4) + ')' : 'none';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', function(){ setTimeout(fitStage, 60); });
  window.addEventListener('load', fitStage);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitStage); }
  fitStage();
  setTimeout(fitStage, 300);
})();
</script>

  function beep(freq, dur, type, gain, delay){
    if(!audioCtx) return;
    type = type || 'square';
    gain = gain === undefined ? 0.05 : gain;
    delay = delay || 0;
    var t0 = audioCtx.currentTime + delay;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  // ================= HELPERS =================
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function dist(x1,y1,x2,y2){ var dx=x2-x1,dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function roundRect(c,x,y,w,h,r){
    r = Math.max(0, Math.min(r, Math.abs(w)/2, Math.abs(h)/2));
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }
  function wrapText(c, text, maxWidth){
    var words = text.split(' ');
    var lines = [];
    var line = '';
    for(var i=0;i<words.length;i++){
      var test = line ? (line + ' ' + words[i]) : words[i];
      if(c.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    if(line) lines.push(line);
    return lines;
  }

    hound:{hp:22,atk:7,def:1,speed:78,r:15,aggro:170,melee:26,ranged:0,xp:10},
    bogwarden:{hp:74,atk:9,def:3,speed:52,r:24,aggro:260,melee:52,ranged:320,xp:45,isBoss:true},
    sentinel:{hp:92,atk:11,def:4,speed:56,r:25,aggro:260,melee:52,ranged:300,xp:55,isBoss:true},
    hollowking:{hp:230,atk:14,def:5,speed:62,r:28,aggro:9999,melee:60,ranged:340,xp:150,isBoss:true}
  };

  var ITEMS = {
    cloak:{name:'Warm Cloak', desc:'+3 Defense', apply:function(p){ p.def+=3; }},
    charm:{name:'Ember Charm', desc:'+10 Max Mana', apply:function(p){ p.maxMana+=10; p.mana+=10; }},
    lantern:{name:'Sunstone Lantern', desc:'+4 Attack', apply:function(p){ p.atk+=4; }}
  };

  // ================= STATE =================
  function freshPlayer(){
    return {
      x:100,y:280, r:13, facing:{x:0,y:1},
      level:1, xp:0, xpToNext:20,
      hp:30, maxHp:30, mana:20, maxMana:20,
      atk:6, def:2, speed:130,
      attackTimer:0, attackCd:0.38, attackActive:0,
      boltCd:0, boltCdMax:0.5,
      invuln:0,
      equipped:{cloak:false,charm:false,lantern:false}
    };
  }

  var state = {
    started:false,
    paused:false,
    player: freshPlayer(),
    roomId:'hub',
    beacons:{forest:false, fen:false, ruins:false},
    defeated:{},        // roomId -> {enemyId:true}
    chestsOpened:{},    // chestId -> true
    bossDefeated:false,
    elapsed:0,
    seenIntro:false
  };

  var camera = {x:0,y:0};
  var enemies = [];       // active enemies in current room
  var projectiles = [];
  var pickups = [];
  var particles = [];     // damage numbers / sparks
  var ambientParticles = [];
  var toasts = [];
  var areaBanner = {text:'', timer:0};
  var dialogue = null;    // {lines, idx, name}
  var nextEnemySeq = 1;

  function beaconsCount(){
    var n=0; if(state.beacons.forest)n++; if(state.beacons.fen)n++; if(state.beacons.ruins)n++;
    return n;
  }

  // ================= SAVE / LOAD =================
  function save(){
    try{
      var p = state.player;
      var data = {
        v:1,
        player:{level:p.level,xp:p.xp,xpToNext:p.xpToNext,maxHp:p.maxHp,hp:p.hp,maxMana:p.maxMana,mana:p.mana,atk:p.atk,def:p.def,equipped:p.equipped},
        roomId: state.roomId,
        beacons: state.beacons,
        defeated: state.defeated,
        chestsOpened: state.chestsOpened,
        bossDefeated: state.bossDefeated,
        elapsed: state.elapsed,
        seenIntro: state.seenIntro
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }catch(e){ /* storage unavailable - ignore, game still works */ }
  }

  function hasSave(){
    try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
  }

  function loadInto(fresh){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      var data = JSON.parse(raw);
      var p = state.player;
      Object.assign(p, data.player);
      p.attackTimer=0; p.attackCd=0.38; p.attackActive=0; p.boltCd=0; p.boltCdMax=0.5; p.invuln=0;
      p.facing={x:0,y:1}; p.r=13; p.speed=130;
      state.beacons = data.beacons || state.beacons;
      state.defeated = data.defeated || {};
      state.chestsOpened = data.chestsOpened || {};
      state.bossDefeated = !!data.bossDefeated;
      state.elapsed = data.elapsed || 0;
      state.seenIntro = !!data.seenIntro;
      enterRoom(data.roomId || 'hub', roomEntryPoint(data.roomId || 'hub'));
      return true;
    }catch(e){ return false; }
  }

  function roomEntryPoint(id){
    if(id==='hub') return {x:100,y:280};
    if(id==='forest') return {x:70,y:340};
    if(id==='fen') return {x:400,y:610};
    if(id==='ruins') return {x:420,y:70};
    if(id==='keep') return {x:460,y:70};
    return {x:100,y:100};
  }

  function resetGame(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    state.player = freshPlayer();
    state.beacons = {forest:false,fen:false,ruins:false};
    state.defeated = {};
    state.chestsOpened = {};
    state.bossDefeated = false;
    state.elapsed = 0;
    state.seenIntro = false;
    enterRoom('hub', roomEntryPoint('hub'));
  }

  // ================= INPUT =================
  var keys = {};
  var held = {up:false,down:false,left:false,right:false};

  window.addEventListener('keydown', function(e){
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)!==-1) e.preventDefault();
    keys[e.key] = true;
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') held.up=true;
    if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') held.down=true;
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') held.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') held.right=true;
    if(e.key===' ') doAttack();
    if(e.key==='k'||e.key==='K') doBolt();
    if(e.key==='e'||e.key==='E') doInteract();
  });
  window.addEventListener('keyup', function(e){
    keys[e.key] = false;
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') held.up=false;
    if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') held.down=false;
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') held.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') held.right=false;
  });

  function bindHold(el, on, off){
    el.addEventListener('pointerdown', function(e){ ensureAudio(); on(); el.setPointerCapture && el.setPointerCapture(e.pointerId); e.preventDefault(); });
    el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('pointercancel', off);
  }
  bindHold(document.getElementById('btnUp'), function(){held.up=true;}, function(){held.up=false;});
  bindHold(document.getElementById('btnDown'), function(){held.down=true;}, function(){held.down=false;});
  bindHold(document.getElementById('btnLeft'), function(){held.left=true;}, function(){held.left=false;});
  bindHold(document.getElementById('btnRight'), function(){held.right=true;}, function(){held.right=false;});
  document.getElementById('btnAttack').addEventListener('click', function(){ ensureAudio(); doAttack(); });
  document.getElementById('btnSkill').addEventListener('click', function(){ ensureAudio(); doBolt(); });
  document.getElementById('btnInteract').addEventListener('click', function(){ ensureAudio(); doInteract(); });
  document.getElementById('btnMenu').addEventListener('click', function(){ ensureAudio(); openMenu(); });

  // ================= OVERLAY UI =================
  var ovEl = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovButtons = document.getElementById('ovButtons');

  function showOverlay(title, text, buttons){
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovButtons.innerHTML = '';
    buttons.forEach(function(b){
      var btn = document.createElement('button');
      btn.className = 'btn' + (b.secondary ? ' secondary' : '');
      btn.textContent = b.label;
      btn.addEventListener('click', b.onClick);
      ovButtons.appendChild(btn);
    });
    ovEl.classList.remove('hidden');
  }
  function hideOverlay(){ ovEl.classList.add('hidden'); }

  function openStartScreen(){
    var buttons = [];
    if(hasSave()){
      buttons.push({label:'Continue Journey', onClick:function(){
        ensureAudio(); hideOverlay(); loadInto(); state.started=true;
      }});
      buttons.push({label:'New Game', secondary:true, onClick:function(){
        ensureAudio(); resetGame(); hideOverlay(); state.started=true;
      }});
      showOverlay('THE HOLLOW WICK', "Your beacons remember you. Will you continue, or begin anew?", buttons);
    } else {
      buttons.push({label:'Begin', onClick:function(){
        ensureAudio(); hideOverlay(); state.started=true; state.seenIntro=true; save();
      }});
      showOverlay('THE HOLLOW WICK', "Your village's flame was stolen by the dark. Relight three ancient beacons to call it home.", buttons);
    }
  }

  function openMenu(){
    state.paused = true;
    showOverlay('PAUSED', 'Level ' + state.player.level + ' · Beacons lit: ' + beaconsCount() + '/3', [
      {label:'Resume', onClick:function(){ hideOverlay(); state.paused=false; }},
      {label:'New Game', secondary:true, onClick:function(){ confirmNewGame(); }}
    ]);
  }

  function confirmNewGame(){
    showOverlay('START OVER?', 'This will erase your progress — level, items, and lit beacons.', [
      {label:'Yes, Start Over', onClick:function(){ resetGame(); hideOverlay(); state.paused=false; state.started=true; }},
      {label:'Cancel', secondary:true, onClick:function(){ openMenu(); }}
    ]);

  function showDeath(){
    sfxGameOver();
    state.paused = true;
    showOverlay('YOU FELL...', 'The dark presses close, but your lantern still flickers. Rise once more.', [
      {label:'Rise Again', onClick:function(){
        hideOverlay(); state.paused=false;
        var p = state.player;
        p.hp = Math.round(p.maxHp*0.6);
        p.mana = p.maxMana;
        p.invuln = 1.2;

      }}
    ]);
  }

  function showVictory(){
    sfxVictory();
    state.bossDefeated = true;
    save();
    state.paused = true;
    var mins = Math.floor(state.elapsed/60), secs = Math.floor(state.elapsed%60);
    var timeStr = mins + 'm ' + (secs<10?'0':'') + secs + 's';
    showOverlay('THE LIGHT RETURNS', 'The Hollow King unravels into embers, and warmth floods back into the valley. Wick Hollow is safe once more.\n\nLevel reached: ' + state.player.level + '  ·  Time: ' + timeStr, [
      {label:'Play Again', onClick:function(){ resetGame(); hideOverlay(); state.paused=false; state.started=true; }}
    ]);
  }

  // ================= COLLISION =================
  function resolveObstacles(entity, obstacles){
    for(var i=0;i<obstacles.length;i++){
      var o = obstacles[i];
      if(o.solid===false) continue;
      var closestX = clamp(entity.x, o.x, o.x+o.w);
      var closestY = clamp(entity.y, o.y, o.y+o.h);
      var dx = entity.x-closestX, dy = entity.y-closestY;
      var d = Math.sqrt(dx*dx+dy*dy);
      if(d < entity.r){
        if(d===0){ dx=0; dy=-1; d=0.001; }
        var push = (entity.r-d);
        entity.x += (dx/d)*push;
        entity.y += (dy/d)*push;
      }
    }
  }

  function currentRoom(){ return ROOMS[state.roomId]; }

  // ================= ROOM TRANSITION =================
  var transition = {active:false, timer:0, dir:1, pending:null};

  function requestTransition(roomId, spawn){
    if(transition.active) return;
    transition.active = true; transition.timer = 0; transition.dir = -1;
    transition.pending = {roomId:roomId, spawn:spawn};
  }

  function enterRoom(roomId, spawn){
    state.roomId = roomId;
    var room = ROOMS[roomId];
    state.player.x = spawn.x;
    state.player.y = spawn.y;
    buildEnemiesForRoom(roomId);
    projectiles = [];
    pickups = [];
    particles = [];
    buildAmbientParticles(room);
    areaBanner.text = room.name;
    areaBanner.timer = 2.2;
    camera.x = clamp(state.player.x - W/2, 0, Math.max(0, room.width-W));
    camera.y = clamp(state.player.y - H/2, 0, Math.max(0, room.height-H));
  }

  function buildEnemiesForRoom(roomId){
    enemies = [];
    var room = ROOMS[roomId];
    var dead = state.defeated[roomId] || {};
    (room.enemySpawns||[]).forEach(function(sp){
      if(dead[sp.id]) return;
      enemies.push(makeEnemy(sp.id, sp.type, sp.x, sp.y));
    });
    if(room.miniboss && !dead[room.miniboss.id]){
      enemies.push(makeEnemy(room.miniboss.id, room.miniboss.type, room.miniboss.x, room.miniboss.y, room.miniboss.lights));
    }
    if(room.boss && !state.bossDefeated){
      enemies.push(makeEnemy(room.boss.id, room.boss.type, room.boss.x, room.boss.y));
    }
  }

  function buildAmbientParticles(room){
    ambientParticles = [];
    if(reduceMotion) return;
    var n = room.biome==='fen' ? 14 : (room.biome==='forest' ? 18 : 10);
    for(var i=0;i<n;i++){
      ambientParticles.push({
        x: Math.random()*room.width, y: Math.random()*room.height,
        phase: Math.random()*Math.PI*2, speed: 0.4+Math.random()*0.6,
        r: 1.2+Math.random()*1.6
      });
    }
  }

  // ================= ENEMIES =================
  function makeEnemy(id, type, x, y, lights){
    var s = ENEMY_STATS[type];
    return {
      id:id, type:type, x:x, y:y, r:s.r,
      hp:s.hp, maxHp:s.hp, atk:s.atk, def:s.def, speed:s.speed,
      aggro:s.aggro, meleeRange:s.melee, rangedRange:s.ranged||0, xp:s.xp,
      isBoss: !!s.isBoss, lights: lights||null,
      state:'idle', facing:{x:0,y:1},
      attackTimer: Math.random()*0.5, attackWindup:0, rangedTimer: (s.rangedCd||2)*Math.random()+0.6, rangedCd: s.rangedCd||2,
      hitFlash:0, deathTimer:-1, phase:1, summoned:false, bob:Math.random()*Math.PI*2,
      slamTelegraph:0
    };
  }

  function enemyDamage(e, dmg){
    if(e.deathTimer>=0) return;
    e.hp -= dmg;
    e.hitFlash = 0.18;
    spawnDamageNumber(e.x, e.y-e.r-4, dmg, '#e9e2c9');
    sfxHit();
    if(e.hp<=0){
      e.hp = 0;
      e.deathTimer = 0.4;
      e.state = 'dead';
    }
  }

  function onEnemyRemoved(e){
    var dead = state.defeated[state.roomId] || (state.defeated[state.roomId]={});
    dead[e.id] = true;
    grantXp(e.xp);
    if(e.lights){
      state.beacons[e.lights] = true;
      toast((currentRoom().beacon?currentRoom().beacon.name:'Beacon') + ' reignites!');
      sfxBeacon();
    }
    if(e.type==='hollowking'){
      showVictory();
    }
    if(Math.random()<0.28){
      pickups.push({x:e.x,y:e.y,type: Math.random()<0.5?'heart':'mana', life:9, bob:0});
    }
    save();
  }

  function grantXp(xp){
    var p = state.player;
    p.xp += xp;
    spawnDamageNumber(p.x, p.y-p.r-10, '+'+xp+' xp', '#e9e2c9');
    sfxXp();
    while(p.xp >= p.xpToNext){
      p.xp -= p.xpToNext;
      p.level += 1;
      p.maxHp += 8; p.hp = p.maxHp;
      p.maxMana += 4; p.mana = p.maxMana;
      p.atk += 2; p.def += 1;
      p.xpToNext = Math.round(18*Math.pow(p.level+1,1.32));
      toast('Level Up! Now level ' + p.level);
      sfxLevel();
    }
    save();
  }

  function updateEnemy(e, dt, room){
    if(e.deathTimer>=0){
      e.deathTimer -= dt;
      if(e.deathTimer<=0) e.dead=true;
      return;
    }
    e.hitFlash = Math.max(0, e.hitFlash-dt);
    e.bob += dt;
    var p = state.player;
    var d = dist(e.x,e.y,p.x,p.y);

    if(e.type==='hollowking'){
      e.phase = e.hp <= e.maxHp*0.5 ? 2 : 1;
      if(e.phase===2 && !e.summoned){
        e.summoned = true;
        toast("The Hollow King's fury grows!");
        enemies.push(makeEnemy('hk_add1','wisp', e.x-60, e.y+40));
        enemies.push(makeEnemy('hk_add2','wisp', e.x+60, e.y+40));
      }
    }

    var stats = ENEMY_STATS[e.type];
    var speed = e.speed * (e.type==='hollowking' && e.phase===2 ? 1.2 : 1);

    if(d < e.aggro || e.isBoss){
      if(d > e.meleeRange*0.85){
        var dx=(p.x-e.x)/d, dy=(p.y-e.y)/d;
        e.facing = {x:dx,y:dy};
        e.x += dx*speed*dt; e.y += dy*speed*dt;
        e.state='chase';
      } else {
        e.state='attack';
      }

      e.attackTimer -= dt;
      var atkInterval = e.type==='hollowking' ? (e.phase===2?1.1:1.6) : (e.isBoss?2.0:1.0);
      if(d <= e.meleeRange && e.attackTimer<=0){
        e.attackTimer = atkInterval;
        meleeAttackFromEnemy(e);
      }

      if(stats.ranged && d>e.meleeRange*0.9 && d<e.rangedRange){
        e.rangedTimer -= dt;
        if(e.rangedTimer<=0){
          e.rangedTimer = e.rangedCd || stats.rangedCd || 1.6;
          rangedAttackFromEnemy(e);
        }
      }
    } else {
      e.state='idle';
      // gentle wander
      e.x += Math.sin(e.bob*0.5)*6*dt;
    }

    resolveObstacles(e, room.obstacles);
    e.x = clamp(e.x, e.r, room.width-e.r);
    e.y = clamp(e.y, e.r, room.height-e.r);
  }

  function meleeAttackFromEnemy(e){
    var p = state.player;
    var d = dist(e.x,e.y,p.x,p.y);
    if(d <= e.meleeRange + p.r){
      if(e.type==='sentinel' || e.type==='bogwarden' || e.type==='hollowking'){
        // small telegraph handled visually via slamTelegraph; damage applies now
      }
      damagePlayer(Math.max(1, Math.round(e.atk*(0.85+Math.random()*0.3))));
    }
  }

  function rangedAttackFromEnemy(e){
    var p = state.player;
    var dx=p.x-e.x, dy=p.y-e.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    var spread = e.type==='sentinel' ? [-0.5,-0.25,0,0.25,0.5] : (e.type==='bogwarden' ? [-0.2,0,0.2] : [0]);
    spread.forEach(function(off){
      var ang = Math.atan2(dy,dx) + off;
      projectiles.push({
        x:e.x, y:e.y, vx:Math.cos(ang)*160, vy:Math.sin(ang)*160,
        r:6, dmg:Math.max(1, Math.round(e.atk*0.7)), owner:'enemy', life:2.6, color:'#6be8d0'
      });
    });
    sfxBolt();
  }

  function damagePlayer(dmg){
    var p = state.player;
    if(p.invuln>0 || state.paused) return;
    dmg = Math.max(1, dmg - Math.floor(p.def*0.5));
    p.hp -= dmg;
    p.invuln = 0.7;
    spawnDamageNumber(p.x, p.y-p.r-6, dmg, '#c0463c');
    sfxHurt();
    if(p.hp<=0){
      p.hp = 0;
      showDeath();
    }
  }

  // ================= PLAYER ACTIONS =================
  function doAttack(){
    var p = state.player;
    if(!state.started || state.paused || dialogue) return;
    if(p.attackTimer>0) return;
    p.attackTimer = p.attackCd;
    p.attackActive = 0.14;
    sfxSwing();
    var hitX = p.x + p.facing.x*22, hitY = p.y + p.facing.y*22;
    enemies.forEach(function(e){
      if(e.deathTimer>=0) return;
      var d = dist(hitX,hitY,e.x,e.y);
      if(d < 30+e.r){
        var ex=(e.x-p.x), ey=(e.y-p.y); var el=Math.sqrt(ex*ex+ey*ey)||1;
        var dot = (ex/el)*p.facing.x + (ey/el)*p.facing.y;
        if(dot > 0.25){
          var dmg = Math.max(1, Math.round(p.atk*(0.85+Math.random()*0.3) - e.def));
          enemyDamage(e, dmg);
          e.x += p.facing.x*8; e.y += p.facing.y*8;
          if(e.deathTimer>=0) onEnemyRemoved(e);
        }
      }
    });
  }

  function doBolt(){
    var p = state.player;
    if(!state.started || state.paused || dialogue) return;
    if(p.boltCd>0 || p.mana<8) { if(p.mana<8) sfxDeny(); return; }
    p.boltCd = p.boltCdMax;
    p.mana -= 8;
    sfxBolt();
    projectiles.push({
      x:p.x+p.facing.x*16, y:p.y+p.facing.y*16,
      vx:p.facing.x*280, vy:p.facing.y*280,
      r:6, dmg:Math.max(1,Math.round(p.atk*0.8)), owner:'player', life:1.3, color:'#ffb648'
    });
  }

  function doInteract(){
    if(dialogue){ advanceDialogue(); return; }
    if(!state.started || state.paused) return;
    var p = state.player;
    var room = currentRoom();

    for(var i=0;i<room.npcs.length;i++){
      var n = room.npcs[i];
      if(dist(p.x,p.y,n.x,n.y) < 46+n.r){
        startDialogue(n);
        return;
      }
    }
    for(i=0;i<room.chests.length;i++){
      var c = room.chests[i];
      if(state.chestsOpened[c.id]) continue;
      if(dist(p.x,p.y,c.x,c.y) < 42){
        openChest(c);
        return;
      }
    }
    if(room.beacon && room.beacon.manual && !state.beacons[room.beacon.id]){
      if(dist(p.x,p.y,room.beacon.x,room.beacon.y) < 48){
        state.beacons[room.beacon.id] = true;
        toast(room.beacon.name + ' reignites!');
        sfxBeacon();
        save();
        return;
      }
    }
  }

  function startDialogue(npc){
    var lines = npc.dynamic ? keeperLines() : npc.lines;
    dialogue = {name:npc.name, lines:lines, idx:0};
    sfxDialogue();
  }
  function keeperLines(){
    var n = beaconsCount();
    if(n===0) return ["Rill tends the old post here, watching for a flicker of light on the hills.", "Not one beacon burns yet. The wood is closest — start there, traveler."];
    if(n===3) return ["All three flames burn again! Rill's eyes shine with hope.", "The way to the Hollow Keep stands open. Go — finish what you began."];
    return ["Rill counts the beacons every dusk. " + n + " of 3 now burn.", "Keep going. The valley remembers every light you bring back."];
  }
  function advanceDialogue(){
    dialogue.idx++;
    if(dialogue.idx >= dialogue.lines.length){ dialogue = null; return; }
    sfxDialogue();
  }

  function openChest(c){

    var item = ITEMS[c.item];
    item.apply(state.player);

  // ================= PROJECTILES / PICKUPS / PARTICLES =================
  function spawnDamageNumber(x,y,text,color){
    particles.push({x:x,y:y,vy:-28,text:String(text),color:color,life:0.9});
  }
  function toast(text){
    toasts.push({text:text, life:2.4});
  }

  function updateProjectiles(dt, room){
    for(var i=projectiles.length-1;i>=0;i--){
      var pr = projectiles[i];
      pr.x += pr.vx*dt; pr.y += pr.vy*dt; pr.life -= dt;
      var hitObstacle = false;
      for(var j=0;j<room.obstacles.length;j++){
        var o=room.obstacles[j];
        if(o.solid===false) continue;
        if(pr.x>o.x&&pr.x<o.x+o.w&&pr.y>o.y&&pr.y<o.y+o.h){ hitObstacle=true; break; }
      }
      var remove = pr.life<=0 || hitObstacle || pr.x<0||pr.x>room.width||pr.y<0||pr.y>room.height;
      if(pr.owner==='player'){
        for(var k=0;k<enemies.length;k++){
          var e = enemies[k];
          if(e.deathTimer>=0) continue;
          if(dist(pr.x,pr.y,e.x,e.y) < pr.r+e.r){
            var dmg = Math.max(1, pr.dmg-e.def);
            enemyDamage(e,dmg);
            if(e.deathTimer>=0) onEnemyRemoved(e);
            remove = true; break;
          }
        }
      } else {
        var p = state.player;
        if(dist(pr.x,pr.y,p.x,p.y) < pr.r+p.r){
          damagePlayer(pr.dmg);
          remove = true;
        }
      }
      if(remove) projectiles.splice(i,1);
    }
  }

  function updatePickups(dt){
    var p = state.player;
    for(var i=pickups.length-1;i>=0;i--){
      var pk = pickups[i];
      pk.life -= dt; pk.bob += dt;
      if(dist(pk.x,pk.y,p.x,p.y) < p.r+12){
        if(pk.type==='heart'){ p.hp = Math.min(p.maxHp, p.hp+8); spawnDamageNumber(p.x,p.y-p.r-6,'+8','#c0463c'); }
        else { p.mana = Math.min(p.maxMana, p.mana+8); spawnDamageNumber(p.x,p.y-p.r-6,'+8','#6be8d0'); }
        pickups.splice(i,1); continue;
      }
      if(pk.life<=0) pickups.splice(i,1);
    }
  }

  function updateParticles(dt){
    for(var i=particles.length-1;i>=0;i--){
      var pt = particles[i];
      pt.life -= dt; pt.y += pt.vy*dt; pt.vy += 40*dt;
      if(pt.life<=0) particles.splice(i,1);
    }
    for(i=toasts.length-1;i>=0;i--){
      toasts[i].life -= dt;
      if(toasts[i].life<=0) toasts.splice(i,1);
    }
  }

  // ================= UPDATE =================
  var lastTime = null;

  function updatePlayerMovement(dt, room){
    var p = state.player;
    var vx=0, vy=0;
    if(held.up) vy-=1;
    if(held.down) vy+=1;
    if(held.left) vx-=1;
    if(held.right) vx+=1;
    if(vx!==0||vy!==0){
      var len = Math.sqrt(vx*vx+vy*vy);
      vx/=len; vy/=len;
      p.facing = {x:vx,y:vy};
      p.x += vx*p.speed*dt;
      p.y += vy*p.speed*dt;
    }
    resolveObstacles(p, room.obstacles);
    p.x = clamp(p.x, p.r, room.width-p.r);
    p.y = clamp(p.y, p.r, room.height-p.r);
  }

  function checkExits(room){
    var p = state.player;
    for(var i=0;i<room.exits.length;i++){
      var ex = room.exits[i];
      var r = ex.rect;
      if(p.x>r.x && p.x<r.x+r.w && p.y>r.y && p.y<r.y+r.h){
        if(ex.gated && beaconsCount()<3){
          if(!ex._denied){ ex._denied = true; toast('The way is sealed — relight all 3 beacons first.'); sfxDeny(); }
          // push player back out of the gate
          var cx = r.x+r.w/2, cy = r.y+r.h/2;
          var dx = p.x-cx, dy=p.y-cy, d=Math.sqrt(dx*dx+dy*dy)||1;
          p.x += (dx/d)*4; p.y += (dy/d)*4;
          continue;
        }
        ex._denied = false;
        requestTransition(ex.to, ex.spawn);
        return;
      } else {
        ex._denied = false;
      }
    }
  }

  function update(dt){
    if(!state.started) return;
    state.elapsed += dt;

    if(transition.active){
      transition.timer += dt*transition.dir;
      if(transition.timer<=-1){
        transition.timer = -1;
        var pend = transition.pending;
        enterRoom(pend.roomId, pend.spawn);
        transition.dir = 1;
      } else if(transition.timer>=0){
        transition.timer = 0;
        transition.active = false;
      }
      updateParticles(dt);
      return;
    }

    if(state.paused || dialogue){
      updateParticles(dt);
      return;
    }

    var room = currentRoom();
    var p = state.player;

    updatePlayerMovement(dt, room);
    checkExits(room);

    p.attackTimer = Math.max(0, p.attackTimer-dt);
    p.attackActive = Math.max(0, p.attackActive-dt);
    p.boltCd = Math.max(0, p.boltCd-dt);
    p.invuln = Math.max(0, p.invuln-dt);
    p.mana = Math.min(p.maxMana, p.mana + 3*dt);

    for(var i=enemies.length-1;i>=0;i--){
      updateEnemy(enemies[i], dt, room);
      if(enemies[i].dead) enemies.splice(i,1);
    }

    updateProjectiles(dt, room);
    updatePickups(dt);
    updateParticles(dt);

    if(!reduceMotion){
      ambientParticles.forEach(function(a){ a.phase += dt*a.speed; });
    }

    camera.x = clamp(p.x - W/2, 0, Math.max(0, room.width-W));
    camera.y = clamp(p.y - H/2, 0, Math.max(0, room.height-H));

    areaBanner.timer = Math.max(0, areaBanner.timer-dt);

    if(Math.floor(state.elapsed) % 12 === 0 && Math.floor(state.elapsed*10)%10===0){
      save();
    }
  }

  // ================= RENDER =================
  var BIOME_BG = {
    village:['#1c2d1f','#101a14'],
    forest:['#132318','#0b1610'],
    fen:['#101f22','#08151a'],
    ruins:['#1a1826','#0f0d18'],
    keep:['#1b1224','#0c0714']
  };

  function drawBackground(room){
    var cols = BIOME_BG[room.biome] || BIOME_BG.village;
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function drawGroundTexture(room){
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    var step = 64;
    var startX = -((camera.x) % step), startY = -((camera.y) % step);
    for(var x=startX; x<W; x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(var y=startY; y<H; y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.restore();
  }

  function drawFlatObstacle(o){
    if(o.type!=='water') return;
    ctx.save();
    var g = ctx.createLinearGradient(o.x,o.y,o.x,o.y+o.h);
    g.addColorStop(0,'#1c3d47'); g.addColorStop(1,'#0e242c');
    ctx.fillStyle = g;
    roundRect(ctx, o.x,o.y,o.w,o.h, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(107,232,208,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawObstacle(o){
    ctx.save();
    var cx = o.x+o.w/2, cy = o.y+o.h/2;
    if(o.type==='tree'){
      ctx.fillStyle = '#2c1d12';
      ctx.fillRect(cx-4, cy, 8, o.h/2);
      var g = ctx.createRadialGradient(cx-o.w*0.15,cy-o.h*0.15,4,cx,cy,o.w*0.7);
      g.addColorStop(0,'#5c8a68'); g.addColorStop(1,'#233f2c');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx,cy,o.w*0.62,0,Math.PI*2); ctx.fill();
    } else if(o.type==='rock'){
      ctx.fillStyle = '#4a4a56';
      ctx.beginPath();
      ctx.moveTo(o.x,o.y+o.h*0.6); ctx.lineTo(o.x+o.w*0.25,o.y); ctx.lineTo(o.x+o.w*0.75,o.y+o.h*0.1);
      ctx.lineTo(o.x+o.w,o.y+o.h*0.55); ctx.lineTo(o.x+o.w*0.7,o.y+o.h); ctx.lineTo(o.x+o.w*0.2,o.y+o.h);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.stroke();
    } else if(o.type==='hut'){
      ctx.fillStyle = '#5a4326';
      ctx.fillRect(o.x, cy, o.w, o.h/2);
      ctx.fillStyle = '#7a5a34';
      ctx.beginPath(); ctx.moveTo(o.x-8,cy); ctx.lineTo(cx,o.y); ctx.lineTo(o.x+o.w+8,cy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffb648';
      ctx.fillRect(cx-8, cy+o.h*0.18, 16, 14);
    } else if(o.type==='wall'){
      ctx.fillStyle = '#3a3646';
      ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.strokeRect(o.x,o.y,o.w,o.h);
    } else if(o.type==='pillar'){
      ctx.fillStyle = '#352a44';
      ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle = '#4a3c5c';
      ctx.fillRect(o.x-4,o.y-6,o.w+8,10);
    } else if(o.type==='bramble'){
      ctx.strokeStyle = '#5a3a2c';
      ctx.lineWidth = 3;
      for(var i=0;i<5;i++){
        ctx.beginPath();
        ctx.moveTo(cx, o.y+o.h);
        ctx.lineTo(o.x+Math.random()*o.w, o.y+Math.random()*o.h*0.4);
        ctx.stroke();
      }
    } else if(o.type==='reed'){
      ctx.strokeStyle = '#4f7a5b';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(o.x,o.y+o.h); ctx.quadraticCurveTo(o.x-4,o.y+o.h*0.4,o.x+4,o.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(o.x+o.w,o.y+o.h); ctx.quadraticCurveTo(o.x+o.w+4,o.y+o.h*0.4,o.x+o.w-4,o.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBeacon(b){
    var lit = state.beacons[b.id];
    ctx.save();
    ctx.fillStyle = '#3a2c1c';
    ctx.fillRect(b.x-6, b.y-10, 12, 40);

      ctx.fillStyle = g;

      ctx.fillStyle = '#ffd27a';

      ctx.moveTo(b.x,b.y-46); ctx.quadraticCurveTo(b.x+9,b.y-28,b.x,b.y-10); ctx.quadraticCurveTo(b.x-9,b.y-28,b.x,b.y-46);
      ctx.fill();

      ctx.fillStyle = '#5a5a5a';
      ctx.beginPath(); ctx.arc(b.x,b.y-16,7,0,Math.PI*2); ctx.fill();
    }

  function drawChest(c){
    if(state.chestsOpened[c.id]) return;
    ctx.save();
    ctx.fillStyle = '#7a5a2c';
    ctx.fillRect(c.x-14,c.y-8,28,16);

  function drawNpc(n){
    ctx.save();
    ctx.translate(n.x, n.y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0,n.r*0.8,n.r*0.8,n.r*0.3,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4f7a5b';
    ctx.beginPath(); ctx.moveTo(-n.r,n.r); ctx.quadraticCurveTo(0,-n.r*1.4,n.r,n.r); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e9c9a0';
    ctx.beginPath(); ctx.arc(0,-n.r*0.9,n.r*0.6,0,Math.PI*2); ctx.fill();

  function drawPlayer(p){
    ctx.save();
    var alpha = 1;
    if(p.invuln>0 && Math.floor(p.invuln*14)%2===0) alpha = 0.45;
    ctx.globalAlpha = alpha;
    ctx.translate(p.x,p.y);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0,p.r*0.85,p.r*0.85,p.r*0.32,0,0,Math.PI*2); ctx.fill();

    // cloak/body
    var g = ctx.createLinearGradient(0,-p.r,0,p.r);
    g.addColorStop(0,'#f0e6c8'); g.addColorStop(1,'#c9b98a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-p.r,p.r); ctx.quadraticCurveTo(0,-p.r*1.3,p.r,p.r); ctx.closePath(); ctx.fill();

    // head
    ctx.fillStyle = '#f3d9b8';
    ctx.beginPath(); ctx.arc(0,-p.r*0.95,p.r*0.62,0,Math.PI*2); ctx.fill();

    // lantern (positioned toward facing)
    var lx = p.facing.x*p.r*1.5, ly = p.facing.y*p.r*1.5 + 4;
    var lg = ctx.createRadialGradient(lx,ly,1,lx,ly,20);
    lg.addColorStop(0,'rgba(255,182,72,0.9)'); lg.addColorStop(1,'rgba(255,182,72,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(lx,ly,20,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a4326';
    ctx.fillRect(lx-4,ly-6,8,12);
    ctx.fillStyle = '#ffd27a';
    ctx.fillRect(lx-2,ly-4,4,8);

    // attack swing
    if(p.attackActive>0){
      ctx.save();
      ctx.globalAlpha = alpha * (p.attackActive/0.14) * 0.7;
      ctx.strokeStyle = '#ffd27a';
      ctx.lineWidth = 5;
      var ang = Math.atan2(p.facing.y,p.facing.x);
      ctx.beginPath();
      ctx.arc(0,0,26, ang-0.7, ang+0.7);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  function drawEnemy(e){
    ctx.save();
    var alpha = e.deathTimer>=0 ? clamp(e.deathTimer/0.4,0,1) : 1;
    ctx.globalAlpha = alpha;
    ctx.translate(e.x, e.y + (reduceMotion?0:Math.sin(e.bob*3)*1.5));
    var scale = e.deathTimer>=0 ? alpha : 1;
    ctx.scale(scale,scale);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(0,e.r*0.85,e.r*0.85,e.r*0.3,0,0,Math.PI*2); ctx.fill();

    var flashCol = e.hitFlash>0;

    if(e.type==='wisp'){
      var g = ctx.createRadialGradient(0,0,1,0,0,e.r);
      g.addColorStop(0, flashCol?'#ffffff':'#a8f7e8'); g.addColorStop(1,'#3fae98');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0,-e.r); ctx.quadraticCurveTo(e.r,0,0,e.r*1.1); ctx.quadraticCurveTo(-e.r,0,0,-e.r);
      ctx.fill();
      ctx.fillStyle = '#132a26';
      ctx.beginPath(); ctx.arc(-e.r*0.28,-e.r*0.1,e.r*0.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r*0.28,-e.r*0.1,e.r*0.1,0,Math.PI*2); ctx.fill();
    } else if(e.type==='hound'){
      ctx.fillStyle = flashCol?'#ffffff':'#4a3626';
      ctx.beginPath(); ctx.ellipse(0,0,e.r,e.r*0.68,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2c1d12';
      for(var i=-1;i<=1;i+=2){
        ctx.beginPath(); ctx.moveTo(i*e.r*0.5,-e.r*0.5); ctx.lineTo(i*e.r*0.7,-e.r*1.05); ctx.lineTo(i*e.r*0.25,-e.r*0.5); ctx.fill();
      }
      ctx.fillStyle = '#c0463c';
      ctx.beginPath(); ctx.arc(-e.r*0.3,-e.r*0.1,e.r*0.09,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r*0.3,-e.r*0.1,e.r*0.09,0,Math.PI*2); ctx.fill();
    } else if(e.type==='bogwarden' || e.type==='sentinel'){
      ctx.fillStyle = flashCol?'#ffffff':(e.type==='bogwarden'?'#345143':'#3a3646');
      ctx.beginPath(); ctx.moveTo(-e.r,e.r); ctx.quadraticCurveTo(0,-e.r*1.4,e.r,e.r); ctx.closePath(); ctx.fill();
      ctx.fillStyle = e.type==='bogwarden' ? '#6be8d0' : '#c0463c';
      ctx.beginPath(); ctx.arc(-e.r*0.32,-e.r*0.5,e.r*0.13,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r*0.32,-e.r*0.5,e.r*0.13,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,-e.r*1.3); ctx.lineTo(0,-e.r*0.6); ctx.stroke();
    } else if(e.type==='hollowking'){
      ctx.fillStyle = flashCol?'#ffffff':'#150c1e';
      ctx.beginPath(); ctx.moveTo(-e.r*1.1,e.r); ctx.quadraticCurveTo(0,-e.r*1.6,e.r*1.1,e.r); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffb648'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-e.r*0.4,-e.r*0.6); ctx.lineTo(0,e.r*0.4); ctx.lineTo(e.r*0.35,-e.r*0.3); ctx.stroke();
      ctx.fillStyle = '#ffb648';
      for(var k=-1;k<=1;k++){
        ctx.beginPath(); ctx.moveTo(k*e.r*0.4,-e.r*1.1); ctx.lineTo(k*e.r*0.4-6,-e.r*1.5); ctx.lineTo(k*e.r*0.4+6,-e.r*1.5); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#ff8a65';
      ctx.beginPath(); ctx.arc(-e.r*0.3,-e.r*0.55,e.r*0.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r*0.3,-e.r*0.55,e.r*0.1,0,Math.PI*2); ctx.fill();
    }

    ctx.restore();

    // HP bar for tougher enemies / boss
    if((e.isBoss || e.maxHp>15) && e.deathTimer<0){
      var w = e.isBoss? 60:34;
      ctx.save();
      ctx.translate(e.x-w/2, e.y-e.r-14);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,w,5);
      ctx.fillStyle = e.isBoss ? '#c0463c' : '#6be8d0';
      ctx.fillRect(0,0,w*clamp(e.hp/e.maxHp,0,1),5);
      ctx.restore();
    }
  }

  function drawAmbient(room){
    if(reduceMotion) return;
    var col = room.biome==='forest' ? 'rgba(255,214,120,0.55)' : (room.biome==='fen' ? 'rgba(233,226,201,0.18)' : 'rgba(107,232,208,0.35)');
    ctx.save();
    ctx.fillStyle = col;
    ambientParticles.forEach(function(a){
      var yy = a.y + Math.sin(a.phase)*10;
      var xx = a.x + Math.cos(a.phase*0.7)*8;
      ctx.globalAlpha = 0.4+Math.sin(a.phase*2)*0.3;
      ctx.beginPath(); ctx.arc(xx,yy,a.r,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  function drawWorld(){
    var room = currentRoom();
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    drawBackground(room);
    drawGroundTexture(room);

    room.obstacles.forEach(drawFlatObstacle);
    drawAmbient(room);

    var depth = [];
    room.obstacles.forEach(function(o){ if(o.type!=='water') depth.push({y:o.y+o.h, draw:function(){drawObstacle(o);}}); });
    room.npcs.forEach(function(n){ depth.push({y:n.y+n.r, draw:function(){drawNpc(n);}}); });
    room.chests.forEach(function(c){ depth.push({y:c.y+10, draw:function(){drawChest(c);}}); });
    if(room.beacon) depth.push({y:room.beacon.y+20, draw:function(){drawBeacon(room.beacon);}});
    enemies.forEach(function(e){ depth.push({y:e.y+e.r, draw:function(){drawEnemy(e);}}); });
    pickups.forEach(function(pk){ depth.push({y:pk.y, draw:function(){drawPickup(pk);}}); });
    depth.push({y:state.player.y+state.player.r, draw:function(){drawPlayer(state.player);}});

    depth.sort(function(a,b){ return a.y-b.y; });
    depth.forEach(function(d){ d.draw(); });

    projectiles.forEach(drawProjectile);

    room.exits.forEach(drawSign);

    particles.forEach(function(pt){
      ctx.save();
      ctx.globalAlpha = clamp(pt.life/0.9,0,1);
      ctx.fillStyle = pt.color;
      ctx.font = '700 13px Vollkorn, serif';
      ctx.textAlign = 'center';
      ctx.fillText(pt.text, pt.x, pt.y);
      ctx.restore();
    });

    ctx.restore();

    if(transition.active){
      ctx.save();
      ctx.globalAlpha = Math.abs(transition.timer);
      ctx.fillStyle = '#05060b';
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
  }

  function drawBar(x,y,w,h,pct,fg,bg,label){
    ctx.save();
    ctx.fillStyle = bg;
    roundRect(ctx,x,y,w,h,4); ctx.fill();
    ctx.fillStyle = fg;
    roundRect(ctx,x,y,Math.max(2,w*clamp(pct,0,1)),h,4); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth=1;
    roundRect(ctx,x,y,w,h,4); ctx.stroke();
    if(label){
      ctx.fillStyle = '#0b1220';
      ctx.font = '700 10px Vollkorn, serif';
      ctx.textAlign='left';
      ctx.fillText(label, x+6, y+h-3);
    }
    ctx.restore();
  }

  function drawHUD(){
    var p = state.player;
    ctx.save();
    ctx.fillStyle = 'rgba(11,18,32,0.55)';
    roundRect(ctx,10,10,190,58,8); ctx.fill();
    drawBar(20,20,150,14, p.hp/p.maxHp, '#c0463c', 'rgba(0,0,0,0.4)', 'HP ' + Math.ceil(p.hp)+'/'+p.maxHp);
    drawBar(20,40,150,10, p.mana/p.maxMana, '#6be8d0', 'rgba(0,0,0,0.4)', null);
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(11,18,32,0.55)';
    roundRect(ctx, W-190,42,180,54,8); ctx.fill();
    ctx.fillStyle = '#ffb648';
    ctx.font = '700 13px Vollkorn, serif';
    ctx.textAlign='right';
    ctx.fillText('Lv ' + p.level, W-16, 60);
    drawBar(W-176,66,150,8, p.xp/p.xpToNext, '#ffb648', 'rgba(0,0,0,0.4)', null);
    var names=['forest','fen','ruins'];
    for(var i=0;i<3;i++){
      var lit = state.beacons[names[i]];
      ctx.beginPath();
      ctx.arc(W-176+i*18+8, 82, 5, 0, Math.PI*2);
      ctx.fillStyle = lit ? '#ffb648' : 'rgba(255,255,255,0.15)';
      ctx.fill();
    }
    ctx.restore();

    if(areaBanner.timer>0){
      ctx.save();
      ctx.globalAlpha = clamp(areaBanner.timer/0.5,0,1) * clamp((2.2-areaBanner.timer)/0.4+1,0,1);
      ctx.globalAlpha = Math.min(1, ctx.globalAlpha);
      ctx.textAlign='center';
      ctx.font = '700 20px Cinzel, serif';
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillText(areaBanner.text, W/2+1, 47);
      ctx.fillStyle = '#ffb648';
      ctx.fillText(areaBanner.text, W/2, 46);
      ctx.restore();
    }

    var ty = 74;
    toasts.forEach(function(t){
      ctx.save();
      ctx.globalAlpha = clamp(t.life/0.4,0,1);
      ctx.font = '600 13px Vollkorn, serif';
      ctx.textAlign='center';
      var tw = ctx.measureText(t.text).width+24;
      ctx.fillStyle = 'rgba(11,18,32,0.75)';
      roundRect(ctx, W/2-tw/2, ty-14, tw, 24, 6); ctx.fill();
      ctx.fillStyle = '#e9e2c9';
      ctx.fillText(t.text, W/2, ty+2);
      ctx.restore();
      ty += 28;
    });

    if(dialogue){
      ctx.save();
      var boxH = 92;
      ctx.fillStyle = 'rgba(8,10,18,0.9)';
      roundRect(ctx, 20, H-boxH-16, W-40, boxH, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,182,72,0.4)'; ctx.lineWidth=1.5;
      roundRect(ctx, 20, H-boxH-16, W-40, boxH, 10); ctx.stroke();
      ctx.fillStyle = '#ffb648';
      ctx.font = '700 13px Cinzel, serif';
      ctx.textAlign='left';
      ctx.fillText(dialogue.name, 36, H-boxH+6);
      ctx.fillStyle = '#e9e2c9';
      ctx.font = '15px Vollkorn, serif';
      var lines = wrapText(ctx, dialogue.lines[dialogue.idx], W-90);
      lines.slice(0,3).forEach(function(l,i){
        ctx.fillText(l, 36, H-boxH+30+i*20);
      });
      ctx.fillStyle = 'rgba(233,226,201,0.6)';
      ctx.font = '11px Vollkorn, serif';
      ctx.textAlign='right';
      ctx.fillText(dialogue.idx < dialogue.lines.length-1 ? 'E ▸ continue' : 'E ▸ close', W-36, H-24);
      ctx.restore();
    }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    if(!state.started){
      drawBackground(currentRoom());
      return;
    }
    drawWorld();
    drawHUD();
  }

  // ================= LOOP =================
  function frame(ts){
    if(lastTime===null) lastTime = ts;
    var dt = Math.min(0.05, (ts-lastTime)/1000);
    lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ================= BOOT =================
  enterRoom('hub', roomEntryPoint('hub'));
  openStartScreen();
  requestAnimationFrame(frame);

})();
</script>
