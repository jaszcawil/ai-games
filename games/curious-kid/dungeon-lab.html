<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a18">
<title>The Abandoned Laboratory — Curious Kid</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/world.css">
<link rel="stylesheet" href="css/challenge.css">
</head>
<body>

  <canvas id="world-canvas"></canvas>
  <div id="world-vignette" aria-hidden="true"></div>

  <div class="world-topbar">
    <button id="btn-menu" class="world-round-btn" aria-label="Pause menu" title="Menu">☰</button>
    <div id="zone-label">The Abandoned Laboratory</div>
    <div class="world-topbar-right">
      <button id="btn-quicksave" class="world-round-btn" aria-label="Quick save" title="Quick Save">💾</button>
      <button id="btn-quickload" class="world-round-btn" aria-label="Quick load" title="Quick Load">📂</button>
      <button id="btn-mute" class="world-round-btn" aria-label="Mute all sound" title="Mute">🔊</button>
    </div>
  </div>

  <div id="world-progress">Entering the Abandoned Laboratory…</div>
  <div id="world-toast"></div>
  <div id="cam-hint">🖱️ Drag to look around · Scroll to zoom</div>

  <div id="joy-base">
    <div id="joy-knob"></div>
  </div>

  <div class="world-action-btns">
    <button id="btn-run" class="world-btn-round">Run</button>
    <button id="btn-jump" class="world-btn-round">Jump</button>
    <button id="btn-interact" class="world-btn-round">✋<br>Interact</button>
  </div>

  <div id="fade-curtain" class="hidden" aria-hidden="true"></div>

  <script src="lib/three.min.js"></script>
  <script src="lib/GLTFLoader.js"></script>
  <script src="lib/fflate.min.js"></script>
  <script src="lib/FBXLoader.js"></script>
  <script>
    window.CKQKC_BGM_PLAYLIST = [
      'assets/audio/dungeon/false-vacuum-decay.mp3',
      'assets/audio/dungeon/frame-dragging.mp3',
      'assets/audio/dungeon/drifting-memories.mp3'
    ];
  </script>
  <script src="js/audio.js"></script>
  <script src="js/save.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/characters-data.js"></script>
  <script src="js/abilities-data.js"></script>
  <script src="js/npc-data.js"></script>
  <script src="js/challenge-system.js"></script>
  <script src="js/pause-menu.js"></script>
  <script src="js/dungeon-lab.js"></script>
</body>
</html>
