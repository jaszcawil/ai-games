<title>Wyldkin: Champion's Path</title>
<style>
  :root{
    --ink:#1c1a24; --paper:#fdf6e8; --accent:#3f6fd6; --accent2:#e0483c;
    --panel:#fffaf0; --panelBorder:#3a3245; --btn:#4f6fd0; --btnDark:#33459a;
    --hpgreen:#4caf50; --hpyellow:#ffb300; --hpred:#e53935;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --ink:#f0ecda; --paper:#1c1a24; --panel:#241f2e; --panelBorder:#6a5f80; }
  }
  :root[data-theme="dark"]{ --ink:#f0ecda; --paper:#1c1a24; --panel:#241f2e; --panelBorder:#6a5f80; }
  *{ box-sizing:border-box; }
  body{ background:var(--paper); }
  #wyldkinRoot{
    position:fixed; inset:0; background:#000; color:var(--ink);
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif; overflow:hidden; user-select:none;
    display:flex; flex-direction:column;
  }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ background:var(--btn); color:#fff; border:2px solid var(--btnDark); border-radius:8px; padding:8px 12px; font-weight:600; font-size:14px; }
  .btn:active{ transform:translateY(1px); }
  .btn.small{ padding:5px 9px; font-size:12px; }
  .btn.primary{ background:var(--accent2); border-color:#a5281f; }
  .btn.danger{ background:#8a3030; border-color:#5a1c1c; }
  .btn.disabled, .btn:disabled{ opacity:0.4; pointer-events:none; }
  .btn.tabbtn.active{ background:var(--accent2); border-color:#a5281f; }

  #hud{ display:flex; justify-content:space-between; align-items:center; padding:6px 10px;
    background:rgba(0,0,0,0.55); color:#fff; font-size:13px; z-index:20; flex-wrap:wrap; gap:6px; }
  #hud .hudLeft, #hud .hudRight{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  #canvasWrap{ position:relative; flex:1; min-height:0; background:#111; }
  #gameCanvas{ position:absolute; inset:0; display:block; }

  #touchControls{ position:absolute; inset:0; pointer-events:none; z-index:15; }
  .dpad{ position:absolute; left:24px; bottom:24px; width:500px; height:500px; pointer-events:auto; }
  .dpadBtn{ position:absolute; width:150px; height:150px; background:rgba(255,255,255,0.22); border:2px solid rgba(255,255,255,0.5);
    border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; touch-action:none; }
  #dpad_up{ left:150px; top:0; } #dpad_down{ left:150px; top:300px; } #dpad_left{ left:0; top:150px; } #dpad_right{ left:300px; top:150px; }
  #actionBtn{ position:absolute; right:30px; bottom:30px; width:200px; height:200px; border-radius:50%;
    background:rgba(224,72,60,0.85); border:3px solid rgba(255,255,255,0.6); color:#fff; font-weight:700; pointer-events:auto; font-size:2rem; }

  #dialogueBox{ position:absolute; left:4%; right:4%; bottom:4%; max-width:760px; margin:0 auto;
    background:var(--panel); border:3px solid var(--panelBorder); border-radius:12px; padding:16px 18px;
    font-size:2.5rem; line-height:1.4; z-index:30; box-shadow:0 6px 18px rgba(0,0,0,0.4); min-height:60px; }
  #dialogueBox::after{ content:'▼ tap to continue'; display:block; text-align:right; font-size:1rem; opacity:0.6; margin-top:6px; }

  #toast{ position:absolute; left:50%; top:14px; transform:translate(-50%,-140%); background:rgba(0,0,0,0.85); color:#fff;
    padding:8px 16px; border-radius:20px; font-size:13px; z-index:60; transition:transform 0.25s; }
  #toast.show{ transform:translate(-50%,0); }
  #fadeLayer{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity 0.22s; z-index:80; }

  .overlayFull{ position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(160deg,#2a3f6b,#1b2542); color:#fff; padding:16px; text-align:center; overflow:auto; }
  #titleScreen h1{ font-size:clamp(28px,6vw,52px); margin:0 0 6px; text-shadow:2px 3px 0 #12193a; }
  #titleScreen p.tagline{ opacity:0.85; margin-bottom:26px; }
  #titleScreen .btnCol{ display:flex; flex-direction:column; gap:10px; width:min(280px,80vw); }
  #titleScreen .btn{ font-size:16px; padding:12px; }
  #continuePicker{ display:none; position:absolute; inset:0; background:rgba(0,0,0,0.6); z-index:50; align-items:center; justify-content:center; }
  #continuePicker .panel{ background:var(--panel); color:var(--ink); border-radius:12px; padding:18px; width:min(420px,90vw); border:3px solid var(--panelBorder); }

  #starterScreen{ background:linear-gradient(160deg,#3a5f2e,#1b2b16); }
  #starterCards{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:960px; }
  .starterCard{ background:var(--panel); color:var(--ink); border-radius:14px; padding:14px; width:220px; border:3px solid var(--panelBorder); }
  .starterSprite{ image-rendering:pixelated; display:block; margin:0 auto 8px; }
  .starterName{ font-size:18px; font-weight:700; }
  .starterType{ font-size:12px; opacity:0.7; margin-bottom:8px; }
  .starterDesc{ font-size:12px; min-height:52px; margin-bottom:10px; }

  #battleScreen{ position:absolute; inset:0; z-index:35; display:flex; flex-direction:column; background:#000; }
  #battleCanvasWrap{ position:relative; flex:1; min-height:0; }
  #battleCanvas{ position:absolute; inset:0; display:block; }
  #battleHpEnemy{ position:absolute; left:4%; top:5%; width:44%; max-width:320px; }
  #battleHpPlayer{ position:absolute; right:4%; top:52%; width:46%; max-width:320px; }
  .hpPlate{ background:rgba(255,255,255,0.92); border:2px solid #333; border-radius:8px; padding:6px 10px; font-size:12px; color:#222; }
  .hpPlate b{ font-size:13px; }
  .hpPlate .hpBarBg{ height:8px; margin-top:4px; }
  #battleMsgBox{ background:var(--panel); color:var(--ink); border-top:3px solid var(--panelBorder); padding:14px 16px; font-size:15px; min-height:50px; }
  #battleActions{ background:var(--panel); color:var(--ink); padding:8px 10px 10px; max-height:44vh; overflow:auto; }
  #battleTabsWrap{ display:flex; gap:6px; padding:6px 10px 0; background:var(--panel); color:var(--ink); flex-wrap:wrap; }
  .moveGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .moveBtn{ text-align:left; padding:10px; border-radius:8px; }
  .type-Ember{background:#d9542a;border-color:#8a3010;} .type-Aqua{background:#2680c2;border-color:#0c4870;}
  .type-Verdant{background:#4d9a34;border-color:#1e4a1a;} .type-Volt{background:#c7a825;border-color:#5a4d0e;}
  .type-Terra{background:#8a6a4a;border-color:#3a2a1c;} .type-Sky{background:#3d9ec4;border-color:#0d3646;}
  .type-Shade{background:#5b4a8a;border-color:#241f33;} .type-Mind{background:#8a5cc9;border-color:#2a1740;}
  .type-Basic{background:#7a7263;border-color:#332f28;}

  .partyList, .bagList{ display:flex; flex-direction:column; gap:8px; }
  .monRow{ display:flex; gap:10px; align-items:center; background:rgba(120,120,120,0.12); border-radius:10px; padding:8px; }
  .monRow.fainted{ opacity:0.5; }
  .monSprite{ image-rendering:pixelated; flex:none; }
  .monInfo{ flex:1; font-size:13px; }
  .hpBarBg{ background:#333; border-radius:4px; height:8px; margin:3px 0; overflow:hidden; }
  .hpBarFg{ height:100%; }
  .monActions{ display:flex; flex-direction:column; gap:4px; }
  .status{ font-size:10px; padding:1px 5px; border-radius:6px; background:#a33; color:#fff; }
  .itemRow{ display:flex; justify-content:space-between; align-items:center; gap:8px; background:rgba(120,120,120,0.12); border-radius:10px; padding:8px 10px; font-size:13px; }
  .tag{ font-size:11px; opacity:0.6; }

  #pauseMenu{ position:absolute; inset:0; z-index:45; background:rgba(10,8,16,0.92); color:var(--ink); display:flex; flex-direction:column; }
  #pauseTabs{ display:flex; gap:4px; padding:10px; flex-wrap:wrap; background:var(--panel); border-bottom:3px solid var(--panelBorder); }
  #pauseBody{ flex:1; overflow:auto; padding:12px; background:var(--panel); }
  #pauseHeader{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; }
  .badgeGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .badgeItem{ background:rgba(120,120,120,0.12); border-radius:10px; padding:10px; display:flex; gap:8px; align-items:center; font-size:12px; opacity:0.5; }
  .badgeItem.got{ opacity:1; }
  .badgeIcon{ font-size:24px; color:#e0b32a; }
  .champBanner{ text-align:center; font-size:18px; margin-top:14px; }
  .slotList{ display:flex; flex-direction:column; gap:8px; }
  .slotRow{ display:flex; justify-content:space-between; align-items:center; background:rgba(120,120,120,0.12); border-radius:10px; padding:10px; font-size:13px; gap:8px; }

  #shopScreen{ position:absolute; inset:0; z-index:45; background:var(--panel); color:var(--ink); display:flex; flex-direction:column; }
  #shopHeader{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:rgba(0,0,0,0.12); }
  #shopBody{ flex:1; overflow:auto; padding:12px; }

  @media (max-width:520px){
    #hud{ font-size:11px; }
    .starterCard{ width:44vw; min-width:150px; }
    #dialogueBox{ font-size:13px; padding:12px; }
    .moveGrid{ grid-template-columns:1fr; }
    .dpad{ width:112px; height:112px; }
    .dpadBtn{ width:38px; height:38px; }
    #dpad_up{ left:37px; } #dpad_down{ left:37px; top:74px; } #dpad_right{ left:74px; top:37px; } #dpad_left{ top:37px; }
    #actionBtn{ width:54px; height:54px; font-size:11px; }
  }
  @media (max-height:480px){
    #battleActions{ max-height:36vh; }
  }

  @media (max-width:768px){
    .dpad {width:500px; height:500px;}
    .dpadBtn {width:100px; height:100px;}
    #dpad_up {left:100px;}
    #dpad_down {left:100px; top:200px;}
    #dpad_left {left:0; top:100px;}
    #dpad_right {left:200px; top:100px;}
  }
</style>

<div id="wyldkinRoot">
  <div id="hud" style="display:none">
    <div class="hudLeft"><span id="hudLead"></span></div>
    <div class="hudRight"><span id="hudMoney"></span><span id="hudBadges"></span><button class="btn small" id="menuBtn">Menu</button></div>
  </div>

  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="touchControls" style="display:none">
      <div class="dpad">
        <div class="dpadBtn" id="dpad_up">▲</div>
        <div class="dpadBtn" id="dpad_down">▼</div>
        <div class="dpadBtn" id="dpad_left">◀</div>
        <div class="dpadBtn" id="dpad_right">▶</div>
      </div>
      <button id="actionBtn">TALK<br>/USE</button>
    </div>

    <div id="dialogueBox" style="display:none"><span id="dialogueText"></span></div>
    <div id="toast"></div>
    <div id="fadeLayer"></div>

    <div id="titleScreen" class="overlayFull" style="display:none">
      <h1>Wyldkin</h1>
      <p class="tagline">Champion's Path &middot; catch, train, battle, become the best</p>
      <div class="btnCol">
        <button class="btn primary" id="newGameBtn">New Game</button>
        <button class="btn" id="titleContinueBtn">Continue</button>
      </div>
    </div>
    <div id="continuePicker">
      <div class="panel">
        <h3 style="margin-top:0">Continue</h3>
        <div id="loadSlotsWrap"></div>
        <button class="btn small" id="continueCancelBtn" style="margin-top:10px">Cancel</button>
      </div>
    </div>

    <div id="starterScreen" class="overlayFull" style="display:none">
      <h1 style="font-size:28px">Choose your partner, Jasz!</h1>
      <div id="starterCards"></div>
    </div>

    <div id="battleScreen" style="display:none">
      <div id="battleCanvasWrap"><canvas id="battleCanvas"></canvas>
        <div id="battleHpEnemy" class="hpPlate"></div>
        <div id="battleHpPlayer" class="hpPlate"></div>
      </div>
      <div id="battleMsgBox"></div>
      <div id="battleTabsWrap"></div>
      <div id="battleActions"></div>
    </div>

    <div id="pauseMenu" style="display:none">
      <div id="pauseHeader"><h2 style="margin:0">Menu</h2><button class="btn small" id="closeMenuBtn">Close</button></div>
      <div id="pauseTabs">
        <button class="btn small" id="ptab_party">Party</button>
        <button class="btn small" id="ptab_bag">Bag</button>
        <button class="btn small" id="ptab_badges">Sigils</button>
        <button class="btn small" id="ptab_save">Save</button>
        <button class="btn small" id="ptab_load">Load</button>
      </div>
      <div id="pauseBody"></div>
    </div>

    <div id="shopScreen" style="display:none">
      <div id="shopHeader"><h2 style="margin:0">Shop</h2><button class="btn small" id="closeShopBtn">Close</button></div>
      <div id="shopBody"></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== WYLDKIN: CHAMPION'S PATH ===================== */
/* p1: core data - types, moves, species */
'use strict';
const G = (window.G = window.G || {});

/* ---------- Types ---------- */
G.TYPES = ['Basic','Ember','Aqua','Verdant','Volt','Terra','Sky','Shade','Mind'];

/* effectiveness chart: ATK type -> { DEF type: multiplier } ; default 1 */
G.TYPE_CHART = {
  Ember:  { Verdant:2, Aqua:0.5, Ember:0.5, Terra:0.5 },
  Aqua:   { Ember:2, Terra:2, Aqua:0.5, Verdant:0.5 },
  Verdant:{ Aqua:2, Terra:2, Verdant:0.5, Ember:0.5, Sky:0.5 },
  Volt:   { Aqua:2, Sky:2, Volt:0.5, Verdant:0.5, Terra:0 },
  Terra:  { Ember:2, Volt:2, Sky:0.5, Verdant:0.5 },
  Sky:    { Verdant:2, Mind:2, Volt:0.5, Terra:0 },
  Shade:  { Mind:2, Shade:0.5, Basic:0 },
  Mind:   { Shade:0.5, Mind:0.5, Basic:1 },
  Basic:  { Shade:0 }
};
function typeMult(atkType, defTypes){
  let m = 1;
  const row = G.TYPE_CHART[atkType] || {};
  for (const dt of defTypes) m *= (row[dt] !== undefined ? row[dt] : 1);
  return m;
}
G.typeMult = typeMult;

/* ---------- Moves ---------- */
/* kind: 'phys'|'spec'|'status'  ; effect: optional {status, chance, statChange:{stat,stages,target}} */
G.MOVES = {
  scratch:   { name:'Scratch',    type:'Basic',   kind:'phys', power:35, acc:100, pp:30 },
  tackle:    { name:'Tackle',     type:'Basic',   kind:'phys', power:40, acc:100, pp:35 },
  bodyslam:  { name:'Body Slam',  type:'Basic',   kind:'phys', power:60, acc:95,  pp:20, effect:{status:'para', chance:10} },
  guard:     { name:'Guard Up',   type:'Basic',   kind:'status', power:0, acc:100, pp:20, effect:{statChange:{stat:'def',stages:1,target:'self'}} },
  quickstep: { name:'Quickstep',  type:'Basic',   kind:'status', power:0, acc:100, pp:20, effect:{statChange:{stat:'spe',stages:1,target:'self'}} },
  roar:      { name:'Roar',       type:'Basic',   kind:'status', power:0, acc:100, pp:15, effect:{statChange:{stat:'atk',stages:-1,target:'foe'}} },
  focus:     { name:'Focus',      type:'Basic',   kind:'status', power:0, acc:100, pp:15, effect:{statChange:{stat:'atk',stages:1,target:'self'}} },
  rest:      { name:'Rest',       type:'Basic',   kind:'status', power:0, acc:100, pp:10, effect:{heal:0.5} },

  ember:     { name:'Ember',      type:'Ember',   kind:'spec', power:35, acc:100, pp:25, effect:{status:'burn', chance:15} },
  flamewhip: { name:'Flame Whip', type:'Ember',   kind:'phys', power:55, acc:100, pp:20, effect:{status:'burn', chance:10} },
  infernoblast:{name:'Inferno Blast',type:'Ember',kind:'spec', power:85, acc:90,  pp:10, effect:{status:'burn', chance:25} },
  cinderclaw:{ name:'Cinder Claw',type:'Ember',   kind:'phys', power:70, acc:95,  pp:15 },
  pyrostomp: { name:'Pyro Stomp', type:'Ember',   kind:'phys', power:50, acc:100, pp:20 },

  splash:    { name:'Splash Jet', type:'Aqua',    kind:'spec', power:35, acc:100, pp:25 },
  aquawhirl: { name:'Aqua Whirl', type:'Aqua',    kind:'spec', power:55, acc:100, pp:20 },
  tidalcrash:{ name:'Tidal Crash',type:'Aqua',    kind:'phys', power:85, acc:90,  pp:10 },
  bubblebeam:{ name:'Bubblebeam', type:'Aqua',    kind:'spec', power:45, acc:100, pp:20, effect:{statChange:{stat:'spe',stages:-1,target:'foe'},chance:20} },
  finslash:  { name:'Fin Slash',  type:'Aqua',    kind:'phys', power:50, acc:100, pp:20 },

  vinewhip:  { name:'Vine Whip',  type:'Verdant', kind:'phys', power:40, acc:100, pp:25 },
  leafcutter:{ name:'Leaf Cutter',type:'Verdant', kind:'phys', power:55, acc:95,  pp:20 },
  thornburst:{ name:'Thorn Burst',type:'Verdant', kind:'spec', power:85, acc:90,  pp:10 },
  sporecloud:{ name:'Spore Cloud',type:'Verdant', kind:'status', power:0, acc:85, pp:15, effect:{status:'sleep', chance:100} },
  leafgust:  { name:'Leaf Gust',  type:'Verdant', kind:'spec', power:45, acc:100, pp:20 },

  sparkbite: { name:'Spark Bite', type:'Volt',    kind:'phys', power:40, acc:100, pp:25, effect:{status:'para', chance:15} },
  voltdash:  { name:'Volt Dash',  type:'Volt',    kind:'phys', power:55, acc:100, pp:20 },
  thunderbolt:{name:'Thunderbolt',type:'Volt',    kind:'spec', power:85, acc:90,  pp:10, effect:{status:'para', chance:20} },
  staticshock:{name:'Static Shock',type:'Volt',   kind:'spec', power:35, acc:100, pp:25, effect:{status:'para', chance:25} },
  chargebeam:{ name:'Charge Beam',type:'Volt',    kind:'spec', power:50, acc:100, pp:20 },

  rockthrow: { name:'Rock Throw', type:'Terra',   kind:'phys', power:45, acc:95,  pp:20 },
  mudslam:   { name:'Mud Slam',   type:'Terra',   kind:'phys', power:55, acc:95,  pp:20 },
  boulderfall:{name:'Boulder Fall',type:'Terra',  kind:'phys', power:85, acc:85,  pp:10 },
  harden:    { name:'Harden',     type:'Terra',   kind:'status', power:0, acc:100, pp:20, effect:{statChange:{stat:'def',stages:2,target:'self'}} },
  quake:     { name:'Quake Stomp',type:'Terra',   kind:'phys', power:60, acc:95,  pp:15 },

  gust:      { name:'Gust',       type:'Sky',     kind:'spec', power:35, acc:100, pp:25 },
  windcutter:{ name:'Wind Cutter',type:'Sky',     kind:'phys', power:55, acc:100, pp:20 },
  skydive:   { name:'Sky Dive',   type:'Sky',     kind:'phys', power:85, acc:90,  pp:10 },
  tailwind:  { name:'Tailwind',   type:'Sky',     kind:'status', power:0, acc:100, pp:15, effect:{statChange:{stat:'spe',stages:1,target:'self'}} },
  wingslap:  { name:'Wing Slap',  type:'Sky',     kind:'phys', power:45, acc:100, pp:20 },

  shadowclaw:{ name:'Shadow Claw',type:'Shade',   kind:'phys', power:45, acc:100, pp:20 },
  duskbite:  { name:'Dusk Bite',  type:'Shade',   kind:'phys', power:60, acc:95,  pp:15 },
  nightmare: { name:'Nightmare',  type:'Shade',   kind:'spec', power:85, acc:90,  pp:10 },
  spookyglare:{name:'Spooky Glare',type:'Shade',  kind:'status', power:0, acc:90, pp:15, effect:{statChange:{stat:'atk',stages:-2,target:'foe'}} },
  hex:       { name:'Hex',        type:'Shade',   kind:'spec', power:50, acc:100, pp:20 },

  mindpulse: { name:'Mind Pulse', type:'Mind',    kind:'spec', power:40, acc:100, pp:25 },
  focusbeam: { name:'Focus Beam', type:'Mind',    kind:'spec', power:60, acc:95,  pp:15 },
  psychcrush:{ name:'Psych Crush',type:'Mind',    kind:'spec', power:85, acc:90,  pp:10 },
  calm:      { name:'Calm Mind',  type:'Mind',    kind:'status', power:0, acc:100, pp:20, effect:{statChange:{stat:'spatk',stages:1,target:'self'}} },
  confuseray:{ name:'Puzzle Ray', type:'Mind',    kind:'spec', power:45, acc:95,  pp:20 }
};

/* ---------- Species ---------- */
/* stats: hp, atk, def, spatk, spdef, spe  (base values ~ 25-120) */
G.SPECIES = {
  /* ===== Ember starter line ===== */
  cindle:  { id:'cindle', name:'Cindle', types:['Ember'], base:{hp:39,atk:52,def:43,spatk:60,spdef:50,spe:65},
    evolves:{to:'cindral', level:16}, moves:[[1,'scratch'],[1,'guard'],[7,'ember'],[13,'quickstep'],[19,'flamewhip']],
    palette:['#3a2018','#e8622a','#ffb347','#7a3c1d'], desc:'A small fire lizard with a tail flame that flares when excited.' },
  cindral: { id:'cindral', name:'Cindral', types:['Ember'], base:{hp:58,atk:72,def:58,spatk:80,spdef:65,spe:85},
    evolves:{to:'cindrake', level:34}, moves:[[16,'flamewhip'],[22,'cinderclaw'],[28,'focus'],[34,'infernoblast']],
    palette:['#2c150f','#f4712e','#ffcf5c','#8a4322'], desc:'Its flame burns hotter as its confidence grows.' },
  cindrake:{ id:'cindrake', name:'Cindrake', types:['Ember','Sky'], base:{hp:78,atk:95,def:78,spatk:105,spdef:85,spe:100},
    moves:[[34,'infernoblast'],[40,'skydive'],[46,'cinderclaw'],[52,'focus']],
    palette:['#1c0f0c','#ff5a1f','#ffd166','#c0392b'], desc:'A blazing wyvern whose wingbeats fan its own inferno.' },

  /* ===== Aqua starter line ===== */

/* p3: engine - Three.js renderers, input, procedural pixel-art textures & 3D primitives */
'use strict';
const G3 = window.G;
const THREE = window.THREE;

/* ================= Renderers ================= */
G3.owRenderer = null; G3.battleRenderer = null;
function initRenderers(){
  G3.owRenderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias:true });
  G3.owRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  G3.battleRenderer = new THREE.WebGLRenderer({ canvas: document.getElementById('battleCanvas'), antialias:true });
  G3.battleRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  resizeRenderers();
  window.addEventListener('resize', resizeRenderers);
  window.addEventListener('orientationchange', ()=>setTimeout(resizeRenderers,50));
}
function resizeRenderers(){
  const wrap = document.getElementById('canvasWrap');
  const rect = wrap.getBoundingClientRect();
  const w = Math.max(240, Math.floor(rect.width)), h = Math.max(180, Math.floor(rect.height));
  G3.viewW = w; G3.viewH = h;
  if (G3.owRenderer){ G3.owRenderer.setSize(w,h,true); if (G4.owCamera){ G4.owCamera.aspect = w/h; G4.owCamera.updateProjectionMatrix(); } }
  const bwrap = document.getElementById('battleCanvasWrap');
  if (bwrap && G3.battleRenderer){
    const brect = bwrap.getBoundingClientRect();
    const bw = Math.max(240, Math.floor(brect.width)), bh = Math.max(160, Math.floor(brect.height));
    G3.battleRenderer.setSize(bw,bh,true);
    if (G.battleCamera){ G.battleCamera.aspect = bw/bh; G.battleCamera.updateProjectionMatrix(); }
  }
}
G3.initRenderers = initRenderers;
G3.resizeRenderers = resizeRenderers;

/* ================= Input (unchanged from 2D version) ================= */
G3.keys = {};
G3.touchDir = null; /* 'up'|'down'|'left'|'right'|null */
G3.justPressed = {};
function initInput(){
  window.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' ','enter','escape','w','a','s','d'].includes(k)) e.preventDefault();
    if (!G3.keys[k]) G3.justPressed[k]=true;
    G3.keys[k]=true;
  }, {passive:false});
  window.addEventListener('keyup', e=>{ G3.keys[e.key.toLowerCase()]=false; });
}
G3.initInput = initInput;
function consumeJustPressed(k){ if (G3.justPressed[k]){ G3.justPressed[k]=false; return true; } return false; }
G3.consumeJustPressed = consumeJustPressed;
G3.wantInteract = ()=> consumeJustPressed('enter') || consumeJustPressed(' ');
G3.wantCancel = ()=> consumeJustPressed('escape');
G3.moveDir = function(){
  if (G3.keys['arrowup']||G3.keys['w']) return 'up';

/* ================= Procedural pixel-art textures (2D canvas, used for billboards + UI icons) ================= */
const GRID = 22;
function newGrid(){ return new Array(GRID*GRID).fill(-1); }
function idx(x,y){ return y*GRID+x; }
function setPx(g,x,y,c){ x=Math.round(x); y=Math.round(y); if (x>=0&&y>=0&&x<GRID&&y<GRID) g[idx(x,y)]=c; }
function fillEllipse(g,cx,cy,rx,ry,c){
  for (let y=Math.floor(cy-ry-1); y<=Math.ceil(cy+ry+1); y++)
    for (let x=Math.floor(cx-rx-1); x<=Math.ceil(cx+rx+1); x++){
      const dx=(x-cx)/rx, dy=(y-cy)/ry;
      if (dx*dx+dy*dy<=1) setPx(g,x,y,c);
    }
}
function fillRect(g,x0,y0,x1,y1,c){ for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) setPx(g,x,y,c); }

function buildForm(form){
  const g = newGrid();
  const cx = GRID/2, cy = GRID/2;
  if (form==='blob'){
    fillEllipse(g,cx,cy+1,7.5,6.5,0);
    fillEllipse(g,cx,cy+1,6.5,5.5,1);
    fillEllipse(g,cx-2,cy-2,2.6,1.8,2);
    fillRect(g,cx-1,cy+6,cx+1,cy+7,1);
    setPx(g,cx-2.5,cy-0.5,0); setPx(g,cx-2.5,cy+0.5,3);
  } else if (form==='quad'){
    fillEllipse(g,cx,cy+2,7,4.6,0);
    fillEllipse(g,cx,cy+2,6,3.7,1);
    fillEllipse(g,cx-4.5,cy-3,4,3.6,0);
    fillEllipse(g,cx-4.5,cy-3,3.2,2.9,1);
    fillEllipse(g,cx-5.5,cy-4.5,1.6,1.2,2);
    fillRect(g,cx-6,cy+5,cx-4,cy+8,0); fillRect(g,cx-5.6,cy+5,cx-4.4,cy+7.6,1);
    fillRect(g,cx+3,cy+5,cx+5,cy+8,0); fillRect(g,cx+3.4,cy+5,cx+4.6,cy+7.6,1);
    fillRect(g,cx+5.5,cy-1,cx+8,cy+0.6,0); fillRect(g,cx+5.8,cy-0.7,cx+7.6,cy+0.2,3);
    setPx(g,cx-6,cy-4,0); setPx(g,cx-5,cy-5.5,3);
    setPx(g,cx-6.2,cy-3.2,0); setPx(g,cx-6.2,cy-2.8,0);
  } else if (form==='bird'){
    fillEllipse(g,cx,cy+1.5,5.5,5.5,0);
    fillEllipse(g,cx,cy+1.5,4.6,4.6,1);
    fillEllipse(g,cx-1,cy-5,3.6,3.4,0);
    fillEllipse(g,cx-1,cy-5,2.9,2.7,1);
    fillRect(g,cx-4.5,cy-6,cx-2.5,cy-4.8,3);
    fillEllipse(g,cx+5,cy+1,3.2,5,0);
    fillEllipse(g,cx+4.6,cy+1,2.4,4.2,3);
    fillRect(g,cx-1,cy+6,cx+1,cy+8,0); fillRect(g,cx-0.6,cy+6,cx+0.6,cy+7.6,2);
  } else if (form==='fish'){
    fillEllipse(g,cx-1,cy,7,4.3,0);
    fillEllipse(g,cx-1,cy,6,3.5,1);
    fillRect(g,cx+5,cy-3.5,cx+9,cy+3.5,0);
    fillRect(g,cx+5.6,cy-2.6,cx+8.2,cy+2.6,3);
    fillEllipse(g,cx-1,cy-4,3,1.6,2);
    fillRect(g,cx-3,cy+3.8,cx+1,cy+5.4,3);
  } else if (form==='insect'){
    fillEllipse(g,cx,cy+2,5.4,5.6,0);
    fillEllipse(g,cx,cy+2,4.5,4.7,1);
    fillEllipse(g,cx,cy-4,3,2.8,0);
    fillEllipse(g,cx,cy-4,2.3,2.1,1);
    fillEllipse(g,cx-6.5,cy-1,3.6,2.2,3);
    fillEllipse(g,cx+6.5,cy-1,3.6,2.2,3);
    for (let i=0;i<4;i++){ setPx(g,cx-4+i*0.2,cy+6+i*0.6,0); setPx(g,cx+4-i*0.2,cy+6+i*0.6,0); }
    setPx(g,cx-2,cy-7,0); setPx(g,cx-3,cy-9,0);
    setPx(g,cx+2,cy-7,0); setPx(g,cx+3,cy-9,0);
  } else if (form==='dragon'){
    fillEllipse(g,cx,cy+2,7.6,5.4,0);
    fillEllipse(g,cx,cy+2,6.6,4.5,1);
    fillEllipse(g,cx-5,cy-3.5,3.8,3.6,0);
    fillEllipse(g,cx-5,cy-3.5,3,2.8,1);
    fillRect(g,cx-7,cy-7,cx-5.6,cy-5,0); fillRect(g,cx-4.4,cy-7,cx-3,cy-5,0);
    fillEllipse(g,cx+3,cy-6,5.5,4,0);
    fillEllipse(g,cx+3.3,cy-5.6,4.5,3.2,2);
    fillRect(g,cx-6,cy+5,cx-4,cy+8,0); fillRect(g,cx+3,cy+5,cx+5,cy+8,0);
    fillRect(g,cx+7,cy+1,cx+10,cy+2.4,0); fillRect(g,cx+7.4,cy+1.2,cx+9.4,cy+2,3);
    setPx(g,cx-6,cy-4.5,3); setPx(g,cx-4,cy-4.5,3);
  }
  const ex = form==='quad'?cx-5.5:(form==='bird'?cx-1:(form==='fish'?cx-3:(form==='insect'?cx-1.6:(form==='dragon'?cx-5.5:cx-2.2))));
  const ey = form==='quad'?cy-3.4:(form==='bird'?cy-5.2:(form==='fish'?cy-0.6:(form==='insect'?cy-4.2:(form==='dragon'?cy-3.7:cy-1.4))));
  setPx(g,ex,ey,0); setPx(g,ex+ (form==='quad'||form==='dragon'?2.4:1.6), ey, 0);
  return g;
}
G.SPECIES_FORM = {
  cindle:'quad', cindral:'quad', cindrake:'dragon',
  ripplet:'blob', ripplash:'blob', ripplord:'dragon',
  sproutle:'blob', thornbud:'blob', florabeast:'dragon',
  sparkit:'quad', voltking:'quad', buzzfly:'insect',
  pebblit:'blob', rockram:'quad', grubrock:'blob', golemite:'quad',
  gloomoth:'insect', duskmoth:'insect',
  gravepup:'quad', gravehound:'quad',
  chirpling:'bird', skylark:'bird', mossbat:'bird',
  zenkit:'quad', zenlynx:'quad', puzzlemoth:'insect',
  fintail:'fish', finshark:'fish', crawdon:'insect',
  emberpup:'quad', embermane:'quad',

};

const spriteCache = {};
function getSpriteCanvas(speciesId, size){
  const key = speciesId+'_'+size;
  if (spriteCache[key]) return spriteCache[key];
  const sp = G.SPECIES[speciesId]; if (!sp) return null;
  const form = G.SPECIES_FORM[speciesId] || 'blob';
  const grid = buildForm(form);
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = false;
  const px = size/GRID;
  const pal = sp.palette;
  for (let y=0;y<GRID;y++) for (let x=0;x<GRID;x++){
    const v = grid[idx(x,y)];
    if (v<0) continue;
    octx.fillStyle = pal[v] || pal[1];
    octx.fillRect(Math.floor(x*px), Math.floor(y*px), Math.ceil(px)+1, Math.ceil(px)+1);
  }
  if (sp.legendary){
    octx.globalAlpha = 0.35; octx.fillStyle = '#fff';
    octx.beginPath(); octx.arc(size*0.5,size*0.4,size*0.42,0,7); octx.fill();
    octx.globalAlpha = 1;
  }
  spriteCache[key] = off;
  return off;
}
G3.getSpriteCanvas = getSpriteCanvas;

/* ================= Three.js world setup ================= */
G3.TILE = 2; /* world units per grid tile */
const matCache = {};
function mat(colorHex, opts){
  const key = colorHex+'_'+(opts&&opts.opacity!==undefined?opts.opacity:1)+'_'+(opts&&opts.emissive?opts.emissive:'');
  if (matCache[key]) return matCache[key];
  const params = { color: colorHex };
  if (opts&&opts.opacity!==undefined){ params.transparent=true; params.opacity=opts.opacity; }
  if (opts&&opts.emissive){ params.emissive = opts.emissive; params.emissiveIntensity = 0.4; }
  const m = new THREE.MeshLambertMaterial(params);
  matCache[key] = m;
  return m;
}
/* shared geometries */

function makeSpriteTexture(canvas){
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}
const texCache = {};
G3.getSpriteTexture = function(speciesId, size){
  const key = speciesId+'_'+size;
  if (texCache[key]) return texCache[key];
  const c = getSpriteCanvas(speciesId, size);
  const t = makeSpriteTexture(c);
  texCache[key] = t;

};

G3.makeLabelSprite = function(text, bg){
  const c = document.createElement('canvas'); c.width=160; c.height=56;
  const cx = c.getContext('2d');
  cx.fillStyle = bg; roundRectPath(cx,4,4,152,48,10); cx.fill();
  cx.fillStyle = '#fff'; cx.font='bold 26px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(text, 80, 30);
  const tex = makeSpriteTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent:true }));
  sp.scale.set(1.6,0.56,1);
  return sp;
};
function roundRectPath(cx,x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

G3.buildHuman = function(palette){
  const group = new THREE.Group();
  const matBody = mat(palette[1]), matSkin = mat(palette[2]), matAccent = mat(palette[3]), matDark = mat(palette[0]);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.6,0.32), matBody); torso.position.y=0.65; group.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,10,8), matSkin); head.position.y=1.12; group.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.235,10,8,0,Math.PI*2,0,Math.PI*0.55), matDark); hair.position.y=1.18; group.add(hair);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.08), matDark); nose.position.set(0,1.1,0.2); group.add(nose);
  const legGeo = new THREE.CylinderGeometry(0.09,0.09,0.5,7);
  const legL = new THREE.Mesh(legGeo, matAccent); legL.position.set(-0.13,0.25,0); legL.name='legL'; group.add(legL);
  const legR = new THREE.Mesh(legGeo, matAccent); legR.position.set(0.13,0.25,0); legR.name='legR'; group.add(legR);
  const armGeo = new THREE.CylinderGeometry(0.07,0.07,0.46,7);
  const armL = new THREE.Mesh(armGeo, matBody); armL.position.set(-0.32,0.65,0); armL.name='armL'; group.add(armL);
  const armR = new THREE.Mesh(armGeo, matBody); armR.position.set(0.32,0.65,0); armR.name='armR'; group.add(armR);
  return group;
};
const DIR_ANGLE = { down:0, left:Math.PI/2, up:Math.PI, right:-Math.PI/2 };
G3.faceDir = function(humanGroup, dir){ humanGroup.rotation.y = DIR_ANGLE[dir]||0; };
G3.animateWalk = function(humanGroup, t, moving){
  const legL = humanGroup.getObjectByName('legL'), legR = humanGroup.getObjectByName('legR');
  const armL = humanGroup.getObjectByName('armL'), armR = humanGroup.getObjectByName('armR');
  const swing = moving ? Math.sin(t*0.012)*0.6 : 0;
  if (legL) legL.rotation.x = swing; if (legR) legR.rotation.x = -swing;
  if (armL) armL.rotation.x = -swing; if (armR) armR.rotation.x = swing;
};

function pseudoRand(a,b){ const v = Math.sin(a*12.9898+b*78.233)*43758.5453; return v-Math.floor(v); }
G3.buildGrassPatch = function(tx,ty){
  const g = new THREE.Group();
  for (let i=0;i<3;i++){
    const rx = (pseudoRand(tx*3+i,ty*7+i)-0.5)*G3.TILE*0.6;
    const rz = (pseudoRand(tx*11+i,ty*5+i)-0.5)*G3.TILE*0.6;
    const blade = new THREE.Mesh(GEO.grassBlade, mat(0x4f9a34));
    blade.position.set(rx,0.24,rz);

};

/* p4: overworld - movement, camera, collision, encounters, interactions */
'use strict';
const G4 = window.G;

G4.player = { map:'willowbrook', x:6, y:12, dir:'down', moving:false, t:0, dur:150, fromX:6, fromY:12, walkFrame:0, name:'Jasz' };
G4.stepsSinceEncounter = 0;

function getTile(mapId,x,y){
  const m = G.MAPS[mapId]; if (!m) return '#';
  const row = m.rows[y]; if (!row) return '#';
  const ch = row[x]; return ch===undefined?'#':ch;
}
G4.getTile = getTile;

function hasTool(field){
  return G.state.inventory.some(it=>{
    const def = G.ITEMS[it.id];
    return def && def.kind==='tool' && def.field===field;
  });
}
G4.hasTool = hasTool;

function tileBlocked(mapId,x,y){
  const m = G.MAPS[mapId];
  if (!m) return true;
  if (y<0||y>=m.rows.length) return true;
  const ch = getTile(mapId,x,y);
  if (ch==='#'||ch==='B'||ch==='S'||ch===' ') return true;
  if (ch==='~') return !hasTool('wave');
  if (ch==='^') return !hasTool('climb');
  if (ch==='b') return !hasTool('cut');
  /* npcs / trainers occupy tiles */
  if (m.npcs && m.npcs.some(n=>n.x===x&&n.y===y)) return true;
  if (m.trainers && m.trainers.some(t=>{
    const td = G.TRAINERS[t.id];
    return t.x===x && t.y===y;
  })) return true;
  return false;
}
G4.tileBlocked = tileBlocked;

function blockedMessage(mapId,x,y){
  const ch = getTile(mapId,x,y);
  if (ch==='~') return G.DIALOGUE.waterBlocked;
  if (ch==='^') return G.DIALOGUE.ledgeBlocked;
  if (ch==='b') return G.DIALOGUE.bushBlocked;
  return null;
}

function dirDelta(dir){
  if (dir==='up') return [0,-1]; if (dir==='down') return [0,1];
  if (dir==='left') return [-1,0]; return [1,0];
}

function findWarp(mapId,x,y){
  const m = G.MAPS[mapId]; if (!m||!m.warps) return null;
  return m.warps.find(w=>w.x===x&&w.y===y) || null;
}

function currentMap(){ return G.MAPS[G4.player.map]; }
G4.currentMap = currentMap;

function tryMove(dir){
  const p = G4.player;
  p.dir = dir;
  if (p.moving) return;
  const [dx,dy] = dirDelta(dir);
  const nx = p.x+dx, ny = p.y+dy;
  if (tileBlocked(p.map,nx,ny)){
    const msg = blockedMessage(p.map,nx,ny);
    if (msg && G.wantInteract()) {} /* no-op, message shown on bump below */
    if (msg) G.showToast(msg);
    return;
  }
  p.fromX = p.x; p.fromY = p.y;
  p.x = nx; p.y = ny;
  p.moving = true; p.t = 0; p.walkFrame = 1-p.walkFrame;
}

function onStepComplete(){
  const p = G4.player;
  const warp = findWarp(p.map,p.x,p.y);
  if (warp){ doWarp(warp); return; }
  const m = currentMap();
  const ch = getTile(p.map,p.x,p.y);
  if (ch===','){
    G4.stepsSinceEncounter++;
    if (G4.stepsSinceEncounter>=3 && Math.random() < 0.13){
      G4.stepsSinceEncounter = 0;
      startWildEncounter(m);
    }
  }
  /* trainer sight check */
  checkTrainerSight();
  checkRivalSpot();
  checkSecretGate();
  checkProGauntlet();
  if (G.tryAutoStationHere) G.tryAutoStationHere();
}
G4.onStepComplete = onStepComplete;

function doWarp(w){
  if (w.to==='proleague' && G.tryEnterProLeague && !G.tryEnterProLeague()) return;
  const p = G4.player;
  G.fadeTransition(()=>{
    p.map = w.to; p.x = w.tx; p.y = w.ty; p.moving=false;
  });
}

function weightedPick(list){
  const total = list.reduce((s,e)=>s+e.w,0);
  let r = Math.random()*total;
  for (const e of list){ if (r<e.w) return e; r-=e.w; }
  return list[list.length-1];
}
function startWildEncounter(m){
  if (!m.encounters || !m.encounters.length) return;
  const pick = weightedPick(m.encounters);
  const level = pick.min + Math.floor(Math.random()*(pick.max-pick.min+1));
  G.beginBattle({ kind:'wild', mon:G.makeMon(pick.species, level) });
}

function checkTrainerSight(){
  const m = currentMap(); if (!m || !m.trainers) return;
  const p = G4.player;
  for (const t of m.trainers){
    if (G.state.defeatedTrainers.includes(t.id)) continue;
    if (t.x===p.x || t.y===p.y){
      const [dx,dy] = dirDelta(t.dir);
      let cx=t.x, cy=t.y, dist=0, hit=false;
      for (let i=1;i<=5;i++){
        cx=t.x+dx*i; cy=t.y+dy*i;
        if (cx===p.x && cy===p.y){ hit=true; dist=i; break; }
        if (tileBlocked(m===undefined?null:G4.player.map,cx,cy) && getTile(G4.player.map,cx,cy)!==',') break;
      }
      if (hit){ startTrainerBattle(t.id); return; }
    }
  }
}
function startTrainerBattle(tid){
  const def = G.TRAINERS[tid];
  G.state.currentTrainerId = tid;
  G.beginBattle({ kind:'trainer', trainer:def, id:tid });
}
G4.startTrainerBattle = startTrainerBattle;

function checkRivalSpot(){
  const m = currentMap(); if (!m || !m.rivalSpot) return;
  const battle = G.RIVAL_BATTLES.find(b=>b.where===G4.player.map);
  if (!battle) return;
  if (G.state.defeatedRivals.includes(battle.id)) return;
  const p = G4.player;
  if (Math.abs(p.x-m.rivalSpot.x)<=0 && Math.abs(p.y-m.rivalSpot.y)<=0){
    G.beginRivalBattle(battle);
  }
}

function checkProGauntlet(){
  const m = currentMap(); if (!m || !m.proGauntlet) return;
  const p = G4.player;
  G.state.flags.proIdx = G.state.flags.proIdx||0;
  for (let i=0;i<m.proGauntlet.length;i++){
    const spot = m.proGauntlet[i];
    if (spot.x===p.x && spot.y===p.y && i===G.state.flags.proIdx && !G.state.flags['proDone'+i]){
      const def = G.PROTRAINERS[i];
      G.beginBattle({kind:'pro', proIdx:i, team:def.team.map(t=>G.makeMon(t.species,t.level)), reward:def.reward, name:def.name});
      return;
    }
  }
  if (m.champion && m.champion.x===p.x && m.champion.y===p.y && G.state.flags.proIdx>=m.proGauntlet.length && !G.state.championDefeated){
    G.beginBattle({kind:'champion', team:G.CHAMPION.team.map(t=>G.makeMon(t.species,t.level))});
  } else if (m.champion && m.champion.x===p.x && m.champion.y===p.y && G.state.championDefeated){
    G.showDialogue(['Carmela: Rest up, Champion. The region is yours to explore now.']);
  }
}

function checkSecretGate(){
  const m = currentMap(); if (!m || !m.secretGate) return;
  const p = G4.player;
  if (p.x===m.secretGate.x && p.y===m.secretGate.y){
    const ok = m.secretGate.needs.every(f=>{

    }

}

/* interact: talk to NPC/trainer facing player, read sign, pick up item */
function interact(){
  const p = G4.player;
  const [dx,dy] = dirDelta(p.dir);
  const fx = p.x+dx, fy = p.y+dy;
  const m = currentMap();
  /* sign */
  if (m.npcSigns){
    const key = fx+','+fy;
    if (m.npcSigns[key]){ G.showDialogue([G.DIALOGUE[m.npcSigns[key]]]); return; }
  }
  const ch = getTile(p.map,fx,fy);
  if (ch==='S'){
    if (m.id==='cedarcity'||p.map==='cedarcity') {}
    const signMap = { cedarcity:'cedarSign', mistvalecity:'mistvaleSign', ashportcity:'ashportSign', stonemerecity:'stonemereSign', emberpeakcity:'emberpeakSign', duskhollowcity:'duskhollowSign', proleague:'proLeagueSign' };
    const key2 = signMap[p.map];
    if (key2) { G.showDialogue([G.DIALOGUE[key2]]); return; }
    G.showDialogue(['A signpost.']); return;
  }
  /* NPC */
  if (m.npcs){
    const npc = m.npcs.find(n=>n.x===fx&&n.y===fy);
    if (npc){ G.talkToNPC(npc); return; }
  }
  /* trainer already-defeated flavor */
  if (m.trainers){
    const tr = m.trainers.find(t=>t.x===fx&&t.y===fy);
    if (tr){
      const def = G.TRAINERS[tr.id];
      if (G.state.defeatedTrainers.includes(tr.id)) G.showDialogue([def.name+': '+def.post]);
      else startTrainerBattle(tr.id);
      return;
    }
  }
  /* item pickup */
  if (m.items){
    const it = m.items.find(i=>i.x===fx&&i.y===fy);
    if (it && !G.state.flags.collected[it.id]){
      G.state.flags.collected[it.id] = true;
      G.addItem(it.item,1);
      G.showDialogue(['You found a '+G.ITEMS[it.item].name+'!']);
      return;
    }
  }
  /* legendary encounter */
  if (m.legendary && fx===m.legendary.x && fy===m.legendary.y && !G.state.flags.legendaryCaught && !G.state.flags.legendaryFled){
    G.showDialogue([G.DIALOGUE.duskrynEncounter], ()=>{
      G.beginBattle({ kind:'legendary', mon:G.makeMon(m.legendary.species, m.legendary.level) });
    });
    return;
  }
  G.showToast('There\'s nothing there.');
}
G4.interact = interact;

const PAL_NAYAH = ['#241220','#d63f8f','#ffd6a8','#f4c430'];
function npcPalette(sprite){
  const map = {
    naomi:['#1a1a24','#4fae7a','#ffd6a8','#e8e8e8'],
    bram:['#1a2410','#3f8a2b','#e8c39a','#a8e063'],
    oren:['#241f10','#d6b022','#e8c39a','#fff4b0'],
    talon:['#0c2030','#2680c2','#e8c39a','#8fd8ff'],
    grix:['#241a10','#8a6a4a','#e8c39a','#d9c19a'],
    ilan:['#240f08','#d9541f','#e8c39a','#ffb066'],
    vesper:['#180f24','#5b4a8a','#e8c39a','#c0b0f0']
  };
  return map[sprite] || PAL_NAYAH;
}
function trainerPalette(id){
  const hash = [...id].reduce((s,c)=>s+c.charCodeAt(0),0);
  const hues = [['#1a1a10','#8a7a3a','#e8c39a','#e0d090'],['#101a24','#3a6a8a','#e8c39a','#90d0e0'],['#1a1020','#7a3a7a','#e8c39a','#d090d0'],['#201a10','#8a5a2a','#e8c39a','#e0b070']];
  return hues[hash%hues.length];
}

/* map rows may contain multi-letter landmark words like GYM, SHOP, CTR */
function scanLandmarks(m){
  if (m._landmarks) return m._landmarks;
  const found = [];
  const words = ['GYM','SHOP','CTR'];
  for (let y=0;y<m.rows.length;y++){
    const row = m.rows[y];
    for (const w of words){
      let i = row.indexOf(w);
      while (i>=0){ found.push({x:i,y,w}); i = row.indexOf(w,i+1); }
    }
  }
  m._landmarks = found;
  return found;
}

function hexNum(cssHex){
  if (!cssHex) return 0x336633;
  return parseInt(cssHex.replace('#',''),16);
}

function buildMapScene(mapId){
  const m = G.MAPS[mapId];
  const scene = G4.owScene;
  scene.background = new THREE.Color(hexNum(m.bg));
  scene.fog = new THREE.Fog(hexNum(m.bg), 10, 34);
  /* clear dynamic group */
  while (G4.dynamicGroup.children.length) G4.dynamicGroup.remove(G4.dynamicGroup.children[0]);
  G4.npcMeshes = {}; G4.trainerMeshes = {}; G4.itemMeshes = {};
  const T = G3.TILE;
  const cols = Math.max(...m.rows.map(r=>r.length));
  const rows = m.rows.length;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(cols*T, rows*T), new THREE.MeshLambertMaterial({ color: hexNum(m.bg) }));
  ground.rotation.x = -Math.PI/2;
  ground.position.set((cols-1)*T/2, 0, (rows-1)*T/2);
  G4.dynamicGroup.add(ground);

  for (let y=0;y<rows;y++){
    const row = m.rows[y];
    for (let x=0;x<row.length;x++){
      const ch = row[x];
      const wx = x*T, wz = y*T;
      let obj = null;
      if (ch==='#') obj = G3.buildTree();
      else if (ch==='B') obj = G3.buildBuilding();
      else if (ch==='~') obj = G3.buildWater();
      else if (ch==='^') obj = G3.buildLedge();
      else if (ch==='b') obj = G3.buildBush();
      else if (ch===',') obj = G3.buildGrassPatch(x,y);
      else if (ch==='S') obj = G3.buildSign();
      else if (ch==='d' && m.dark) {
        const p = new THREE.Mesh(new THREE.PlaneGeometry(T,T), new THREE.MeshBasicMaterial({ color: hasTool('glow')?0x2a2040:0x030204 }));
        p.rotation.x=-Math.PI/2; p.position.set(wx,0.01,wz); obj = p;
      }
      if (obj){ obj.position.x += wx; obj.position.z += wz; G4.dynamicGroup.add(obj); }
    }
  }
  for (const lm of scanLandmarks(m)){
    const color = lm.w==='GYM'?'#d64a3c':(lm.w==='SHOP'?'#3c8ad6':'#2fae6a');
    const label = G3.makeLabelSprite(lm.w, color);
    label.position.set(lm.x*T, 1.9, lm.y*T);
    G4.dynamicGroup.add(label);
  }
  if (m.items){
    for (const it of m.items){
      if (G.state.flags.collected[it.id]) continue;
      const orb = G3.buildItemOrb(); orb.position.set(it.x*T, 0.5, it.y*T);
      G4.dynamicGroup.add(orb); G4.itemMeshes[it.id] = orb;
    }
  }
  if (m.npcs){
    for (const n of m.npcs){
      const hu = G3.buildHuman(npcPalette(n.sprite));
      hu.position.set(n.x*T, 0, n.y*T);
      G3.faceDir(hu, n.dir);
      G4.dynamicGroup.add(hu); G4.npcMeshes[n.id] = hu;
    }
  }
  if (m.trainers){
    for (const t of m.trainers){
      const hu = G3.buildHuman(trainerPalette(t.id));
      hu.position.set(t.x*T, 0, t.y*T);
      G3.faceDir(hu, t.dir);
      hu.visible = !G.state.defeatedTrainers.includes(t.id);
      G4.dynamicGroup.add(hu); G4.trainerMeshes[t.id] = hu;
    }
  }
  if (m.legendary){
    const sp = G3.makeCreatureSprite(m.legendary.species, 1.7);
    sp.position.set(m.legendary.x*T, 1.0, m.legendary.y*T);
    sp.visible = !G.state.flags.legendaryCaught;
    G4.dynamicGroup.add(sp); G4.legendaryMesh = sp;
  } else G4.legendaryMesh = null;

  if (m.rivalSpot){
    const battle = G.RIVAL_BATTLES.find(b=>b.where===mapId);
    G4.rivalMesh.visible = !!(battle && !G.state.defeatedRivals.includes(battle.id));
    G4.rivalMesh.position.set(m.rivalSpot.x*T, 0, m.rivalSpot.y*T);
  } else {
    G4.rivalMesh.visible = false;
  }
  G4.builtMapId = mapId;
}
G4.buildMapScene = buildMapScene;

function drawOverworld(){
  if (!G4.owScene) initOverworldScene();

  for (const id in G4.trainerMeshes) G4.trainerMeshes[id].visible = !G.state.defeatedTrainers.includes(id);

    py = p.fromY + (p.y-p.fromY)*f;
  }
  const wx = px*T, wz = py*T;

/* p5: battle system - damage, catching, xp, evolution, AI */
'use strict';
const G5 = window.G;

function baseStat(base, level, isHp){
  if (isHp) return Math.floor(base*2*level/100) + level + 10;
  return Math.floor(base*2*level/100) + 5;
}
function xpNeeded(level, growth){
  const f = G.XP_GROUP[growth]||1;
  return Math.floor(f * Math.pow(level,3));
}
function makeMon(speciesId, level, opts){
  const sp = G.SPECIES[speciesId];
  const stats = {
    hp: baseStat(sp.base.hp, level, true),
    atk: baseStat(sp.base.atk, level, false),
    def: baseStat(sp.base.def, level, false),
    spatk: baseStat(sp.base.spatk, level, false),
    spdef: baseStat(sp.base.spdef, level, false),
    spe: baseStat(sp.base.spe, level, false)
  };
  const known = sp.moves.filter(m=>m[0]<=level).slice(-4).map(m=>m[1]);
  if (known.length===0) known.push('tackle');
  const mon = {
    uid: 'm'+Math.random().toString(36).slice(2,10),
    species: speciesId, level, xp: 0, nextXp: xpNeeded(level+1, sp.growth),
    stats, curHp: stats.hp, status:null, statusCounter:0,
    moves: known.map(id=>({id, pp:G.MOVES[id].pp, maxPp:G.MOVES[id].pp})),
    stages: {atk:0,def:0,spatk:0,spdef:0,spe:0},
    nickname: opts&&opts.nickname || sp.name,
    caughtLevel: level
  };
  return mon;
}
G5.makeMon = makeMon; G.makeMon = makeMon;

function statWithStage(mon, key){
  const base = mon.stats[key];
  const stage = mon.stages[key]||0;
  const mult = stage>=0 ? (2+stage)/2 : 2/(2-stage);
  return Math.max(1, Math.floor(base*mult));
}

function effSpecies(mon){ return G.SPECIES[mon.species]; }

function damageRoll(atkMon, defMon, moveId, isPlayerSide){
  const move = G.MOVES[moveId];
  if (move.power<=0) return {dmg:0, eff:1, crit:false};
  const atkStat = move.kind==='phys' ? statWithStage(atkMon,'atk') : statWithStage(atkMon,'spatk');
  const defStat = move.kind==='phys' ? statWithStage(defMon,'def') : statWithStage(defMon,'spdef');
  const level = atkMon.level;
  let dmg = Math.floor(((2*level/5+2)*move.power*atkStat/Math.max(1,defStat))/50)+2;
  const stab = effSpecies(atkMon).types.includes(move.type) ? 1.5 : 1;
  const eff = G.typeMult(move.type, effSpecies(defMon).types);
  const crit = Math.random()<0.0625;
  const rand = 0.85+Math.random()*0.15;
  dmg = Math.floor(dmg*stab*eff*(crit?1.5:1)*rand);
  if (eff===0) dmg = 0;
  return {dmg:Math.max(eff===0?0:1,dmg), eff, crit};
}
G5.damageRoll = damageRoll;

function applyStatChange(mon, sc, log){
  if (!sc) return;
  const cur = mon.stages[sc.stat]||0;
  const next = Math.max(-6, Math.min(6, cur+sc.stages));
  mon.stages[sc.stat] = next;
  const dir = sc.stages>0?'rose':'fell';
  log.push(`${mon.nickname}'s ${statName(sc.stat)} ${dir}${Math.abs(sc.stages)>1?' sharply':''}!`);
}
function statName(k){ return {atk:'Attack',def:'Defense',spatk:'Sp. Atk',spdef:'Sp. Def',spe:'Speed'}[k]||k; }

function tryStatus(mon, status, chance, log){
  if (mon.status) return;
  if (Math.random()*100 < chance){
    mon.status = status; mon.statusCounter = status==='sleep' ? 1+Math.floor(Math.random()*3) : 0;
    const names = {burn:'burned',para:'paralyzed',sleep:'put to sleep'};
    log.push(`${mon.nickname} was ${names[status]||status}!`);
  }
}

function useMove(user, target, moveId, log){
  const move = G.MOVES[moveId];
  const mrec = user.moves.find(m=>m.id===moveId);
  if (mrec) mrec.pp = Math.max(0,mrec.pp-1);
  if (Math.random()*100 > move.acc){ log.push(`${user.nickname}'s ${move.name} missed!`); return; }
  log.push(`${user.nickname} used ${move.name}!`);
  if (move.power>0){
    const r = damageRoll(user,target,moveId);
    target.curHp = Math.max(0, target.curHp - r.dmg);
    if (r.eff>1) log.push('It\'s super effective!');
    else if (r.eff<1 && r.eff>0) log.push('It\'s not very effective...');
    else if (r.eff===0) log.push(`It had no effect on ${target.nickname}!`);
    if (r.crit) log.push('A critical hit!');
  }
  if (move.effect){
    if (move.effect.heal){ const h = Math.floor(user.stats.hp*move.effect.heal); user.curHp=Math.min(user.stats.hp,user.curHp+h); log.push(`${user.nickname} recovered HP!`); }
    if (move.effect.status && (!move.effect.chance || Math.random()*100<move.effect.chance)) tryStatus(target, move.effect.status, 100, log);
    if (move.effect.statChange){
      const roll = move.effect.chance ? Math.random()*100<move.effect.chance : true;
      if (roll) applyStatChange(move.effect.statChange.target==='self'?user:target, move.effect.statChange, log);
    }
  }
}
G5.useMove = useMove;

function statusPreventsMove(mon, log){
  if (mon.status==='sleep'){
    mon.statusCounter--;
    if (mon.statusCounter<=0){ mon.status=null; log.push(`${mon.nickname} woke up!`); return false; }
    log.push(`${mon.nickname} is fast asleep.`); return true;
  }
  if (mon.status==='para' && Math.random()<0.25){ log.push(`${mon.nickname} is paralyzed! It can't move!`); return true; }
  return false;
}
function endTurnStatus(mon, log){
  if (mon.curHp<=0) return;
  if (mon.status==='burn'){ const d=Math.max(1,Math.floor(mon.stats.hp/16)); mon.curHp=Math.max(0,mon.curHp-d); log.push(`${mon.nickname} is hurt by its burn!`); }
}
G5.endTurnStatus = endTurnStatus;
G5.statusPreventsMove = statusPreventsMove;

/* ---------- XP & evolution ---------- */
function xpYield(mon){
  const sp = effSpecies(mon);
  const base = sp.legendary?280:(sp.evolves?70:110);
  return Math.floor(base*mon.level/7)+10;
}
function grantXp(mon, foe, log, isTrainer){
  if (mon.curHp<=0) return [];
  const events = [];
  let gained = Math.floor(xpYield(foe)*(isTrainer?1.5:1));
  mon.xp += gained;
  log.push(`${mon.nickname} gained ${gained} XP!`);
  while (mon.xp>=mon.nextXp && mon.level<100){
    mon.xp -= mon.nextXp;
    mon.level++;
    const sp = effSpecies(mon);
    const newStats = { hp:baseStat(sp.base.hp,mon.level,true), atk:baseStat(sp.base.atk,mon.level,false), def:baseStat(sp.base.def,mon.level,false), spatk:baseStat(sp.base.spatk,mon.level,false), spdef:baseStat(sp.base.spdef,mon.level,false), spe:baseStat(sp.base.spe,mon.level,false) };
    const hpGain = newStats.hp - mon.stats.hp;
    mon.stats = newStats; mon.curHp = Math.min(newStats.hp, mon.curHp+hpGain);
    mon.nextXp = xpNeeded(mon.level+1, sp.growth);
    log.push(`${mon.nickname} grew to level ${mon.level}!`);
    events.push({type:'levelup', mon:mon.uid, level:mon.level});
    const learn = sp.moves.find(m=>m[0]===mon.level);
    if (learn){
      if (mon.moves.length<4) mon.moves.push({id:learn[1], pp:G.MOVES[learn[1]].pp, maxPp:G.MOVES[learn[1]].pp});
      else { mon.moves.shift(); mon.moves.push({id:learn[1], pp:G.MOVES[learn[1]].pp, maxPp:G.MOVES[learn[1]].pp}); }
      log.push(`${mon.nickname} learned ${G.MOVES[learn[1]].name}!`);
    }
    if (sp.evolves && mon.level>=sp.evolves.level){
      const newSp = G.SPECIES[sp.evolves.to];
      mon.species = sp.evolves.to;
      const evStats = { hp:baseStat(newSp.base.hp,mon.level,true), atk:baseStat(newSp.base.atk,mon.level,false), def:baseStat(newSp.base.def,mon.level,false), spatk:baseStat(newSp.base.spatk,mon.level,false), spdef:baseStat(newSp.base.spdef,mon.level,false), spe:baseStat(newSp.base.spe,mon.level,false) };
      const hpG2 = evStats.hp-mon.stats.hp;
      mon.stats = evStats; mon.curHp = Math.min(evStats.hp, mon.curHp+hpG2);
      if (mon.nickname===sp.name) mon.nickname = newSp.name;
      mon.nextXp = xpNeeded(mon.level+1, newSp.growth);
      log.push(`${mon.nickname===newSp.name?'':''}Your wildkin is evolving into ${newSp.name}!`);
      events.push({type:'evolve', mon:mon.uid, to:sp.evolves.to});
    }
  }
  return events;
}
G5.grantXp = grantXp;

/* ---------- catching ---------- */
function catchChance(mon, ballMod){
  const sp = effSpecies(mon);
  const baseRate = sp.legendary?0.06:(sp.evolves?0.42:0.62);
  const hpFactor = (3*mon.stats.hp - 2*mon.curHp)/(3*mon.stats.hp);
  const statusMod = mon.status ? 1.4 : 1;
  let chance = baseRate*hpFactor*ballMod*statusMod;
  return Math.max(0.02, Math.min(0.98, chance));
}
G5.catchChance = catchChance;

/* ---------- simple AI ---------- */
function pickAiMove(mon, foe){
  const usable = mon.moves.filter(m=>m.pp>0);
  if (!usable.length) return null;
  if (Math.random()<0.55){
    let best=usable[0], bestScore=-1;
    for (const m of usable){
      const move = G.MOVES[m.id];
      const eff = G.typeMult(move.type, effSpecies(foe).types);
      const score = move.power*eff + (move.effect?15:0);
      if (score>bestScore){ bestScore=score; best=m; }
    }
    return best.id;
  }

G.beginBattle = function(opts){
  if (!G.state.party.some(m=>m.curHp>0)){ G.showToast('Your team has no wildkin able to battle!'); return; }

    enemyName: 'Wild',
    canCatch: false,
    canRun: true,
    isWild: false,
    rewardMoney: 0,
    pendingMon: null,
    extra: opts,
    msgQueue: [],
    afterMessages: null,
    playerFled: false,
    turnBusy: false
  };
  if (opts.kind==='wild'){
    battle.enemy = [opts.mon]; battle.enemyName = 'Wild '+G.SPECIES[opts.mon.species].name; battle.canCatch = true; battle.isWild = true;
  } else if (opts.kind==='legendary'){
    battle.enemy = [opts.mon]; battle.enemyName = G.SPECIES[opts.mon.species].name; battle.canCatch = true; battle.isWild = true; battle.canRun = true;
  } else if (opts.kind==='trainer'){

    battle.enemyName = opts.trainer.name; battle.canRun = false; battle.rewardMoney = opts.trainer.reward; battle.trainerId = opts.id;
    battle.preMsg = opts.trainer.name+': '+opts.trainer.pre;
  } else if (opts.kind==='rival'){
    battle.enemy = opts.team; battle.enemyName = 'Nayah'; battle.canRun = false; battle.rivalId = opts.rivalId;
    battle.preMsg = opts.pre;
  } else if (opts.kind==='master'){
    const master = G.MASTERS[opts.masterId];
    battle.enemy = master.team.map(t=>G.makeMon(t.species,t.level));
    battle.enemyName = master.name; battle.canRun = false; battle.masterId = opts.masterId;
    battle.preMsg = master.pre;
  } else if (opts.kind==='pro'){
    battle.enemy = opts.team; battle.enemyName = opts.name; battle.canRun = false; battle.proIdx = opts.proIdx; battle.rewardMoney = opts.reward;
    const pdef = G.PROTRAINERS[opts.proIdx]; battle.preMsg = pdef?pdef.pre:null;
  } else if (opts.kind==='champion'){
    battle.enemy = opts.team; battle.enemyName = 'Champion Carmela'; battle.canRun = false;
    battle.preMsg = G.CHAMPION.pre;
  }

function battle(){ return G.state.battle; }
function activePlayerMon(){ return G.state.party[battle().playerIdx]; }
function activeEnemyMon(){ return battle().enemy[battle().enemyIdx]; }
G.activePlayerMon = activePlayerMon;
G.activeEnemyMon = activeEnemyMon;

function pushMsgs(arr){ battle().msgQueue.push(...arr); }

G.battlePlayerChooseMove = function(moveIdx){
  const b = battle(); if (b.turnBusy) return;
  const pm = activePlayerMon(); const move = pm.moves[moveIdx];
  if (!move || move.pp<=0){ G.showToast('No PP left for that move!'); return; }
  b.turnBusy = true;
  resolveTurn({type:'move', moveId:move.id});
};

G.battlePlayerUseItem = function(itemId){
  const b = battle(); if (b.turnBusy) return;
  const def = G.ITEMS[itemId];
  const pm = activePlayerMon();
  if (def.kind==='ball'){
    if (!b.canCatch){ G.showToast('You can\'t catch another trainer\'s wildkin!'); return; }
    b.turnBusy = true;
    G.removeItem(itemId,1);
    doCatchAttempt(def.catchMod);
    return;
  }
  if (def.kind==='heal'){
    if (pm.curHp>=pm.stats.hp){ G.showToast(pm.nickname+' is already at full HP.'); return; }
    G.removeItem(itemId,1);
    pm.curHp = Math.min(pm.stats.hp, pm.curHp+def.amount);
    b.turnBusy = true;
    const log = [`You used ${def.name} on ${pm.nickname}. HP restored!`];
    pushMsgs(log);
    enemyActsThenContinue();
    return;
  }
  if (def.kind==='cure'){
    if (!pm.status || !def.cures.includes(pm.status)){ G.showToast('It won\'t have any effect.'); return; }
    G.removeItem(itemId,1);
    pm.status = null;
    b.turnBusy = true;
    pushMsgs([`You used ${def.name} on ${pm.nickname}. It feels better!`]);
    enemyActsThenContinue();
    return;
  }
  if (def.kind==='revive'){
    G.showToast('Switch to a fainted wildkin\'s slot from the Party menu instead.'); return;
  }
};

G.battlePlayerSwitch = function(partyIdx){
  const b = battle(); if (b.turnBusy) return;
  const mon = G.state.party[partyIdx];
  if (!mon || mon.curHp<=0){ G.showToast('That wildkin has fainted.'); return; }
  if (partyIdx===b.playerIdx){ G.showToast('Already in battle!'); return; }
  b.turnBusy = true;
  b.playerIdx = partyIdx;
  pushMsgs([`Go, ${mon.nickname}!`]);
  if (b._forceSwitch){ b._forceSwitch=false; flushAndThen(checkBattleEndOrContinue); }
  else enemyActsThenContinue();
};

G.battlePlayerRun = function(){
  const b = battle(); if (b.turnBusy) return;
  if (!b.canRun){ G.showToast('You can\'t run from this battle!'); return; }
  b.turnBusy = true;
  pushMsgs(['Got away safely!']);
  flushAndThen(()=>{ endBattle('fled'); });
};

function doCatchAttempt(ballMod){
  const b = battle(); const enemy = activeEnemyMon();
  const chance = G.catchChance(enemy, ballMod);
  const success = Math.random() < chance;
  const shakes = success ? 4 : 1+Math.floor(Math.random()*3);
  const log = ['You threw a Snare Ball!'];
  for (let i=0;i<shakes;i++) log.push('...');
  if (success){
    log.push(`Gotcha! ${enemy.nickname} was caught!`);
    pushMsgs(log);
    flushAndThen(()=>{
      const mon = enemy;
      if (G.state.party.length<6) G.state.party.push(mon); else G.state.box.push(mon);
      if (b.kind==='legendary') G.onLegendaryOutcome(true);
      endBattle('caught');
    });
  } else {
    log.push('Oh no! It broke free!');
    pushMsgs(log);
    enemyActsThenContinue();
  }
}

function resolveTurn(playerAction){
  const b = battle();
  const pm = activePlayerMon(); const em = activeEnemyMon();
  const aiMoveId = G.pickAiMove(em, pm);
  const log = [];
  const playerFirst = statSpeed(pm) >= statSpeed(em);
  const actors = playerFirst ? [['p',playerAction.moveId],['e',aiMoveId]] : [['e',aiMoveId],['p',playerAction.moveId]];
  for (const [side, moveId] of actors){
    const user = side==='p'?pm:em, target = side==='p'?em:pm;
    if (user.curHp<=0) continue;
    if (target.curHp<=0) continue;
    if (!moveId) continue;
    if (G.statusPreventsMove(user, log)) continue;
    G.useMove(user, target, moveId, log);
    if (target.curHp<=0){ log.push(`${target.nickname} fainted!`); break; }
  }
  if (pm.curHp>0) G.endTurnStatus(pm, log);
  if (em.curHp>0) G.endTurnStatus(em, log);
  pushMsgs(log);
  flushAndThen(checkBattleEndOrContinue);
}

function enemyActsThenContinue(){
  const b = battle(); const pm = activePlayerMon(); const em = activeEnemyMon();
  const log = [];
  if (em.curHp>0 && pm.curHp>0){
    const aiMoveId = G.pickAiMove(em, pm);
    if (aiMoveId && !G.statusPreventsMove(em, log)) G.useMove(em, pm, aiMoveId, log);
    if (pm.curHp<=0) log.push(`${pm.nickname} fainted!`);
  }
  if (pm.curHp>0) G.endTurnStatus(pm, log);
  if (em.curHp>0) G.endTurnStatus(em, log);
  pushMsgs(log);
  flushAndThen(checkBattleEndOrContinue);
}

function statSpeed(mon){
  const stage = mon.stages.spe||0;
  const mult = stage>=0?(2+stage)/2:2/(2-stage);
  const base = Math.floor(mon.stats.spe*mult);
  return mon.status==='para' ? Math.floor(base*0.5) : base;
}

function flushAndThen(fn){
  battle().afterMessages = fn;
  G.uiRender();
}
G.battleFlushDone = function(){ /* called by UI once message queue fully drained */ };

function checkBattleEndOrContinue(){
  const b = battle(); const pm = activePlayerMon(); const em = activeEnemyMon();
  if (em.curHp<=0){
    const xpLog = [];
    G.grantXp(pm, em, xpLog, b.kind!=='wild'&&b.kind!=='legendary');
    pushMsgs(xpLog);
    b.enemyIdx++;
    if (b.enemyIdx < b.enemy.length){
      pushMsgs([`${b.enemyName} sent out ${b.enemy[b.enemyIdx].nickname}!`]);
      b.turnBusy = false;
      G.uiRender();
      return;
    }
    finishBattleVictory();
    return;
  }
  if (pm.curHp<=0){
    const nextIdx = G.state.party.findIndex(m=>m.curHp>0);
    if (nextIdx>=0){
      b._forceSwitch = true;
      b.turnBusy = false;
      G.uiRender();
      return;
    }
    finishBattleDefeat();
    return;
  }
  b.turnBusy = false;
  G.uiRender();
}

function finishBattleVictory(){
  const b = battle();
  let extraMsg = [];
  if (b.rewardMoney){ G.state.money += b.rewardMoney; extraMsg.push(`You got $${b.rewardMoney} for winning!`); }
  if (b.kind==='trainer'){ G.state.defeatedTrainers.push(b.trainerId); }
  if (b.kind==='rival'){ G.state.defeatedRivals.push(b.rivalId); }
  if (b.kind==='master'){
    const lines = G.grantMasterReward(b.masterId);
    extraMsg = extraMsg.concat(lines);
  }
  if (b.kind==='pro'){
    G.state.flags.proIdx = (b.proIdx||0)+1;
    G.state.flags['proDone'+b.proIdx] = true;
  }
  if (b.kind==='champion'){
    G.state.championDefeated = true;
    extraMsg.push(G.DIALOGUE.champDefeated);
  }
  pushMsgs(extraMsg.length?extraMsg:['You won the battle!']);
  flushAndThen(()=>{ endBattle('win'); });
}
function finishBattleDefeat(){
  pushMsgs(['You have no wildkin left to fight!', 'You rush to the nearest Wyldkin Center...']);
  flushAndThen(()=>{
    for (const mon of G.state.party){ mon.curHp = mon.stats.hp; mon.status=null; }
    G.state.money = Math.max(0, G.state.money-50);
    endBattle('lose');
  });
}

function endBattle(result){
  G.state.battle = null;
  G.state.screen = 'overworld';
  G.uiRender();
}

      const slotRaw = btn.getAttribute('data-slot');
      const slot = slotRaw==='auto' ? 'auto' : parseInt(slotRaw);
      if (act==='save'){ G.saveToSlot(slot); G.uiToast('Saved to slot '+slot+'!'); renderPause(); }
      else if (act==='load'){ if (G.loadFromSlot(slot)){ G.state.screen='overworld'; G.uiRender(); G.uiToast('Loaded slot '+slot+'!'); $('continuePicker').style.display='none'; } else G.uiToast('Nothing saved there.'); }
      else if (act==='switch'){ const idx=parseInt(btn.getAttribute('data-idx')); if (G.state.screen==='battle') G.battlePlayerSwitch(idx); else { const t=G.state.party[0]; G.state.party[0]=G.state.party[idx]; G.state.party[idx]=t; renderPause(); } }
      else if (act==='useitem'){ const id=btn.getAttribute('data-id'); if (G.state.screen==='battle') G.battlePlayerUseItem(id); else fieldUseItem(id); }
      else if (act==='release'){ const idx=parseInt(btn.getAttribute('data-idx')); if (G.state.party.length>1){ G.state.party.splice(idx,1); renderPause(); } else G.uiToast('You need at least one wildkin!'); }
      else if (act==='buy'){ const id=btn.getAttribute('data-id'); buyItem(id); }
    };
  });
}
function fieldUseItem(id){
  const def = G.ITEMS[id];
  if (def.kind==='tool' || def.kind==='key'){ G.uiToast('Can\'t use that right now.'); return; }
  const mon = G.state.party[0];
  if (def.kind==='heal'){ if (mon.curHp>=mon.stats.hp){ G.uiToast('Already full HP.'); return;} mon.curHp=Math.min(mon.stats.hp,mon.curHp+def.amount); G.removeItem(id,1); G.uiToast('Used '+def.name+'.'); renderPause(); }
  else if (def.kind==='cure'){ if (!mon.status||!def.cures.includes(mon.status)){ G.uiToast('No effect.'); return;} mon.status=null; G.removeItem(id,1); G.uiToast('Used '+def.name+'.'); renderPause(); }
  else if (def.kind==='revive'){ G.uiToast('Revive is used automatically from the party screen on fainted wildkin.'); }
}

/* ---------- party & bag partials ---------- */
function renderPartyList(withActions){
  let html = '<div class="partyList">';
  G.state.party.forEach((mon,idx)=>{
    const sp = G.SPECIES[mon.species];
    const pct = Math.round(100*mon.curHp/mon.stats.hp);
    html += `<div class="monRow ${mon.curHp<=0?'fainted':''}">
      <canvas class="monSprite" width="48" height="48" data-sp="${mon.species}"></canvas>
      <div class="monInfo"><b>${esc(mon.nickname)}</b> Lv.${mon.level} ${mon.status?`<span class="status st-${mon.status}">${mon.status.toUpperCase()}</span>`:''}
        <div class="hpBarBg"><div class="hpBarFg" style="width:${pct}%; background:${pct>50?'#4caf50':pct>20?'#ffb300':'#e53935'}"></div></div>
        <small>${mon.curHp}/${mon.stats.hp} HP &middot; ${sp.types.join('/')} &middot; XP ${mon.xp}/${mon.nextXp}</small></div>
      ${withActions?`<div class="monActions">
        ${G.state.screen==='battle'?`<button class="btn small" data-act="switch" data-idx="${idx}">Send Out</button>`:`<button class="btn small" data-act="switch" data-idx="${idx}">Lead</button><button class="btn small danger" data-act="release" data-idx="${idx}">Release</button>`}
      </div>`:''}
    </div>`;
  });
  html += '</div>';
  return html;
}
G.renderPartyList = renderPartyList;
function paintMonSprites(root){
  root.querySelectorAll('canvas.monSprite').forEach(cv=>{
    const sp = cv.getAttribute('data-sp'); const cx = cv.getContext('2d'); cx.imageSmoothingEnabled=false;
    cx.drawImage(G3.getSpriteCanvas(sp,48),0,0,48,48);
  });
}
function renderBagList(field){
  let html = '<div class="bagList">';
  const inv = G.state.inventory.filter(i=>i.qty>0);
  if (!inv.length) html += '<p>Your bag is empty.</p>';
  for (const it of inv){
    const def = G.ITEMS[it.id];
    const usable = field ? true : (G.state.battle && (def.kind==='ball'||def.kind==='heal'||def.kind==='cure'));
    html += `<div class="itemRow"><div><b>${def.name}</b> x${it.qty}<br><small>${esc(def.desc)}</small></div>
      ${def.kind!=='tool'&&def.kind!=='key'?`<button class="btn small" data-act="useitem" data-id="${it.id}">Use</button>`:'<span class="tag">Field Tool</span>'}</div>`;
  }
  html += '</div>';
  return html;
}

/* ---------- shop ---------- */
function renderShop(){
  let html = `<h2>Supply Shop</h2><p>Your money: $${G.state.money}</p><div class="bagList">`;
  for (const id of G.SHOP_STOCK){
    const def = G.ITEMS[id];
    html += `<div class="itemRow"><div><b>${def.name}</b> - $${def.price}<br><small>${esc(def.desc)}</small></div>
      <button class="btn small" data-act="buy" data-id="${id}">Buy</button></div>`;
  }
  html += '</div>';
  $('shopBody').innerHTML = html;
  wireDynamicButtons($('shopBody'));
}
function buyItem(id){
  const def = G.ITEMS[id];
  if (G.state.money<def.price){ G.uiToast('Not enough money!'); return; }
  G.state.money -= def.price; G.addItem(id,1);
  G.uiToast('Bought '+def.name+'!'); renderShop();
}
G.uiCloseShop = function(){ G.state.screen='overworld'; G.uiRender(); };

/* ---------- battle screen ---------- */
let battleTab = 'moves';
G.uiBattleTab = function(t){ battleTab = t; renderBattle(); };
function renderBattle(){
  const b = G.state.battle; if (!b) return;
  drawBattleScene3D();
  renderHpPlates(b);
  const box = $('battleMsgBox');
  const actionsWrap = $('battleActions');
  if (b.msgQueue.length>0){
    box.style.display=''; actionsWrap.style.display='none';
    box.textContent = b.msgQueue[0];
    box.onclick = ()=>{
      if (!G.state.battle || G.state.battle!==b) return;
      b.msgQueue.shift();
      if (b.msgQueue.length>0){ renderBattle(); }
      else {
        const cb = b.afterMessages; b.afterMessages=null;
        if (cb) cb(); else { G.uiRender(); }
      }
    };
    return;
  }
  box.style.display='none'; actionsWrap.style.display='';
  if (b._forceSwitch){
    $('battleTabsWrap').innerHTML = '<b>Choose your next wildkin!</b>';
    const html = renderPartyList(true);
    actionsWrap.innerHTML = html;
    wireDynamicButtons(actionsWrap);
    paintMonSprites(actionsWrap);
    return;
  }
  let tabsHtml = ['moves','party','bag'].map(t=>`<button class="btn tabbtn ${battleTab===t?'active':''}" onclick="G.uiBattleTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
  tabsHtml += `<button class="btn tabbtn ${b.canRun?'':'disabled'}" onclick="${b.canRun?'G.battlePlayerRun()':''}">Run</button>`;
  $('battleTabsWrap').innerHTML = tabsHtml;
  let html = '';
  if (battleTab==='moves'){
    const pm = G.activePlayerMon();
    html = '<div class="moveGrid">';
    pm.moves.forEach((m,idx)=>{
      const def = G.MOVES[m.id];
      html += `<button class="btn moveBtn type-${def.type}" ${m.pp<=0?'disabled':''} onclick="G.battlePlayerChooseMove(${idx})">${def.name}<br><small>${def.type} &middot; PP ${m.pp}/${m.maxPp}</small></button>`;
    });
    html += '</div>';
  } else if (battleTab==='party'){
    html = renderPartyList(true);
  } else if (battleTab==='bag'){
    html = renderBagList(false);
  }
  actionsWrap.innerHTML = html;
  wireDynamicButtons(actionsWrap);
  paintMonSprites(actionsWrap);
}
/* ---------- 3D battle scene ---------- */
G.battleScene = null; G.battleCamera = null;
let battleEnemySprite = null, battlePlayerSprite = null, battleGround = null;
function initBattleScene(){
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 60);
  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(3,6,4); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(9,24), new THREE.MeshLambertMaterial({ color:0x8fcf6a }));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.4; scene.add(ground);
  battleGround = ground;
  cam.position.set(0, 2.1, 5.4); cam.lookAt(0,1.2,0);
  G.battleScene = scene; G.battleCamera = cam;
  G3.resizeRenderers();
}
function drawBattleScene3D(){
  if (!G.battleScene) initBattleScene();
  const b = G.state.battle; if (!b) return;
  const em = b.enemy[b.enemyIdx];
  const pm = G.state.party[b.playerIdx];
  const scene = G.battleScene;
  if (battleEnemySprite){ scene.remove(battleEnemySprite); battleEnemySprite=null; }
  if (battlePlayerSprite){ scene.remove(battlePlayerSprite); battlePlayerSprite=null; }
  const bgHex = ({wild:0xbcdff0, legendary:0x2a1f3d}[b.kind]) || 0xbcdff0;
  scene.background = new THREE.Color(bgHex);
  if (em && em.curHp>0){
    battleEnemySprite = G3.makeCreatureSprite(em.species, 2.1);
    battleEnemySprite.position.set(1.3, 1.9, -1.6);
    scene.add(battleEnemySprite);
  }
  if (pm && pm.curHp>0){
    battlePlayerSprite = G3.makeCreatureSprite(pm.species, 2.5);
    battlePlayerSprite.position.set(-1.5, 1.35, 1.6);
    scene.add(battlePlayerSprite);
  }
  if (G3.battleRenderer) G3.battleRenderer.render(scene, G.battleCamera);
}
function renderHpPlates(b){
  const em = b.enemy[b.enemyIdx];
  const pm = G.state.party[b.playerIdx];
  fillHpPlate($('battleHpEnemy'), em, b.enemyName + (b.enemy.length>1?` (${b.enemyIdx+1}/${b.enemy.length})`:''));
  fillHpPlate($('battleHpPlayer'), pm, (pm?pm.nickname:'')+' (You)');
}
function fillHpPlate(el, mon, label){
  if (!mon){ el.style.display='none'; return; }
  el.style.display='';
  const pct = Math.max(0, Math.round(100*mon.curHp/mon.stats.hp));
  const barColor = pct>50?'#4caf50':pct>20?'#ffb300':'#e53935';
  el.innerHTML = `<b>${esc(label)}</b> Lv.${mon.level} ${mon.status?`<span class="status st-${mon.status}">${mon.status.toUpperCase()}</span>`:''}
    <div class="hpBarBg"><div class="hpBarFg" style="width:${pct}%; background:${barColor}"></div></div>
    <small>${mon.curHp}/${mon.stats.hp} HP</small>`;
}

/* ---------- touch controls ---------- */
G.uiWireTouch = function(){
  const map = { up:'up', down:'down', left:'left', right:'right' };
  for (const k in map){
    const el = $('dpad_'+k);
    const set = ()=>{ G3.touchDir = map[k]; };
    const clear = ()=>{ if (G3.touchDir===map[k]) G3.touchDir=null; };
    el.addEventListener('touchstart', e=>{ e.preventDefault(); set(); }, {passive:false});
    el.addEventListener('touchend', e=>{ e.preventDefault(); clear(); }, {passive:false});
    el.addEventListener('mousedown', set);
    el.addEventListener('mouseup', clear);
    el.addEventListener('mouseleave', clear);
  }
  const abtn = $('actionBtn');
  const press = e=>{ e.preventDefault(); G3.justPressed['enter']=true; };
  abtn.addEventListener('touchstart', press, {passive:false});
  abtn.addEventListener('click', press);
};
/* p9: save / load via localStorage */
'use strict';
const G9 = window.G;
const SAVE_PREFIX = 'wyldkin_save_v1_slot_';

function serialize(){
  const s = G.state;
  return {
    playerName: s.playerName, party: s.party, box: s.box, inventory: s.inventory, money: s.money,
    badges: s.badges, defeatedTrainers: s.defeatedTrainers, defeatedRivals: s.defeatedRivals,
    starterSpecies: s.starterSpecies, rivalSpecies: s.rivalSpecies, flags: s.flags,
    championDefeated: s.championDefeated, playtimeSec: s.playtimeSec,
    player: { map: G4.player.map, x: G4.player.x, y: G4.player.y, dir: G4.player.dir },
    savedAt: Date.now()
  };
}
function deserializeInto(data){
  const s = G.newGameState();
  Object.assign(s, {
    playerName:data.playerName, party:data.party, box:data.box, inventory:data.inventory, money:data.money,
    badges:data.badges, defeatedTrainers:data.defeatedTrainers, defeatedRivals:data.defeatedRivals,
    starterSpecies:data.starterSpecies, rivalSpecies:data.rivalSpecies, flags:Object.assign({collected:{}}, data.flags),
    championDefeated:!!data.championDefeated, playtimeSec:data.playtimeSec||0
  });
  s.screen = 'overworld';
  G.state = s;
  G4.player.map = data.player.map; G4.player.x = data.player.x; G4.player.y = data.player.y; G4.player.dir = data.player.dir||'down';
  G4.player.moving = false;
}

G.saveToSlot = function(slot){
  try { localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(serialize())); return true; }
  catch(e){ G.uiToast('Could not save (storage unavailable).'); return false; }
};
G.loadFromSlot = function(slot){
  try {
    const raw = localStorage.getItem(SAVE_PREFIX+slot);
    if (!raw) return false;
    deserializeInto(JSON.parse(raw));
    return true;
  } catch(e){ return false; }
};
G.getSlotMeta = function(slot){
  try {
    const raw = localStorage.getItem(SAVE_PREFIX+slot);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return { name: d.playerName||'Jasz', badges: (d.badges||[]).length, money: d.money||0 };
  } catch(e){ return null; }
};
G.hasAnySave = function(){
  if (localStorage.getItem(SAVE_PREFIX+'auto')) return true;
  for (let i=1;i<=3;i++) if (localStorage.getItem(SAVE_PREFIX+i)) return true;
  return false;
};

/* autosave every 20s + on visibility change, into slot 0 (auto) */
G.autosave = function(){
  try { localStorage.setItem(SAVE_PREFIX+'auto', JSON.stringify(serialize())); } catch(e){}
};
G.loadAutosave = function(){ return G.loadFromSlotRaw('auto'); };
G.loadFromSlotRaw = function(key){
  try { const raw = localStorage.getItem(SAVE_PREFIX+key); if (!raw) return false; deserializeInto(JSON.parse(raw)); return true; }
  catch(e){ return false; }
};
/* p10: boot + main loop */
'use strict';
(function(){
  const G10 = window.G;
  G.state = G.newGameState();

  function boot(){
    G3.initRenderers();
    G3.initInput();
    G4.initOverworldScene();
    G3.resizeRenderers();
    G.uiWireTouch();

    $('newGameBtn').onclick = ()=>{ $('continuePicker').style.display='none'; G.uiStartNewGame(); };
    $('titleContinueBtn').onclick = ()=> G.uiContinue();
    $('continueCancelBtn').onclick = ()=>{ $('continuePicker').style.display='none'; };
    $('dialogueBox').onclick = ()=> G.uiDialogueTap();
    $('menuBtn').onclick = ()=> G.uiOpenMenu();
    $('closeMenuBtn').onclick = ()=> G.uiCloseMenu();
    $('closeShopBtn').onclick = ()=> G.uiCloseShop();
    ['party','bag','badges','save','load'].forEach(t=>{ $('ptab_'+t).onclick = ()=>G.uiPauseTab(t); });

    G.state.screen = 'title';
    G.uiRender();

    let last = performance.now();
    function loop(now){
      const dt = now-last; last = now;
      if (G.state.screen==='overworld') { G4.updateOverworld(dt); }
      if (['overworld','pause','dialogue','shop'].includes(G.state.screen)) G4.drawOverworld();
      G.justPressed = {};
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    setInterval(()=>{
      if (G.state.screen!=='title'){ G.state.playtimeSec++; }
      if (G.state.flags && G.state.flags.gotStarter) G.autosave();
    }, 1000);

    window.addEventListener('beforeunload', ()=>{ if (G.state.flags && G.state.flags.gotStarter) G.autosave(); });
    document.addEventListener('visibilitychange', ()=>{ if (document.hidden && G.state.flags && G.state.flags.gotStarter) G.autosave(); });
  }

  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
