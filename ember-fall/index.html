  P.shrines.forEach(id => { if (!next.shrines[id]) next.shrines[id] = { by: P.name, lv: P.lv }; });
  const newDmg = Math.max(0, P.bossDmg - (P.bossDmgSent || 0));
  if (newDmg > 0 && !next.boss.slain) next.boss.hp = Math.max(0, next.boss.hp - newDmg);
  if (P.flags.slayer) {
    next.boss.slain = true; next.boss.hp = 0;
    if (next.boss.slayers.indexOf(P.name) < 0) next.boss.slayers.push(P.name);
  }
  const i = next.heroes.findIndex(h => h.name === P.name);
  const rec = { name: P.name.slice(0, 24), lv: P.lv, sig: P.sigils.length, cls: P.cls };
  if (i >= 0) next.heroes[i] = rec; else next.heroes.push(rec);
  next.heroes = next.heroes.sort((a, b) => b.lv - a.lv).slice(0, 40);
  next.chronicle.push({ by: P.name.slice(0, 24), text: pending.join("; ").slice(0, 240), when: "epoch " + next.epoch + " · level " + P.lv });
  next.chronicle = next.chronicle.slice(-60);

  let html = PAGE_SOURCE
    .replace(/<script id="world-state"[^>]*>[\s\S]*?<\/script>/,
      '<script id="world-state" type="application/json">' + JSON.stringify(next).replace(/<\//g, "<\\/") + '<\/script>')
    .replace(/<script\b[^>]*\ssrc\s*=\s*["'](?:https?:)?\/\/[^>]*>\s*<\/script>/gi, "");

  if (html.indexOf('id="world-state"') < 0 || html.indexOf("EMBERFALL_BOOT") < 0) {
    chronBusy = false;
    return dialogue("The Waystone", "The stone refuses the writing. Nothing was changed.", [{ t: "Step away", f: closeDialogue }]);
  }

  P.bossDmgSent = P.bossDmg;
  save(0, true);
  try { localStorage.setItem(RESUME, "1"); } catch (e) { }
  try {
    await art.publish(html);
    dialogue("The Waystone", "Written. The world is reloading for everyone who has it open — you will wake exactly where you stand.", []);
  } catch (err) {
    chronBusy = false;
    const code = (err && (err.code || err.message)) || "";
    if (String(code).indexOf("conflict") >= 0) {
      return dialogue("The Waystone", "Another hero reached a stone first. The world is reloading to theirs — walk back to the stone and write again.", [{ t: "Very well", f: closeDialogue }]);
    }
    if (String(code).indexOf("not_writer") >= 0 || String(code).indexOf("not_granted") >= 0) {
      return dialogue("The Waystone", "You may read this world but not write to it — the Chronicle takes only its owner's hand. Your own progress is saved as normal.", [{ t: "Step away", f: closeDialogue }]);
    }
    return dialogue("The Waystone", "The stone would not take it. Nothing was lost.", [{ t: "Step away", f: closeDialogue }]);
  }
}

/* ============================================================
   title screen & boot
   ============================================================ */
function startPlay() {
  running = true; paused = false;
  $("title").classList.remove("on");
  closeModal(); closeDialogue();
  $("hud").classList.add("on");
  fit();
  drawQuestCards();
}
function showTitle() {
  running = false; paused = true;
  $("hud").classList.remove("on");
  $("touch").classList.remove("on");
  $("title").classList.add("on");
  $("tEpoch").textContent = SHARED.epoch;
  const lit = Object.keys(SHARED.shrines).length;
  $("worldline").innerHTML =
    "seed <b>" + SHARED.seed + "</b> — the same land for every hero<br>"
    + "shrines woken by others: <b>" + lit + " / 7</b><br>"
    + (SHARED.boss.slain
      ? "the Emberfall lies <b>slain</b>"
      : "the Emberfall holds <b>" + Math.ceil(SHARED.boss.hp / SHARED.boss.maxHp * 100) + "%</b> of its strength")
    + "<br>heroes at the stones: <b>" + SHARED.heroes.length + "</b>";
  $("btnLoad").disabled = ![0, 1, 2, 3].some(i => readSlot(i));
}

$("btnNew").onclick = () => {
  let name = "", cls = "warden";
  const mount = () => modal(
    '<h2>Name yourself</h2><p>This name is what other heroes will read at the Waystones.</p>'
    + '<input id="nm" maxlength="20" placeholder="a name" style="width:100%;padding:11px;background:#0E1220;border:1px solid var(--edge);color:var(--parch);font:16px var(--d-body);border-radius:2px">'
    + '<h3>Choose a road</h3><div id="cls"></div>'
    + '<div class="foot"><button class="btn primary" id="go">Walk out</button><button class="btn" id="bk">Back</button></div>',
    root => {
      const box = root.querySelector("#cls");
      CLASSES.forEach(c => {
        const d = document.createElement("div");
        d.className = "row" + (c.id === cls ? " sel" : "");
        d.innerHTML = '<div class="t">' + c.name + '<small>' + c.blurb + ' — ' + c.hp + ' health, ' + c.mp + ' focus, ' + c.spell + '</small></div>';
        d.onclick = () => { cls = c.id; name = root.querySelector("#nm").value; mount(); };
        box.appendChild(d);
      });
      root.querySelector("#nm").value = name;
      root.querySelector("#go").onclick = () => {
        const v = (root.querySelector("#nm").value || "").trim().slice(0, 20);
        if (!v) { root.querySelector("#nm").focus(); return; }
        P = newPlayer(v, cls);
        enterOverworld();
        cam.x = P.x; cam.y = P.y;
        closeModal(); startPlay();
        zoneToast("Hearthwatch", "epoch " + SHARED.epoch);
        log("Speak to <b>Elder Maren</b> — she is standing just north of you.");
        save(0, true);
      };
      root.querySelector("#bk").onclick = () => { closeModal(); };
    });
  mount();
};
$("btnLoad").onclick = () => {
  let h = '<h2>Saved heroes</h2><p>Kept in this browser only. The shared world is the same for all of them.</p>';
  for (let i = 0; i <= 3; i++) {
    const s = slotLabel(i);
    h += '<div class="row"><div class="t">' + (i === 0 ? "Autosave" : "Slot " + i) + '<small>' + (s ? s.name + " — " + s.sub : "empty") + '</small></div>'
      + (s ? '<button class="btn" data-load="' + i + '">Load</button>' : '') + '</div>';
  }
  h += '<div class="foot"><button class="btn" id="bk2">Back</button></div>';
  modal(h, root => {
    root.querySelectorAll("[data-load]").forEach(el => el.onclick = () => { load(+el.dataset.load); });
    root.querySelector("#bk2").onclick = closeModal;
  });
};
$("btnChron").onclick = () => modal('<h2>The Chronicle</h2><div class="label">what every hero in this world has already done</div>'
  + '<div style="margin-top:14px">' + chronicleHtml() + '</div><div class="foot"><button class="btn" id="bk3">Back</button></div>',
  root => root.querySelector("#bk3").onclick = closeModal);
$("btnHelp").onclick = () => modal('<h2>How to play</h2>' + helpHtml() + '<div class="foot"><button class="btn" id="bk4">Back</button></div>',
  root => root.querySelector("#bk4").onclick = closeModal);
$("menuBtn").onclick = () => openMenu("hero");

/* ---------- boot ---------- */
const EMBERFALL_BOOT = true;
buildSites();
realm = overworldRealm();
P = newPlayer("—", "warden");
cam.x = P.x; cam.y = P.y;
fit();
requestAnimationFrame(frame);

let resumed = false;
try {
  if (localStorage.getItem(RESUME) === "1") {
    localStorage.removeItem(RESUME);
    resumed = load(0);
    if (resumed) log("The world was rewritten. You are where you were.");
  }
} catch (e) { }
if (!resumed) showTitle();

</script>
