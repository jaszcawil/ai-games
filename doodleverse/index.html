<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DoodleVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#20242B;
  --bg-2:#262B33;
  --bg-3:#2E3440;
  --paper:#F6F1E4;
  --paper-line:#E4DCC6;
  --ink:#EDEBE3;
  --ink-dim:#9BA3AE;
  --ink-faint:#6B7280;
  --line:rgba(255,255,255,0.09);
  --line-soft:rgba(255,255,255,0.05);
  --red:#E8484B;
  --yellow:#FFC93C;
  --blue:#3FA7D6;
  --green:#4CC9A5;
  --violet:#9B6BFF;
  --orange:#FF9F5A;
  --shadow-hard:4px 4px 0 rgba(0,0,0,0.28);
  --shadow-soft:0 10px 30px rgba(0,0,0,0.35);
  --radius:16px;
  --font-display:'Permanent Marker', cursive;
  --font-body:'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
body{
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.055) 1px, transparent 0);
  background-size:22px 22px;
  min-height:100vh;
  overflow-x:hidden;
}
#app{position:relative;min-height:100vh;width:100%;}
.view{display:none;min-height:100vh;width:100%;flex-direction:column;}
.view.active{display:flex;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--yellow);color:#20242B;}

a.dv-btn, button.dv-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:3px solid #14171C;
  border-radius:14px;
  padding:12px 22px;
  font-family:var(--font-body);
  font-weight:800;
  font-size:15px;
  color:#14171C;
  background:var(--yellow);
  box-shadow:var(--shadow-hard);
  transition:transform .12s ease, box-shadow .12s ease;
  text-decoration:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.dv-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,0);}
.dv-btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none;}
.dv-btn.ghost:active{transform:translate(1px,1px);}
.dv-btn.red{background:var(--red);color:#fff;}
.dv-btn.blue{background:var(--blue);color:#fff;}
.dv-btn.green{background:var(--green);color:#0b241c;}
.dv-btn.violet{background:var(--violet);color:#fff;}
.dv-btn.small{padding:8px 14px;font-size:13px;border-width:2px;box-shadow:2px 2px 0 rgba(0,0,0,.28);}
.dv-btn:disabled{opacity:.4;cursor:not-allowed;}
.dv-btn.full{width:100%;}

.dv-topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  background:var(--bg-2);
  border-bottom:2px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.dv-topbar h1{
  font-family:var(--font-display);
  font-size:22px;font-weight:400;margin:0;
  flex:1;letter-spacing:.5px;
}
.dv-back{
  width:40px;height:40px;border-radius:12px;
  border:2px solid var(--line);background:var(--bg-3);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0;
}
.dv-back:active{transform:scale(.92);}

.dv-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-3);border:2px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;
  color:var(--ink-dim);font-family:var(--font-mono);
}

/* ---------- TITLE ---------- */
#view-title{
  align-items:center;justify-content:center;text-align:center;
  padding:32px 20px;gap:22px;
  background:
    radial-gradient(ellipse at 30% 15%, rgba(155,107,255,0.18), transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(63,167,214,0.15), transparent 55%),
    var(--bg);
}
.title-wordmark{max-width:560px;width:100%;}
.title-wordmark svg{width:100%;height:auto;overflow:visible;}
.title-tagline{font-size:15px;color:var(--ink-dim);font-weight:700;max-width:380px;margin:0;}
.title-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin-top:8px;}
.title-foot{font-size:11px;color:var(--ink-faint);margin-top:18px;font-family:var(--font-mono);}

.dv-modal-backdrop{
  position:fixed;inset:0;background:rgba(10,12,16,0.72);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:18px;backdrop-filter:blur(2px);
}
.dv-modal{
  background:var(--bg-2);border:2px solid var(--line);border-radius:20px;
  max-width:440px;width:100%;max-height:86vh;overflow-y:auto;
  padding:22px;box-shadow:var(--shadow-soft);
}
.dv-modal h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0 0 14px;}
.dv-modal .close-x{position:sticky;top:0;float:right;background:none;border:none;color:var(--ink-dim);font-size:22px;}

.slot-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--bg-3);
}
.slot-row .slot-info{display:flex;flex-direction:column;gap:2px;}
.slot-row .slot-name{font-weight:800;font-size:14px;}
.slot-row .slot-meta{font-size:11.5px;color:var(--ink-dim);font-family:var(--font-mono);}
.slot-row.empty{opacity:.55;}

.dv-field{width:100%;margin-bottom:14px;text-align:left;}
.dv-field label{display:block;font-size:12px;font-weight:800;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.dv-field input[type=text]{
  width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--bg-3);color:var(--ink);font-size:16px;font-weight:700;
}
.dv-field input[type=text]:focus{outline:2px solid var(--yellow);border-color:var(--yellow);}

/* ---------- HUB ---------- */
#view-hub .hub-wrap{max-width:920px;margin:0 auto;padding:20px 18px 60px;width:100%;}
.hub-hero{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.hub-hero .badge-avatar{
  width:54px;height:54px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:22px;color:#14171C;
  border:3px solid #14171C;box-shadow:var(--shadow-hard);
}
.hub-hero .hub-hero-text{flex:1;min-width:0;}
.hub-hero .hub-hero-text .hi{font-size:12px;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.hub-hero .hub-hero-text .nm{font-family:var(--font-display);font-size:24px;line-height:1.1;}
.hub-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}

.hub-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
}
.mode-card{
  position:relative;border-radius:20px;padding:20px 18px 18px;
  border:3px solid #14171C;box-shadow:var(--shadow-hard);
  min-height:158px;display:flex;flex-direction:column;justify-content:space-between;
  transform:rotate(var(--tilt,0deg));transition:transform .15s ease;
  text-align:left;color:#14171C;
}
.mode-card:active{transform:rotate(var(--tilt,0deg)) translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,0);}
.mode-card .pin{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:18px;height:18px;border-radius:50%;background:#14171C;
  box-shadow:0 3px 0 rgba(0,0,0,.2);
}
.mode-card .mc-icon{width:34px;height:34px;margin-bottom:10px;}
.mode-card h3{font-family:var(--font-display);font-weight:400;font-size:19px;margin:0 0 4px;line-height:1.05;}
.mode-card p{margin:0;font-size:12.5px;font-weight:700;opacity:.78;line-height:1.35;}
.mode-card .mc-stat{
  margin-top:10px;font-family:var(--font-mono);font-size:11px;font-weight:700;
  background:rgba(20,23,28,0.14);display:inline-block;padding:4px 9px;border-radius:8px;align-self:flex-start;
}
.mc-c1{background:var(--yellow);}
.mc-c2{background:var(--green);}
.mc-c3{background:var(--blue);color:#fff;}
.mc-c4{background:var(--orange);}
.mc-c5{background:var(--violet);color:#fff;}
.mc-c3 .mc-stat, .mc-c5 .mc-stat{background:rgba(255,255,255,.18);}

/* ---------- STUDIO ---------- */
#view-studio .studio-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
.studio-body{
  flex:1;display:flex;gap:14px;padding:14px;min-height:0;
  align-items:flex-start;flex-wrap:wrap;justify-content:center;
}
.studio-canvas-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;min-width:280px;}
.canvas-frame{
  background:#14171C;padding:10px;border-radius:16px;box-shadow:var(--shadow-soft);
  max-width:100%;
}
.canvas-stack{position:relative;display:inline-block;max-width:100%;line-height:0;}
#bgCanvas{display:block;border-radius:8px;max-width:100%;height:auto;}
#drawCanvas{
  position:absolute;top:0;left:0;width:100%;height:100%;
  touch-action:none;border-radius:8px;cursor:crosshair;
}
.studio-context-banner{
  font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:#14171C;
  background:var(--yellow);border:2px solid #14171C;border-radius:10px;padding:8px 12px;
  max-width:100%;text-align:center;
}
.studio-toolbar{
  width:230px;flex-shrink:0;background:var(--bg-2);border:2px solid var(--line);
  border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px;
}
.tb-section-label{font-size:11px;font-weight:800;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.tool-btn{
  padding:8px 4px;border-radius:10px;border:2px solid var(--line);background:var(--bg-3);
  color:var(--ink-dim);font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.tool-btn svg{width:18px;height:18px;}
.tool-btn.active{border-color:var(--yellow);background:rgba(255,201,60,0.14);color:var(--yellow);}
.color-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.color-sw{
  width:100%;aspect-ratio:1;border-radius:8px;border:2px solid rgba(255,255,255,.25);
}
.color-sw.active{border-color:#fff;box-shadow:0 0 0 2px var(--yellow);}
.size-row{display:flex;align-items:center;gap:10px;}
.size-row input[type=range]{flex:1;accent-color:var(--yellow);}
.size-preview{width:26px;height:26px;border-radius:50%;background:var(--ink);flex-shrink:0;}
.tb-row2{display:flex;gap:8px;}
.tb-row2 .dv-btn{flex:1;}
.select-row select{
  width:100%;padding:9px 10px;border-radius:10px;border:2px solid var(--line);
  background:var(--bg-3);color:var(--ink);font-weight:700;font-size:12.5px;
}
.studio-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 16px;justify-content:center;}

/* ---------- GALLERY GRID (shared by guess / gallery / challenges) ---------- */
.dv-scroll{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
.tabbar{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap;}
.tab-btn{
  padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg-2);
  color:var(--ink-dim);font-weight:800;font-size:12.5px;
}
.tab-btn.active{background:var(--yellow);color:#14171C;border-color:#14171C;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.pic-card{
  background:var(--bg-2);border:2px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;text-align:left;
}
.pic-card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff;display:block;}
.pic-card .pic-meta{padding:9px 10px;display:flex;flex-direction:column;gap:4px;}
.pic-card .pic-author{font-size:11.5px;font-weight:800;color:var(--ink-dim);font-family:var(--font-mono);}
.pic-card .pic-actions{display:flex;align-items:center;justify-content:space-between;padding:0 10px 10px;gap:6px;}
.like-btn{
  background:none;border:none;color:var(--ink-dim);font-size:13px;font-weight:800;display:flex;align-items:center;gap:4px;
}
.like-btn.liked{color:var(--red);}
.empty-state{
  text-align:center;padding:50px 20px;color:var(--ink-dim);
}
.empty-state .es-icon{font-size:40px;margin-bottom:10px;}
.empty-state h3{font-family:var(--font-display);font-weight:400;color:var(--ink);margin:0 0 6px;}
.empty-state p{font-size:13px;margin:0 0 16px;}
.loading-row{padding:30px;text-align:center;color:var(--ink-dim);font-family:var(--font-mono);font-size:13px;}

.hero-banner{
  margin:16px;padding:20px;border-radius:18px;border:3px solid #14171C;
  box-shadow:var(--shadow-hard);
}
.hero-banner .hb-label{font-family:var(--font-mono);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.7;}
.hero-banner h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:6px 0 8px;color:#14171C;}
.hero-banner p{margin:0 0 14px;font-size:13.5px;font-weight:700;color:#14171C;opacity:.85;}

.leader-list{padding:0 16px 20px;}
.leader-row{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line-soft);
}
.leader-rank{font-family:var(--font-mono);font-weight:800;color:var(--ink-dim);width:26px;}
.leader-name{flex:1;font-weight:800;font-size:14px;}
.leader-pts{font-family:var(--font-mono);color:var(--yellow);font-weight:700;}

/* ---------- OBBY ---------- */
#view-obby .obby-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
.level-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:16px;}
.level-card{
  border:3px solid #14171C;border-radius:18px;padding:16px;box-shadow:var(--shadow-hard);color:#14171C;
  display:flex;flex-direction:column;gap:6px;text-align:left;
}
.level-card.locked{opacity:.5;filter:grayscale(.5);}
.level-card h3{font-family:var(--font-display);font-weight:400;font-size:19px;margin:0;}
.level-card .lv-meta{font-family:var(--font-mono);font-size:11.5px;font-weight:700;opacity:.8;}
.obby-stage-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;position:relative;
}
#obbyCanvas{
  background:linear-gradient(#78C7E8,#BFE7F0);border-radius:12px;max-width:100%;max-height:100%;box-shadow:var(--shadow-soft);
  touch-action:none;
}
.obby-hud{
  position:absolute;top:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;z-index:5;
}
.obby-hud .dv-chip{background:rgba(20,23,28,.72);border:none;color:#fff;}
.touch-controls{
  position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none;
}
.tc-group{display:flex;gap:10px;pointer-events:all;}
.tc-btn{
  width:58px;height:58px;border-radius:50%;background:rgba(20,23,28,.55);border:2px solid rgba(255,255,255,.4);
  color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(2px);
}
.tc-btn:active{background:rgba(255,201,60,.7);}

/* ---------- Toast ---------- */
.dv-toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(0);
  background:#14171C;color:#fff;padding:12px 20px;border-radius:12px;font-weight:800;font-size:13.5px;
  box-shadow:var(--shadow-soft);z-index:200;border:2px solid rgba(255,255,255,.15);
  display:flex;align-items:center;gap:8px;max-width:90vw;text-align:center;
  animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

.spinner{
  width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;
  animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Responsive ---------- */
@media (max-width:720px){
  .hub-grid{grid-template-columns:1fr 1fr;gap:12px;}
  .studio-body{flex-direction:column;align-items:stretch;}
  .studio-toolbar{width:100%;order:2;}
  .studio-canvas-col{order:1;}
}
@media (max-width:480px){
  .hub-grid{grid-template-columns:1fr;}
  .dv-topbar h1{font-size:18px;}
  .mode-card{min-height:120px;}
  .tool-grid{grid-template-columns:repeat(3,1fr);}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .tc-btn{width:52px;height:52px;font-size:19px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ TITLE ============ -->
  <section id="view-title" class="view active">
    <div class="title-wordmark" id="titleWordmark"></div>
    <p class="title-tagline">Draw. Guess. Climb. A whole world made of doodles — shared with everyone who plays.</p>
    <div class="title-actions" id="titleActions"></div>
    <div class="title-foot">v1.0 · your doodles are visible to other players</div>
  </section>

  <!-- ============ HUB ============ -->
  <section id="view-hub" class="view">
    <div class="dv-topbar">
      <h1>DoodleVerse</h1>
      <button class="dv-back" id="hubMenuBtn" title="Menu" aria-label="Menu">☰</button>
    </div>
    <div class="dv-scroll">
      <div class="hub-wrap">
        <div class="hub-hero">
          <div class="badge-avatar" id="hubAvatar" style="background:var(--yellow);">?</div>
          <div class="hub-hero-text">
            <div class="hi">Welcome back</div>
            <div class="nm" id="hubNickname">Doodler</div>
          </div>
        </div>
        <div class="hub-stats" id="hubStats"></div>
        <div class="hub-grid" id="hubGrid"></div>
      </div>
    </div>
  </section>

  <!-- ============ STUDIO ============ -->
  <section id="view-studio" class="view">
    <div class="dv-topbar">
      <button class="dv-back" id="studioBackBtn">←</button>
      <h1>Studio</h1>
      <button class="dv-back" id="studioNewBtn" title="New canvas">＋</button>
    </div>
    <div class="studio-wrap">
      <div id="studioContextBannerWrap" style="padding:10px 14px 0;display:none;">
        <div class="studio-context-banner" id="studioContextBanner"></div>
      </div>
      <div class="studio-body">
        <div class="studio-canvas-col">
          <div class="canvas-frame"><div class="canvas-stack" id="canvasStack">
            <canvas id="bgCanvas" width="720" height="540"></canvas>
            <canvas id="drawCanvas" width="720" height="540"></canvas>
          </div></div>
        </div>
        <div class="studio-toolbar">
          <div>
            <div class="tb-section-label">Tools</div>
            <div class="tool-grid" id="toolGrid"></div>
          </div>
          <div>
            <div class="tb-section-label">Color</div>
            <div class="color-grid" id="colorGrid"></div>
            <div style="margin-top:8px;"><input type="color" id="customColor" value="#e8484b" style="width:100%;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--bg-3);"></div>
          </div>
          <div>
            <div class="tb-section-label">Size</div>
            <div class="size-row">
              <input type="range" id="sizeRange" min="1" max="60" value="8">
              <div class="size-preview" id="sizePreview"></div>
            </div>
          </div>
          <div class="tb-row2">
            <button class="dv-btn ghost small" id="undoBtn">↺ Undo</button>
            <button class="dv-btn ghost small" id="redoBtn">↻ Redo</button>
          </div>
          <button class="dv-btn ghost small full" id="clearBtn">Clear canvas</button>
        </div>
      </div>
      <div class="studio-actions" id="studioActions"></div>
    </div>
  </section>

  <!-- ============ GUESS ARENA ============ -->
  <section id="view-guess" class="view">
    <div class="dv-topbar">
      <button class="dv-back" data-nav="view-hub">←</button>
      <h1>Guess Arena</h1>
      <div class="dv-chip" id="guessPointsChip">0 pts</div>
    </div>
    <div class="tabbar" id="guessTabs"></div>
    <div class="dv-scroll" id="guessContent"></div>
  </section>

  <!-- ============ CHALLENGES ============ -->
  <section id="view-challenges" class="view">
    <div class="dv-topbar">

<script>
/* =========================================================
   DoodleVerse — core.js
   Global namespace, storage helpers, profile/save system,
   navigation, toasts, modals, shared constants & utilities.

window.DV = window.DV || {};

/* ---------------- Storage wrapper ---------------- */
DV.Store = {
  async get(key, shared){
    try{
      const r = await window.storage.get(key, !!shared);
      return r ? r.value : null;
    }catch(e){ return null; }
  },
  async getJSON(key, shared){
    const v = await DV.Store.get(key, shared);
    if(v==null) return null;
    try{ return JSON.parse(v); }catch(e){ return null; }
  },
  async set(key, value, shared){
    try{ return await window.storage.set(key, value, !!shared); }
    catch(e){ console.error('[DV storage] set failed', key, e); return null; }
  },
  async setJSON(key, obj, shared){
    return DV.Store.set(key, JSON.stringify(obj), !!shared);
  },
  async del(key, shared){
    try{ return await window.storage.delete(key, !!shared); }
    catch(e){ return null; }
  },
  async list(prefix, shared){
    try{
      const r = await window.storage.list(prefix, !!shared);
      return r && r.keys ? r.keys : [];
    }catch(e){ return []; }
  }
};

/* ---------------- Utilities ---------------- */
DV.util = {
  id(prefix){
    return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  },
  todayKey(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  },
  weekKey(){
    const d = new Date();
    const onejan = new Date(d.getFullYear(),0,1);
    const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
    return d.getFullYear()+'-w'+week;
  },
  hashStr(s){
    let h = 0;
    for(let i=0;i<s.length;i++){ h = (Math.imul(31,h) + s.charCodeAt(i))|0; }
    return Math.abs(h);
  },
  pickSeeded(arr, seedStr){
    if(!arr.length) return null;
    return arr[DV.util.hashStr(seedStr) % arr.length];
  },
  clamp(v,a,b){ return Math.max(a,Math.min(b,v)); },
  fmtTime(ms){
    const totalCs = Math.floor(ms/10);
    const m = Math.floor(totalCs/6000);
    const s = Math.floor((totalCs%6000)/100);
    const cs = totalCs%100;
    return String(m).padStart(1,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
  },
  escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  timeAgo(ts){
    const s = Math.floor((Date.now()-ts)/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  },
  normalizeGuess(s){
    return String(s||'').toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');
  },
  async resizeImage(sourceCanvas, maxDim, quality){
    maxDim = maxDim || 260;
    quality = quality || 0.82;
    const w = sourceCanvas.width, h = sourceCanvas.height;
    const scale = Math.min(1, maxDim / Math.max(w,h));
    const tw = Math.max(1, Math.round(w*scale)), th = Math.max(1, Math.round(h*scale));
    const off = document.createElement('canvas');
    off.width = tw; off.height = th;
    const ctx = off.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,tw,th);
    ctx.drawImage(sourceCanvas, 0, 0, tw, th);
    return off.toDataURL('image/jpeg', quality);
  }
};

/* ---------------- Toasts ---------------- */
DV.toast = function(msg, opts){
  opts = opts || {};
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'dv-toast';
  el.innerHTML = (opts.icon ? opts.icon+' ' : '') + DV.util.escapeHtml(msg);
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(), 320); }, opts.duration || 2200);
};

/* ---------------- Modal ---------------- */
DV.modal = function(innerHtml, opts){
  opts = opts || {};
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const backdrop = document.createElement('div');
  backdrop.className = 'dv-modal-backdrop';
  const box = document.createElement('div');
  box.className = 'dv-modal';
  box.innerHTML = '<button class="close-x" aria-label="Close">✕</button>' + innerHtml;
  backdrop.appendChild(box);
  root.appendChild(backdrop);
  const close = () => { root.innerHTML=''; if(opts.onClose) opts.onClose(); };
  box.querySelector('.close-x').onclick = close;
  if(!opts.persistent){
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  } else {
    box.querySelector('.close-x').style.display='none';
  }
  return { close, box };
};

/* =========================================================
   DoodleVerse — studio.js
   The drawing engine: pencil/pen/marker/brush/spray/eraser,
   color & size controls, canvas size/type presets, undo/redo,
   and the save / publish / submit flows.
   ========================================================= */
DV.Studio = (function(){

  const TOOLS = [
    {id:'pencil', label:'Pencil', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l1.5-5L16 4.5 19.5 8 8 19.5 3 21z"/><path d="M14 6.5L17.5 10"/></svg>'},
    {id:'pen', label:'Pen', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1-4L17 4l3 3L8 19l-4 1z"/></svg>'},
    {id:'marker', label:'Marker', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 21l1-6 9-9 5 5-9 9-6 1z"/><path d="M13 6l5 5"/></svg>'},
    {id:'brush', label:'Brush', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 15c-2 2-2 5-5 5 0-3 2-6 4-8"/><path d="M9.5 14.5L18 4c1 1 2 2 1 3L9 16"/></svg>'},
    {id:'spray', label:'Spray', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="1"/><circle cx="10" cy="4" r="1"/><circle cx="5" cy="10" r="1"/><path d="M11 11l9 9M14 8l7 7M8 14l6 6"/></svg>'},
    {id:'eraser', label:'Eraser', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13l-7 7H6l-3-3 10-10 8 8-3-2z"/><path d="M9 20h11"/></svg>'}
  ];

  let state = {
    tool: 'pen',
    color: '#14171C',
    size: 8,
    canvasSize: DV.CONST.canvasSizes[1],
    canvasType: DV.CONST.canvasTypes[0],
    drawContext: {type:'free'},
    hasStrokes: false
  };

  let bg, bgctx, draw, dctx;
  let undoStack = [], redoStack = [];
  let drawing = false, lastPt = null, moved = false;

  function el(id){ return document.getElementById(id); }

  function paintBackground(){
    const t = state.canvasType;
    bgctx.fillStyle = t.bg;
    bgctx.fillRect(0,0,bg.width,bg.height);
    if(t.draw === 'grid'){
      bgctx.strokeStyle = 'rgba(255,255,255,0.18)';
      bgctx.lineWidth = 1;
      for(let x=0;x<bg.width;x+=30){ bgctx.beginPath(); bgctx.moveTo(x,0); bgctx.lineTo(x,bg.height); bgctx.stroke(); }
      for(let y=0;y<bg.height;y+=30){ bgctx.beginPath(); bgctx.moveTo(0,y); bgctx.lineTo(bg.width,y); bgctx.stroke(); }
    } else if(t.draw === 'dots'){
      bgctx.fillStyle = 'rgba(20,23,28,0.18)';
      for(let x=20;x<bg.width;x+=24){
        for(let y=20;y<bg.height;y+=24){
          bgctx.beginPath(); bgctx.arc(x,y,1.4,0,Math.PI*2); bgctx.fill();
        }
      }
    }
  }

  function setCanvasDims(w,h){
    bg.width = w; bg.height = h;
    draw.width = w; draw.height = h;
  }

  function newCanvas(sizeObj, typeObj, opts){
    opts = opts || {};
    state.canvasSize = sizeObj;
    state.canvasType = typeObj;
    setCanvasDims(sizeObj.w, sizeObj.h);
    paintBackground();
    dctx.clearRect(0,0,draw.width,draw.height);
    undoStack = []; redoStack = [];
    state.hasStrokes = false;
    if(!opts.silent) DV.toast('New '+sizeObj.label+' · '+typeObj.label+' canvas ready', {icon:'🎨'});
  }

  function pushUndo(){
    try{
      const snap = dctx.getImageData(0,0,draw.width,draw.height);
      undoStack.push(snap);
      if(undoStack.length>20) undoStack.shift();
      redoStack = [];
    }catch(e){}
  }

  function undo(){
    if(!undoStack.length) return;
    try{
      redoStack.push(dctx.getImageData(0,0,draw.width,draw.height));
      const snap = undoStack.pop();
      dctx.putImageData(snap,0,0);
    }catch(e){}
  }
  function redo(){
    if(!redoStack.length) return;
    try{
      undoStack.push(dctx.getImageData(0,0,draw.width,draw.height));
      const snap = redoStack.pop();
      dctx.putImageData(snap,0,0);
    }catch(e){}
  }

  function getPos(e){
    const rect = draw.getBoundingClientRect();
    const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    const cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    const scaleX = draw.width / rect.width;
    const scaleY = draw.height / rect.height;
    return { x: (cx-rect.left)*scaleX, y: (cy-rect.top)*scaleY };
  }

  function strokeSetup(){
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';
    dctx.globalCompositeOperation = 'source-over';
    dctx.globalAlpha = 1;
    dctx.shadowBlur = 0;
  }

  function segment(p0, p1){
    const t = state.tool, sz = state.size, col = state.color;
    strokeSetup();
    if(t === 'pencil'){
      dctx.globalAlpha = 0.82;
      dctx.strokeStyle = col;
      dctx.lineWidth = Math.max(1, sz*0.55);
      dctx.beginPath();
      dctx.moveTo(p0.x + (Math.random()-0.5)*0.6, p0.y + (Math.random()-0.5)*0.6);
      dctx.lineTo(p1.x + (Math.random()-0.5)*0.6, p1.y + (Math.random()-0.5)*0.6);
      dctx.stroke();
    } else if(t === 'pen'){
      dctx.strokeStyle = col;
      dctx.lineWidth = sz;
      dctx.beginPath();
      dctx.moveTo(p0.x,p0.y);
      dctx.lineTo(p1.x,p1.y);
      dctx.stroke();
    } else if(t === 'marker'){
      dctx.globalCompositeOperation = 'multiply';
      dctx.globalAlpha = 0.6;
      dctx.strokeStyle = col;
      dctx.lineWidth = sz*1.7;
      dctx.beginPath();
      dctx.moveTo(p0.x,p0.y);
      dctx.lineTo(p1.x,p1.y);
      dctx.stroke();
    } else if(t === 'brush'){
      const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
      const steps = Math.max(1, Math.ceil(dist/2));
      dctx.globalAlpha = 0.35;
      for(let i=0;i<=steps;i++){
        const x = p0.x + (p1.x-p0.x)*(i/steps);
        const y = p0.y + (p1.y-p0.y)*(i/steps);
        const r = sz*0.7;
        const grad = dctx.createRadialGradient(x,y,0,x,y,r);
        grad.addColorStop(0, col);
        grad.addColorStop(1, col+'00');
        dctx.fillStyle = grad;
        dctx.beginPath();
        dctx.arc(x,y,r,0,Math.PI*2);
        dctx.fill();
      }
    } else if(t === 'spray'){
      const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
      const steps = Math.max(1, Math.ceil(dist/4));
      dctx.globalAlpha = 0.75;
      dctx.fillStyle = col;
      for(let i=0;i<=steps;i++){
        const x = p0.x + (p1.x-p0.x)*(i/steps);
        const y = p0.y + (p1.y-p0.y)*(i/steps);
        const density = Math.round(sz*0.8);
        for(let d=0;d<density;d++){
          const ang = Math.random()*Math.PI*2;
          const rad = Math.random()*sz*0.9;
          dctx.beginPath();
          dctx.arc(x+Math.cos(ang)*rad, y+Math.sin(ang)*rad, 0.9, 0, Math.PI*2);
          dctx.fill();
        }
      }
    } else if(t === 'eraser'){
      dctx.globalCompositeOperation = 'destination-out';
      dctx.globalAlpha = 1;
      dctx.lineWidth = sz*1.6;
      dctx.beginPath();
      dctx.moveTo(p0.x,p0.y);
      dctx.lineTo(p1.x,p1.y);
      dctx.stroke();
    }
  }

  function dot(p){ segment({x:p.x-0.01,y:p.y-0.01}, p); }

  function onDown(e){
    e.preventDefault();
    pushUndo();
    drawing = true; moved = false;
    lastPt = getPos(e);
    dot(lastPt);
    state.hasStrokes = true;
  }
  function onMove(e){
    if(!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    segment(lastPt, p);
    lastPt = p; moved = true;
  }
  function onUp(e){
    if(!drawing) return;
    drawing = false;
    dctx.globalCompositeOperation = 'source-over';
    dctx.globalAlpha = 1;
  }

  function renderToolGrid(){
    const grid = el('toolGrid');
    grid.innerHTML = TOOLS.map(t =>
      `<button class="tool-btn${t.id===state.tool?' active':''}" data-tool="${t.id}">${t.icon}<span>${t.label}</span></button>`
    ).join('');
    grid.querySelectorAll('.tool-btn').forEach(b=>{
      b.onclick = ()=>{ state.tool = b.getAttribute('data-tool'); renderToolGrid(); };
    });
  }

  function renderColorGrid(){
    const grid = el('colorGrid');
    grid.innerHTML = DV.CONST.palette.map(c =>
      `<button class="color-sw${c.toLowerCase()===state.color.toLowerCase()?' active':''}" style="background:${c}" data-color="${c}" aria-label="${c}"></button>`
    ).join('');
    grid.querySelectorAll('.color-sw').forEach(b=>{
      b.onclick = ()=>{ state.color = b.getAttribute('data-color'); el('customColor').value = state.color; renderColorGrid(); };
    });
  }

  function renderContextBanner(){
    const wrap = el('studioContextBannerWrap');
    const banner = el('studioContextBanner');
    const ctx = state.drawContext;
    if(ctx.type === 'guess'){
      wrap.style.display='block';
      banner.textContent = '🤫 Secret word: "'+ctx.word+'" — others will try to guess it. Don\'t write the word!';
    } else if(ctx.type === 'challenge'){
      wrap.style.display='block';
      banner.textContent = '🎯 Today\'s Challenge: '+ctx.prompt;
    } else {
      wrap.style.display='none';
    }
  }

  function renderActions(){
    const wrap = el('studioActions');
    const ctx = state.drawContext;
    let html = '';
    if(ctx.type === 'guess'){
      html += `<button class="dv-btn violet" id="actSubmitGuess">Submit to Guess Arena</button>`;
    } else if(ctx.type === 'challenge'){
      html += `<button class="dv-btn orange" id="actSubmitChallenge" style="background:var(--orange)">Submit Challenge Entry</button>`;
    } else {
      html += `<button class="dv-btn green" id="actPublish">Publish to Gallery</button>`;
    }
    html += `<button class="dv-btn ghost" id="actSaveMine">Save to My Doodles</button>`;
    wrap.innerHTML = html;
    if(el('actSubmitGuess')) el('actSubmitGuess').onclick = submitGuess;
    if(el('actSubmitChallenge')) el('actSubmitChallenge').onclick = submitChallenge;
    if(el('actPublish')) el('actPublish').onclick = publishCasual;
    if(el('actSaveMine')) el('actSaveMine').onclick = saveMine;
  }

  async function getFlatDataURL(maxDim, quality){
    const off = document.createElement('canvas');
    off.width = draw.width; off.height = draw.height;
    const octx = off.getContext('2d');
    octx.drawImage(bg,0,0);
    octx.drawImage(draw,0,0);
    return DV.util.resizeImage(off, maxDim||320, quality||0.85);
  }

  async function saveMine(){
    if(!state.hasStrokes){ DV.toast('Draw something first!'); return; }
    DV.toast('Saving…', {icon:'⏳', duration:900});
    const dataUrl = await getFlatDataURL(300, 0.85);
    const id = DV.util.id('doodle');
    await DV.Store.setJSON('mydoodle:'+id, {id, image:dataUrl, ts:Date.now()}, false);
    DV.profile.myDoodleIds.push(id);
    await DV.saveToSlot('slot0');
    DV.toast('Saved to My Doodles', {icon:'✅'});
  }

  async function publishCasual(){
    if(!state.hasStrokes){ DV.toast('Draw something first!'); return; }
    DV.modal(`
      <h2>Publish to Gallery</h2>
      <p style="font-size:13px;color:var(--ink-dim);margin-top:-6px;">Everyone playing DoodleVerse will be able to see and like this doodle. Ready?</p>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="dv-btn ghost full" id="cancelPub">Cancel</button>
        <button class="dv-btn green full" id="confirmPub">Publish</button>
      </div>
    `);
    const root = document.getElementById('modal-root');
    root.querySelector('#cancelPub').onclick = ()=>{ root.innerHTML=''; };
    root.querySelector('#confirmPub').onclick = async ()=>{
      root.innerHTML='';
      DV.toast('Publishing…', {icon:'⏳', duration:900});
      const dataUrl = await getFlatDataURL(340, 0.85);
      const id = DV.util.id('pub');
      await DV.Store.setJSON('gallery:'+id, {
        id, author: DV.profile.nickname, image: dataUrl, ts: Date.now(), likes: 0
      }, true);
      DV.profile.coins += 5;
      DV.profile.points += 5;
      await DV.saveToSlot('slot0');
      DV.toast('Published! +5 coins', {icon:'🎉'});
      newCanvas(state.canvasSize, state.canvasType, {silent:true});
    };
  }

  async function submitGuess(){
    if(!state.hasStrokes){ DV.toast('Draw something first!'); return; }
    const ctx = state.drawContext;
    DV.toast('Submitting…', {icon:'⏳', duration:900});
    const dataUrl = await getFlatDataURL(340, 0.85);
    const id = DV.util.id('guess');
    await DV.Store.setJSON('guess:'+id, {
      id, author: DV.profile.nickname, image: dataUrl, word: ctx.word.toLowerCase(),
      ts: Date.now(), solved:false, solvedBy:null, guesses:[]
    }, true);
    DV.profile.myGuessIds.push(id);
    DV.profile.coins += 5;
    await DV.saveToSlot('slot0');
    DV.toast('Sent to the Guess Arena!', {icon:'🎉'});
    state.drawContext = {type:'free'};
    DV.nav.go('view-guess');
  }

  async function submitChallenge(){
    if(!state.hasStrokes){ DV.toast('Draw something first!'); return; }
    const ctx = state.drawContext;
    DV.toast('Submitting…', {icon:'⏳', duration:900});
    const dataUrl = await getFlatDataURL(340, 0.85);
    const id = DV.util.id('chal');
    await DV.Store.setJSON('challenge:'+ctx.date+':'+id, {
      id, author: DV.profile.nickname, image: dataUrl, ts: Date.now(), likes: 0
    }, true);
    const already = !!DV.profile.challengeHistory[ctx.date];
    DV.profile.challengeHistory[ctx.date] = true;
    if(!already){ DV.profile.coins += 10; DV.profile.points += 10; }
    await DV.saveToSlot('slot0');
    DV.toast('Challenge submitted! +10 coins', {icon:'🏆'});
    state.drawContext = {type:'free'};
    DV.nav.go('view-challenges');
  }

  function newCanvasModal(){
    const sizes = DV.CONST.canvasSizes.map(s=>`<option value="${s.id}" ${s.id===state.canvasSize.id?'selected':''}>${s.label} (${s.w}×${s.h})</option>`).join('');
    const types = DV.CONST.canvasTypes.map(t=>`<option value="${t.id}" ${t.id===state.canvasType.id?'selected':''}>${t.label}</option>`).join('');
    DV.modal(`
      <h2>New Canvas</h2>
      <div class="dv-field"><label>Canvas size</label><select id="ncSize">${sizes}</select></div>
      <div class="dv-field"><label>Canvas type</label><select id="ncType">${types}</select></div>
      <p style="font-size:12.5px;color:var(--ink-dim);margin-top:-6px;">This clears your current drawing. Save it first if you want to keep it!</p>
      <button class="dv-btn green full" id="ncGo">Start Drawing</button>
    `);
    const root = document.getElementById('modal-root');
    root.querySelector('#ncGo').onclick = ()=>{
      const sid = root.querySelector('#ncSize').value;
      const tid = root.querySelector('#ncType').value;
      const sizeObj = DV.CONST.canvasSizes.find(s=>s.id===sid);
      const typeObj = DV.CONST.canvasTypes.find(t=>t.id===tid);
      newCanvas(sizeObj, typeObj);
      root.innerHTML='';
    };
  }

  function init(){
    bg = el('bgCanvas'); bgctx = bg.getContext('2d');
    draw = el('drawCanvas'); dctx = draw.getContext('2d');

    draw.addEventListener('pointerdown', (e)=>{ draw.setPointerCapture(e.pointerId); onDown(e); });
    draw.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    draw.addEventListener('pointercancel', onUp);

    el('sizeRange').addEventListener('input', (e)=>{
      state.size = parseInt(e.target.value,10);
      const prev = el('sizePreview');
      const d = DV.util.clamp(state.size, 6, 26);
      prev.style.width = d+'px'; prev.style.height = d+'px';
    });
    el('customColor').addEventListener('input', (e)=>{ state.color = e.target.value; renderColorGrid(); });
    el('undoBtn').addEventListener('click', undo);
    el('redoBtn').addEventListener('click', redo);
    el('clearBtn').addEventListener('click', ()=>{
      DV.modal(`<h2>Clear canvas?</h2><p style="font-size:13px;color:var(--ink-dim);">This can\'t be undone.</p>
        <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="dv-btn ghost full" id="ccNo">Cancel</button>
        <button class="dv-btn red full" id="ccYes">Clear</button></div>`);
      const root = document.getElementById('modal-root');
      root.querySelector('#ccNo').onclick = ()=>{root.innerHTML='';};
      root.querySelector('#ccYes').onclick = ()=>{
        pushUndo();
        dctx.clearRect(0,0,draw.width,draw.height);
        state.hasStrokes = false;
        root.innerHTML='';
      };
    });
    el('studioNewBtn').addEventListener('click', newCanvasModal);
    el('studioBackBtn').addEventListener('click', ()=>{
      if(state.hasStrokes){
        DV.modal(`<h2>Leave Studio?</h2><p style="font-size:13px;color:var(--ink-dim);">Your drawing isn\'t saved yet. Leaving now will lose it.</p>
          <div style="display:flex;gap:10px;margin-top:14px;">
          <button class="dv-btn ghost full" id="lvNo">Keep Drawing</button>
          <button class="dv-btn red full" id="lvYes">Leave</button></div>`);
        const root = document.getElementById('modal-root');
        root.querySelector('#lvNo').onclick = ()=>{ root.innerHTML=''; };
        root.querySelector('#lvYes').onclick = ()=>{ root.innerHTML=''; DV.nav.go('view-hub'); };
      } else {
        DV.nav.go('view-hub');
      }
    });

    renderToolGrid();
    renderColorGrid();
    const sp = el('sizePreview'); sp.style.width='14px'; sp.style.height='14px';
  }

  function open(context){
    const newCtx = context || {type:'free'};
    const old = state.drawContext;
    const contextChanged = old.type !== newCtx.type
      || (newCtx.type==='guess' && old.word !== newCtx.word)
      || (newCtx.type==='challenge' && old.date !== newCtx.date);
    state.drawContext = newCtx;
    if(contextChanged || state.canvasSize.w !== draw.width || state.canvasSize.h !== draw.height || !state.hasStrokes){
      newCanvas(state.canvasSize, state.canvasType, {silent:true});
    }
    renderContextBanner();
    renderActions();
    DV.nav.go('view-studio');
  }

  return { init, open, newCanvas, TOOLS };
})();

/* ---------------- shared helpers ---------------- */
DV.shared = {
  async fetchAll(prefix, cap){
    const keys = await DV.Store.list(prefix, true);
    const use = keys.slice(0, cap || 80);
    const results = await Promise.all(use.map(k => DV.Store.getJSON(k, true)));
    return results.filter(Boolean);
  }
};

/* ================= CASUAL GALLERY ================= */
DV.Gallery = (function(){
  function el(id){ return document.getElementById(id); }

  async function render(){
    const wrap = el('galleryContent');
    wrap.innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading gallery…</div>';
    el('galleryNewBtn').onclick = ()=> DV.Studio.open({type:'free'});

    let items = await DV.shared.fetchAll('gallery:', 60);
    items.sort((a,b)=>b.ts-a.ts);

    if(!items.length){
      wrap.innerHTML = `<div class="empty-state">
        <div class="es-icon">🖼️</div>
        <h3>The gallery is empty</h3>
        <p>Be the first to publish a doodle for everyone to see.</p>
        <button class="dv-btn green" id="galEmptyPub">Start Drawing</button>
      </div>`;
      el('galEmptyPub').onclick = ()=> DV.Studio.open({type:'free'});
      return;
    }

    const liked = new Set(DV.profile.likedIds || []);
    wrap.innerHTML = `<div class="card-grid">${items.map(it => `
      <div class="pic-card">
        <img src="${it.image}" alt="doodle by ${DV.util.escapeHtml(it.author)}">
        <div class="pic-meta"><div class="pic-author">✏️ ${DV.util.escapeHtml(it.author)} · ${DV.util.timeAgo(it.ts)}</div></div>
        <div class="pic-actions">
          <button class="like-btn${liked.has(it.id)?' liked':''}" data-id="${it.id}">❤ <span>${it.likes||0}</span></button>
        </div>
      </div>
    `).join('')}</div>`;

    wrap.querySelectorAll('.like-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-id');
        const already = (DV.profile.likedIds||[]).includes(id);
        const entry = await DV.Store.getJSON('gallery:'+id, true);
        if(!entry) return;
        entry.likes = Math.max(0, (entry.likes||0) + (already ? -1 : 1));
        await DV.Store.setJSON('gallery:'+id, entry, true);
        DV.profile.likedIds = DV.profile.likedIds || [];
        if(already){
          DV.profile.likedIds = DV.profile.likedIds.filter(x=>x!==id);
          btn.classList.remove('liked');
        } else {
          DV.profile.likedIds.push(id);
          btn.classList.add('liked');
        }
        btn.querySelector('span').textContent = entry.likes;
        DV.saveToSlot('slot0');
      };
    });
  }

  return { render };
})();

/* ================= GUESS ARENA ================= */
DV.Guess = (function(){
  function el(id){ return document.getElementById(id); }
  let activeTab = 'browse';

  function renderTabs(){
    const tabs = [
      {id:'browse', label:'Guess'},
      {id:'mine', label:'My Submissions'},
      {id:'leaderboard', label:'Leaderboard'}
    ];
    el('guessTabs').innerHTML = tabs.map(t =>
      `<button class="tab-btn${t.id===activeTab?' active':''}" data-tab="${t.id}">${t.label}</button>`
    ).join('');
    el('guessTabs').querySelectorAll('.tab-btn').forEach(b=>{
      b.onclick = ()=>{ activeTab = b.getAttribute('data-tab'); render(); };
    });
    el('guessPointsChip').textContent = (DV.profile.points||0)+' pts';
  }

  function pickWordsModal(){
    const pool = DV.CONST.guessWords.slice();
    const picks = [];
    while(picks.length<3 && pool.length){
      const idx = Math.floor(Math.random()*pool.length);
      picks.push(pool.splice(idx,1)[0]);
    }
    DV.modal(`
      <h2>Pick a word to draw</h2>
      <p style="font-size:13px;color:var(--ink-dim);margin-top:-6px;">Others will see only your drawing and try to guess this word.</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
        ${picks.map(w=>`<button class="dv-btn violet full pickWordBtn" data-w="${w}">${w}</button>`).join('')}
      </div>
    `);
    const root = document.getElementById('modal-root');
    root.querySelectorAll('.pickWordBtn').forEach(b=>{
      b.onclick = ()=>{
        const w = b.getAttribute('data-w');
        root.innerHTML='';
        DV.Studio.open({type:'guess', word:w});
      };
    });
  }

  async function renderBrowse(){
    const wrap = el('guessContent');
    wrap.innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading drawings…</div>';
    let items = await DV.shared.fetchAll('guess:', 80);
    items = items.filter(it => !it.solved && it.author !== DV.profile.nickname);
    items.sort((a,b)=>b.ts-a.ts);

    let html = `<div style="padding:14px 16px 0;"><button class="dv-btn violet full" id="guessDrawBtn">✏️ Draw one to guess</button></div>`;
    if(!items.length){
      html += `<div class="empty-state"><div class="es-icon">🕵️</div><h3>No drawings to guess right now</h3><p>Draw one yourself — someone else will come guess it!</p></div>`;
    } else {
      html += `<div class="card-grid" style="padding:16px;">${items.map(it => `
        <div class="pic-card">
          <img src="${it.image}" alt="mystery doodle">
          <div class="pic-meta"><div class="pic-author">✏️ ${DV.util.escapeHtml(it.author)} · ${DV.util.timeAgo(it.ts)}</div></div>
          <div class="pic-actions" style="justify-content:center;">
            <button class="dv-btn small green full guessBtn" data-id="${it.id}">Guess</button>
          </div>
        </div>
      `).join('')}</div>`;
    }
    wrap.innerHTML = html;
    el('guessDrawBtn').onclick = pickWordsModal;
    wrap.querySelectorAll('.guessBtn').forEach(b=>{
      b.onclick = ()=> openGuessModal(b.getAttribute('data-id'));
    });
  }

  function openGuessModal(id){
    DV.modal(`<div id="guessModalBody"><div class="loading-row"><span class="spinner"></span> Loading…</div></div>`);
    const root = document.getElementById('modal-root');
    (async ()=>{
      const entry = await DV.Store.getJSON('guess:'+id, true);
      const body = root.querySelector('#guessModalBody');
      if(!entry || entry.solved){
        body.innerHTML = `<h2>Already solved!</h2><p style="color:var(--ink-dim);font-size:13px;">Someone beat you to this one.</p>`;
        return;
      }
      body.innerHTML = `
        <h2>What is this?</h2>
        <img src="${entry.image}" style="width:100%;border-radius:12px;margin-bottom:14px;border:2px solid var(--line);">
        <div class="dv-field"><label>Your guess</label><input type="text" id="guessInput" placeholder="Type your answer…" autocomplete="off"></div>
        <div id="guessFeedback" style="font-size:13px;font-weight:700;min-height:18px;margin-bottom:8px;"></div>
        <div style="display:flex;gap:10px;">
          <button class="dv-btn ghost full" id="guessSkip">Skip</button>
          <button class="dv-btn green full" id="guessSubmit">Submit</button>
        </div>
      `;
      const input = body.querySelector('#guessInput');
      input.focus();
      const feedback = body.querySelector('#guessFeedback');
      body.querySelector('#guessSkip').onclick = ()=>{ root.innerHTML=''; };
      async function tryGuess(){
        const val = DV.util.normalizeGuess(input.value);
        if(!val) return;
        const target = DV.util.normalizeGuess(entry.word);
        if(val === target){
          const fresh = await DV.Store.getJSON('guess:'+id, true) || entry;
          if(fresh.solved){
            feedback.style.color = 'var(--yellow)';
            feedback.textContent = 'Someone just solved this first!';
            return;
          }
          fresh.solved = true;
          fresh.solvedBy = DV.profile.nickname;
          fresh.guesses = fresh.guesses || [];
          fresh.guesses.push({guesser:DV.profile.nickname, correct:true, ts:Date.now()});
          await DV.Store.setJSON('guess:'+id, fresh, true);
          await DV.Guess.awardPoints(DV.profile.nickname, 10);
          if(fresh.author !== DV.profile.nickname) await DV.Guess.awardPoints(fresh.author, 15);
          DV.profile.points += 10;
          await DV.saveToSlot('slot0');
          feedback.style.color = 'var(--green)';
          feedback.textContent = 'Correct! It was "'+entry.word+'". +10 pts';
          setTimeout(()=>{ root.innerHTML=''; render(); }, 1200);
        } else {
          feedback.style.color = 'var(--red)';
          feedback.textContent = 'Not quite — try again!';
        }
      }
      body.querySelector('#guessSubmit').onclick = tryGuess;
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryGuess(); });
    })();
  }

  async function renderMine(){
    const wrap = el('guessContent');
    wrap.innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading your submissions…</div>';
    let items = await DV.shared.fetchAll('guess:', 120);
    items = items.filter(it => it.author === DV.profile.nickname);
    items.sort((a,b)=>b.ts-a.ts);
    if(!items.length){
      wrap.innerHTML = `<div class="empty-state"><div class="es-icon">🎨</div><h3>No submissions yet</h3><p>Draw a secret word and see who can guess it.</p>
        <button class="dv-btn violet" id="mineDrawBtn">Draw one to guess</button></div>`;
      el('mineDrawBtn').onclick = pickWordsModal;
      return;
    }
    wrap.innerHTML = `<div class="card-grid" style="padding:16px;">${items.map(it => `
      <div class="pic-card">
        <img src="${it.image}" alt="your doodle">
        <div class="pic-meta">
          <div class="pic-author">${it.solved ? '✅ Solved by '+DV.util.escapeHtml(it.solvedBy) : '⏳ Unsolved'}</div>
          <div class="pic-author" style="opacity:.7;">Word: ${it.solved ? DV.util.escapeHtml(it.word) : '???'}</div>
        </div>
      </div>
    `).join('')}</div>`;
  }

  async function renderLeaderboard(){
    const wrap = el('guessContent');
    wrap.innerHTML = '<div class="loading-row"><span class="spinner"></span> Loading leaderboard…</div>';
    const board = await DV.Store.getJSON('guessLeaderboard', true) || {};
    const rows = Object.keys(board).map(n=>({name:n, pts:board[n]})).sort((a,b)=>b.pts-a.pts).slice(0,30);
    if(!rows.length){
      wrap.innerHTML = `<div class="empty-state"><div class="es-icon">🏆</div><h3>No scores yet</h3><p>Guess a drawing to be first on the board.</p></div>`;
      return;
    }
    wrap.innerHTML = `<div class="leader-list">${rows.map((r,i)=> `
      <div class="leader-row" style="${r.name===DV.profile.nickname?'background:rgba(255,201,60,0.08);border-radius:10px;':''}">
        <div class="leader-rank">#${i+1}</div>
        <div class="leader-name">${DV.util.escapeHtml(r.name)}</div>
        <div class="leader-pts">${r.pts} pts</div>
      </div>
    `).join('')}</div>`;
  }

  async function awardPoints(nickname, amt){
    const board = await DV.Store.getJSON('guessLeaderboard', true) || {};
    board[nickname] = (board[nickname]||0) + amt;
    await DV.Store.setJSON('guessLeaderboard', board, true);
  }

  function render(){
    renderTabs();
    if(activeTab==='browse') renderBrowse();
    else if(activeTab==='mine') renderMine();
    else renderLeaderboard();
  }

  return { render, awardPoints };
})();
/* =========================================================
   DoodleVerse — challenges.js
   Everyone gets the same daily prompt (seeded off today's date,
   so it's shared without needing to write anything). Submissions
   go into a shared gallery for that date.
   ========================================================= */
DV.Challenges = (function(){
  function el(id){ return document.getElementById(id); }

  function computeStreak(){
    const hist = DV.profile.challengeHistory || {};
    let streak = 0;
    let d = new Date();
    // if today not done yet, streak counts consecutive days up to yesterday
    if(!hist[DV.util.todayKey()]) d.setDate(d.getDate()-1);
    while(true){
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(hist[key]){ streak++; d.setDate(d.getDate()-1); } else break;
    }
    return streak;
  }

  async function render(){
    const today = DV.util.todayKey();
    const week = DV.util.weekKey();
    const prompt = DV.util.pickSeeded(DV.CONST.challengePrompts, today);
    const theme = DV.util.pickSeeded(DV.CONST.weeklyThemes, week);
    const doneToday = !!DV.profile.challengeHistory[today];
    const streak = computeStreak();
    el('challengeStreakChip').textContent = '🔥 '+streak;

    const wrap = el('challengeContent');
    wrap.innerHTML = `
      <div class="hero-banner" style="background:var(--orange);">
        <div class="hb-label">Today's Challenge · everyone gets the same one</div>
        <h2>${DV.util.escapeHtml(prompt)}</h2>
        <p>${doneToday ? 'You already submitted today — nice work! Come back tomorrow for a new prompt.' : 'Draw it, submit it, and see what everyone else came up with.'}</p>
        <button class="dv-btn full" id="chalStartBtn" style="background:#14171C;color:#fff;">
          ${doneToday ? 'Draw Another Take' : 'Start Drawing'}
        </button>
      </div>
      <div style="margin:0 16px 16px;padding:12px 14px;border:2px dashed var(--line);border-radius:14px;font-size:12.5px;color:var(--ink-dim);">
        🗓️ <strong style="color:var(--ink);">This week's theme:</strong> ${DV.util.escapeHtml(theme)} — for inspiration, no wrong answers.
      </div>
      <div id="chalGalleryHost"><div class="loading-row"><span class="spinner"></span> Loading submissions…</div></div>
    `;
    el('chalStartBtn').onclick = ()=> DV.Studio.open({type:'challenge', prompt, date: today});

    let items = await DV.shared.fetchAll('challenge:'+today+':', 60);
    items.sort((a,b)=>b.ts-a.ts);
    const host = el('chalGalleryHost');
    if(!items.length){
      host.innerHTML = `<div class="empty-state"><div class="es-icon">🎯</div><h3>No entries yet today</h3><p>Yours could be the first!</p></div>`;
      return;
    }
    const liked = new Set(DV.profile.likedIds || []);
    host.innerHTML = `<div class="card-grid" style="padding:0 16px 16px;">${items.map(it => `
      <div class="pic-card">
        <img src="${it.image}" alt="challenge entry by ${DV.util.escapeHtml(it.author)}">
        <div class="pic-meta"><div class="pic-author">✏️ ${DV.util.escapeHtml(it.author)} · ${DV.util.timeAgo(it.ts)}</div></div>
        <div class="pic-actions">
          <button class="like-btn${liked.has(it.id)?' liked':''}" data-id="${it.id}" data-key="challenge:${today}:${it.id}">❤ <span>${it.likes||0}</span></button>
        </div>
      </div>
    `).join('')}</div>`;
    host.querySelectorAll('.like-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-id');
        const key = btn.getAttribute('data-key');
        const already = (DV.profile.likedIds||[]).includes(id);
        const entry = await DV.Store.getJSON(key, true);
        if(!entry) return;
        entry.likes = Math.max(0, (entry.likes||0) + (already ? -1 : 1));
        await DV.Store.setJSON(key, entry, true);
        DV.profile.likedIds = DV.profile.likedIds || [];
        if(already){ DV.profile.likedIds = DV.profile.likedIds.filter(x=>x!==id); btn.classList.remove('liked'); }
        else { DV.profile.likedIds.push(id); btn.classList.add('liked'); }
        btn.querySelector('span').textContent = entry.likes;
        DV.saveToSlot('slot0');
      };
    });
  }

  return { render, computeStreak };
})();
/* =========================================================
   DoodleVerse — obby.js
   A little Roblox-style obstacle course. Preset levels, simple
   platformer physics, checkpoints, hazards, moving/bounce/
   disappearing platforms. Best times are shared online.
   ========================================================= */
DV.Obby = (function(){

  const G = 1700, JUMP_V = -660, MOVE_SPEED = 280, MAX_FALL = 1000, BOUNCE_V = -980;
  const PW = 30, PH = 38, GROUND_Y = 470, TH = 24;

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------------- Level data ---------------- */
  const LEVELS = [
    {

    },
    {

      width:2900,
      platforms:[
        {x:0,y:470,w:220,h:TH,type:'solid'},
        {x:330,y:470,w:180,h:TH,type:'solid'},
        {x:360,y:446,w:50,h:TH,type:'hazard'},
        {x:1130,y:470,w:200,h:TH,type:'solid'},
        {x:1150,y:446,w:36,h:20,type:'checkpoint'},
        {x:1780,y:430,w:200,h:TH,type:'solid'},
        {x:2320,y:430,w:220,h:TH,type:'solid'},
        {x:2560,y:430,w:260,h:TH,type:'solid'}
      ],
      disappear:[
        {x:630,y:470,w:140,h:TH},
        {x:880,y:440,w:140,h:TH},
        {x:2090,y:400,w:130,h:TH}
      ],
      moving:[
        {x:1450,y:430,w:110,h:TH,axis:'x',from:1450,to:1650,period:2.4}
      ],
      goal:{x:2720,y:356,w:50,h:44},
      start:{x:40,y:GROUND_Y-PH}
    },
    {
      id:'lv4', name:'Marker Mayhem', color:'var(--violet)', accent:'#9B6BFF',
      width:3660,
      platforms:[
        {x:0,y:470,w:220,h:TH,type:'solid'},
        {x:330,y:470,w:180,h:TH,type:'solid'},
        {x:360,y:446,w:50,h:TH,type:'hazard'},
        {x:630,y:430,w:180,h:TH,type:'solid'},
        {x:1160,y:430,w:200,h:TH,type:'solid'},
        {x:1180,y:406,w:36,h:20,type:'checkpoint'},
        {x:1490,y:430,w:90,h:TH,type:'bounce'},
        {x:1860,y:380,w:220,h:TH,type:'solid'},
        {x:2510,y:380,w:200,h:TH,type:'solid'},
        {x:2530,y:356,w:36,h:20,type:'checkpoint'},
        {x:3060,y:420,w:200,h:TH,type:'solid'},
        {x:3300,y:420,w:260,h:TH,type:'solid'}
      ],
      disappear:[
        {x:920,y:430,w:130,h:TH},
        {x:2820,y:380,w:130,h:TH}
      ],
      moving:[
        {x:2190,y:380,w:110,h:TH,axis:'x',from:2190,to:2380,period:2.2}
      ],
      goal:{x:3500,y:346,w:50,h:44},
      start:{x:40,y:GROUND_Y-PH}
    }
  ];

  let canvas, ctx;
  let cur = null;           // active level runtime state
  let raf = null, lastT = 0;
  let input = {left:false, right:false, jump:false};
  let stageActive = false;
  let decorationImg = null;

  function el(id){ return document.getElementById(id); }
  function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

  /* ---------------- Level select ---------------- */
  async function renderLevelSelect(){
    stageActive = false;
    el('obbyLevelSelectWrap').style.display = 'block';
    el('obbyStageWrap').style.display = 'none';
    el('obbyTitle').textContent = 'Doodle Obby';
    el('obbyCoinsChip').textContent = (DV.profile.coins||0)+' ★';
    el('obbyBackBtn').setAttribute('data-nav','view-hub');
    el('obbyBackBtn').onclick = null;

    const grid = el('levelSelectGrid');
    grid.innerHTML = LEVELS.map((lv,i)=>{
      const unlocked = (DV.profile.obbyUnlocked||[]).includes(lv.id);
      const best = DV.profile.obbyBestTimes[lv.id];
      return `<div class="level-card${unlocked?'':' locked'}" style="background:${lv.color}" data-id="${lv.id}">
        <h3>${i+1}. ${lv.name}</h3>
        <div class="lv-meta">${unlocked ? (best ? 'Your best: '+DV.util.fmtTime(best) : 'Not completed yet') : '🔒 Beat the previous level first'}</div>
        <div class="lv-meta" data-global="${lv.id}">🌐 World best: …</div>
      </div>`;
    }).join('');

    grid.querySelectorAll('.level-card').forEach(card=>{
      card.onclick = ()=>{
        const id = card.getAttribute('data-id');
        const lv = LEVELS.find(l=>l.id===id);
        if(!(DV.profile.obbyUnlocked||[]).includes(id)){
          DV.toast('Locked — finish the previous level first', {icon:'🔒'});
          return;
        }
        startLevel(lv);
      };
    });

    LEVELS.forEach(async (lv)=>{
      const board = await DV.Store.getJSON('obbyLeaderboard:'+lv.id, true) || {};
      const vals = Object.values(board);
      const spanEl = grid.querySelector('[data-global="'+lv.id+'"]');
      if(spanEl) spanEl.textContent = vals.length ? '🌐 World best: '+DV.util.fmtTime(Math.min(...vals)) : '🌐 World best: none yet';
    });
  }

  /* ---------------- Level runtime ---------------- */
  async function startLevel(lv){
    stageActive = true;
    el('obbyLevelSelectWrap').style.display = 'none';
    el('obbyStageWrap').style.display = 'flex';
    el('obbyTitle').textContent = lv.name;
    el('obbyBackBtn').removeAttribute('data-nav');
    el('obbyBackBtn').onclick = ()=>{ stopLoop(); renderLevelSelect(); };

    canvas = el('obbyCanvas'); ctx = canvas.getContext('2d');
    const rng = mulberry32(DV.util.hashStr(lv.id));
    const bumps = [];
    for(let i=0;i<Math.ceil(lv.width/220)+2;i++){
      bumps.push({x:i*220 + rng()*60, r: 40+rng()*50});
    }

    const disappear = (lv.disappear||[]).map(p=>({...p, type:'disappear', solidNow:true, armTimer:null, respawnTimer:null}));
    const moving = (lv.moving||[]).map(p=>({...p, type:'moving', curX:p.x, curY:p.y, prevX:p.x, prevY:p.y}));

    cur = {
      lv,
      solids: lv.platforms.filter(p=>p.type==='solid').concat(disappear).concat(moving),
      hazards: lv.platforms.filter(p=>p.type==='hazard'),
      checkpoints: lv.platforms.filter(p=>p.type==='checkpoint').map(p=>({...p, active:false})),
      bumps,
      player: {x:lv.start.x, y:lv.start.y, w:PW, h:PH, vx:0, vy:0, onGround:false, standingOn:null, facing:1},
      checkpoint: {x:lv.start.x, y:lv.start.y},
      camX:0,
      startedAt: performance.now(),
      elapsedMs: 0,
      finished:false,
      flashTimer:0
    };

    // load a decoration image (player's latest doodle) for the goal banner, non-blocking
    decorationImg = null;
    if(DV.profile.myDoodleIds && DV.profile.myDoodleIds.length){
      const lastId = DV.profile.myDoodleIds[DV.profile.myDoodleIds.length-1];
      DV.Store.getJSON('mydoodle:'+lastId, false).then(d=>{
        if(d && d.image){
          const img = new Image();
          img.onload = ()=>{ decorationImg = img; };
          img.src = d.image;
        }
      });
    }

    setupInput();
    lastT = performance.now();
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function setupInput(){
    window.onkeydown = (e)=>{
      if(!stageActive) return;
      if(['ArrowLeft','a','A'].includes(e.key)) input.left = true;
      if(['ArrowRight','d','D'].includes(e.key)) input.right = true;
      if(['ArrowUp','w','W',' '].includes(e.key)){ input.jump = true; e.preventDefault(); }
    };
    window.onkeyup = (e)=>{
      if(['ArrowLeft','a','A'].includes(e.key)) input.left = false;
      if(['ArrowRight','d','D'].includes(e.key)) input.right = false;
      if(['ArrowUp','w','W',' '].includes(e.key)) input.jump = false;
    };
    const bindHold = (id, key)=>{
      const btn = el(id);
      const on = (e)=>{ e.preventDefault(); input[key]=true; };
      const off = (e)=>{ input[key]=false; };
      btn.onpointerdown = on; btn.onpointerup = off; btn.onpointerleave = off; btn.onpointercancel = off;
    };
    bindHold('tcLeft','left'); bindHold('tcRight','right'); bindHold('tcJump','jump');
  }

  function respawn(){
    cur.player.x = cur.checkpoint.x;
    cur.player.y = cur.checkpoint.y;
    cur.player.vx = 0; cur.player.vy = 0;
    cur.flashTimer = 300;
  }

  function updatePlatforms(dtMs, elapsedS){
    (cur.lv.moving||[]);
    cur.solids.forEach(p=>{
      if(p.type==='moving'){
        p.prevX = p.curX; p.prevY = p.curY;
        const t = (Math.sin(elapsedS*(2*Math.PI/p.period) - Math.PI/2)+1)/2;
        if(p.axis==='x'){ p.curX = p.from + (p.to-p.from)*t; p.curY = p.y; }
        else { p.curY = p.from + (p.to-p.from)*t; p.curX = p.x; }
        p.x = p.curX; p.y = p.curY;
      } else if(p.type==='disappear'){
        const standing = cur.player.standingOn === p;
        if(standing && p.solidNow){
          if(p.armTimer==null) p.armTimer = 650;
          p.armTimer -= dtMs;
          if(p.armTimer<=0){ p.solidNow = false; p.armTimer = null; p.respawnTimer = 1500; }
        } else if(!standing && p.solidNow){
          p.armTimer = null;
        }
        if(!p.solidNow){
          p.respawnTimer -= dtMs;
          if(p.respawnTimer<=0){ p.solidNow = true; p.respawnTimer = null; }
        }
      }
    });
  }

  function step(dt, dtMs, elapsedS){
    const pl = cur.player;
    const targetVx = (input.right?1:0 - (input.left?1:0)) * MOVE_SPEED;
    pl.vx += (targetVx - pl.vx) * Math.min(1, dt*12);
    if(Math.abs(pl.vx) > 4) pl.facing = pl.vx>0?1:-1;

    if(input.jump && pl.onGround){
      pl.vy = JUMP_V;
      pl.onGround = false;
    }

    pl.vy += G*dt;
    if(pl.vy > MAX_FALL) pl.vy = MAX_FALL;

    updatePlatforms(dtMs, elapsedS);

    const solidNow = cur.solids.filter(p => p.type!=='disappear' || p.solidNow);

    // horizontal
    pl.x += pl.vx*dt;
    for(const p of solidNow){
      if(aabb(pl,p)){
        if(pl.vx>0) pl.x = p.x - pl.w;
        else if(pl.vx<0) pl.x = p.x + p.w;
        pl.vx = 0;
      }
    }
    pl.x = DV.util.clamp(pl.x, 0, cur.lv.width - pl.w);

    // vertical
    pl.y += pl.vy*dt;
    pl.onGround = false;
    pl.standingOn = null;
    for(const p of solidNow){
      if(aabb(pl,p)){
        if(pl.vy>0){
          pl.y = p.y - pl.h;
          if(p.type==='bounce'){ pl.vy = BOUNCE_V; }
          else { pl.vy = 0; pl.onGround = true; pl.standingOn = p; }
        } else if(pl.vy<0){
          pl.y = p.y + p.h;
          pl.vy = 0;
        }
      }
    }

    // carry on moving platforms
    if(pl.standingOn && pl.standingOn.type==='moving'){
      pl.x += (pl.standingOn.curX - pl.standingOn.prevX);
      pl.y += (pl.standingOn.curY - pl.standingOn.prevY);
    }

    // hazards
    for(const h of cur.hazards){ if(aabb(pl,h)){ respawn(); return; } }
    // fell off
    if(pl.y > 560){ respawn(); return; }
    // checkpoints
    for(const c of cur.checkpoints){
      if(!c.active && aabb(pl, {x:c.x-10,y:c.y-30,w:c.w+20,h:c.h+40})){
        c.active = true;
        cur.checkpoint = {x:c.x, y:c.y - pl.h};
        DV.toast('Checkpoint!', {icon:'🚩', duration:1000});
      }
    }
    // goal
    const g = cur.lv.goal;
    if(!cur.finished && aabb(pl, {x:g.x-16,y:g.y-16,w:g.w+32,h:g.h+32})){
      finishLevel();
    }

    // camera
    const viewW = canvas.width;
    let camX = pl.x + pl.w/2 - viewW/2;
    camX = DV.util.clamp(camX, 0, Math.max(0, cur.lv.width - viewW));
    cur.camX = camX;
  }

  async function finishLevel(){
    cur.finished = true;
    const elapsed = performance.now() - cur.startedAt;
    const lv = cur.lv;
    const prevBest = DV.profile.obbyBestTimes[lv.id];
    const isNewBest = !prevBest || elapsed < prevBest;
    if(isNewBest) DV.profile.obbyBestTimes[lv.id] = Math.round(elapsed);

    const idx = LEVELS.findIndex(l=>l.id===lv.id);
    const next = LEVELS[idx+1];
    if(next && !(DV.profile.obbyUnlocked||[]).includes(next.id)){
      DV.profile.obbyUnlocked.push(next.id);
    }
    DV.profile.coins += 15;
    DV.profile.points += 15;
    await DV.saveToSlot('slot0');

    if(isNewBest){
      const board = await DV.Store.getJSON('obbyLeaderboard:'+lv.id, true) || {};
      if(!board[DV.profile.nickname] || elapsed < board[DV.profile.nickname]){
        board[DV.profile.nickname] = Math.round(elapsed);
        await DV.Store.setJSON('obbyLeaderboard:'+lv.id, board, true);
      }
    }

    stopLoop();
    DV.modal(`
      <h2>🏁 Level Complete!</h2>
      <p style="font-size:15px;font-weight:800;color:var(--ink);">${DV.util.fmtTime(elapsed)} ${isNewBest?'— New personal best! 🎉':''}</p>
      <p style="font-size:13px;color:var(--ink-dim);">+15 coins, +15 points</p>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="dv-btn ghost full" id="lvlBackSelect">Level Select</button>
        ${next ? '<button class="dv-btn green full" id="lvlNext">Next Level</button>' : ''}
      </div>
    `, {persistent:true});
    const root = document.getElementById('modal-root');
    root.querySelector('#lvlBackSelect').onclick = ()=>{ root.innerHTML=''; renderLevelSelect(); };
    if(next) root.querySelector('#lvlNext').onclick = ()=>{ root.innerHTML=''; startLevel(next); };
  }

  /* ---------------- Rendering ---------------- */
  function drawPlatform(p){
    ctx.save();
    ctx.translate(-cur.camX, 0);
    if(p.type==='hazard'){
      ctx.fillStyle = '#E8484B';
      const n = Math.max(1, Math.round(p.w/16));
      for(let i=0;i<n;i++){
        const sx = p.x + i*(p.w/n);
        ctx.beginPath();
        ctx.moveTo(sx, p.y+p.h);
        ctx.lineTo(sx+(p.w/n)/2, p.y);
        ctx.lineTo(sx+(p.w/n), p.y+p.h);
        ctx.closePath();
        ctx.fill();
      }
    } else if(p.type==='checkpoint'){
      ctx.strokeStyle = '#5B6470'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(p.x+2, p.y+20); ctx.lineTo(p.x+2, p.y-46); ctx.stroke();
      ctx.fillStyle = p.active ? '#4CC9A5' : '#9BA3AE';
      ctx.beginPath();
      ctx.moveTo(p.x+2, p.y-46); ctx.lineTo(p.x+30, p.y-38); ctx.lineTo(p.x+2, p.y-30);
      ctx.closePath(); ctx.fill();
    } else if(p.type==='bounce'){
      ctx.fillStyle = '#14171C';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#FFC93C';
      ctx.fillRect(p.x+4, p.y+4, p.w-8, p.h-10);
      ctx.strokeStyle = '#14171C'; ctx.lineWidth=2;
      for(let sx=p.x+10; sx<p.x+p.w-6; sx+=10){
        ctx.beginPath(); ctx.moveTo(sx,p.y+p.h-8); ctx.lineTo(sx+5,p.y+6); ctx.stroke();
      }
    } else if(p.type==='disappear'){
      ctx.globalAlpha = p.solidNow ? (p.armTimer!=null ? 0.55 : 1) : 0.12;
      ctx.fillStyle = '#9B6BFF';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#14171C'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.setLineDash([]);
    } else if(p.type==='moving'){
      ctx.fillStyle = '#3FA7D6';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#14171C'; ctx.lineWidth=2; ctx.strokeRect(p.x,p.y,p.w,p.h);
    } else {
      ctx.fillStyle = cur.lv.accent;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = 'rgba(20,23,28,0.18)';
      ctx.fillRect(p.x, p.y, p.w, 5);
      ctx.strokeStyle = '#14171C'; ctx.lineWidth=2; ctx.strokeRect(p.x,p.y,p.w,p.h);
    }
    ctx.restore();
  }

  function drawPlayer(){
    const pl = cur.player;
    const cx = pl.x + pl.w/2 - cur.camX, cy = pl.y + pl.h/2;
    let sx=1, sy=1;
    if(!pl.onGround){
      if(pl.vy<0){ sx=0.85; sy=1.18; } else { sx=1.12; sy=0.9; }
    } else if(cur.flashTimer>0){ sx=1.15; sy=0.82; }
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(sx*pl.facing, sy);
    ctx.beginPath();
    ctx.moveTo(0,-pl.h/2);
    ctx.quadraticCurveTo(pl.w/2, -pl.h/2, pl.w/2, 2);
    ctx.quadraticCurveTo(pl.w/2, pl.h/2, 0, pl.h/2);
    ctx.quadraticCurveTo(-pl.w/2, pl.h/2, -pl.w/2, 2);
    ctx.quadraticCurveTo(-pl.w/2, -pl.h/2, 0, -pl.h/2);
    ctx.closePath();
    ctx.fillStyle = DV.profile.avatarColor;
    ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle='#14171C'; ctx.stroke();
    ctx.fillStyle = '#14171C';
    ctx.beginPath(); ctx.arc(5,-4,2.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(13,-4,2.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function render(){
    const lv = cur.lv;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // parallax hills
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    cur.bumps.forEach(b=>{
      const bx = b.x - cur.camX*0.4;
      if(bx > -100 && bx < canvas.width+100){
        ctx.beginPath(); ctx.arc(bx, 470, b.r, Math.PI, 0); ctx.fill();
      }
    });
    // ground shadow line
    ctx.save();
    ctx.translate(-cur.camX,0);
    ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,540); ctx.lineTo(lv.width,540); ctx.stroke();
    ctx.restore();

    cur.solids.forEach(drawPlatform);
    cur.hazards.forEach(drawPlatform);
    cur.checkpoints.forEach(drawPlatform);

    // goal banner
    ctx.save();
    ctx.translate(-cur.camX,0);
    const g = lv.goal;
    ctx.strokeStyle='#14171C'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(g.x+g.w/2, g.y+g.h); ctx.lineTo(g.x+g.w/2, g.y-70); ctx.stroke();
    if(decorationImg){
      ctx.save();
      ctx.beginPath(); ctx.rect(g.x-34, g.y-66, 68, 50); ctx.clip();
      ctx.fillStyle='#fff'; ctx.fillRect(g.x-34, g.y-66, 68, 50);
      ctx.drawImage(decorationImg, g.x-34, g.y-66, 68, 50);
      ctx.restore();
      ctx.strokeStyle='#14171C'; ctx.lineWidth=2; ctx.strokeRect(g.x-34, g.y-66, 68, 50);
    } else {
      ctx.fillStyle = lv.accent;
      ctx.beginPath();
      ctx.moveTo(g.x+g.w/2, g.y-66); ctx.lineTo(g.x+g.w/2+46, g.y-50); ctx.lineTo(g.x+g.w/2, g.y-34);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    drawPlayer();
    if(cur.flashTimer>0) cur.flashTimer -= 16;
  }

  function loop(t){
    if(!stageActive){ return; }
    const dtMs = Math.min(40, t - lastT);
    lastT = t;
    const dt = dtMs/1000;
    const elapsedS = (t - cur.startedAt)/1000;
    if(!cur.finished){
      step(dt, dtMs, elapsedS);
      cur.elapsedMs = t - cur.startedAt;
    }
    render();
    el('obbyHud').innerHTML = `<div class="dv-chip">⏱ ${DV.util.fmtTime(cur.elapsedMs)}</div>`;
    raf = requestAnimationFrame(loop);
  }

  function stopLoop(){
    stageActive = false;
    if(raf) cancelAnimationFrame(raf);
    raf = null;
    window.onkeydown = null; window.onkeyup = null;
  }

  return { renderLevelSelect, startLevel, stopLoop, LEVELS };
})();
/* =========================================================
   DoodleVerse — hub.js
   Title screen (new/continue/load), the save/load slot system UI,
   and the Hub home screen with the five mode cards.
