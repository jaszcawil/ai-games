/* ---------------- Nickname modal ---------------- */
DV.nicknameModal = function(existing, onDone){
  DV.modal(`
    <h2>${existing ? 'Rename' : "What's your name?"}</h2>
    <p style="font-size:13px;color:var(--ink-dim);margin-top:-6px;">This is shown next to everything you publish or submit.</p>
    <div class="dv-field"><label>Nickname</label><input type="text" id="nickInput" maxlength="18" placeholder="e.g. Scribbles" value="${existing?DV.util.escapeHtml(existing):''}"></div>
    <button class="dv-btn green full" id="nickGo">${existing?'Save':"Let's Draw!"}</button>
  `, {persistent: !existing});
  const root = document.getElementById('modal-root');
  const input = root.querySelector('#nickInput');
  input.focus();
  function go(){
    const val = input.value.trim().slice(0,18);
    if(!val){ input.style.borderColor = 'var(--red)'; return; }
    root.innerHTML = '';
    onDone(val);
  }
  root.querySelector('#nickGo').onclick = go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
};

/* ---------------- Slot picker ---------------- */
DV.slotPickerModal = async function(mode){
  DV.modal(`<h2>${mode==='load'?'Load Game':'Save Game'}</h2><div id="slotList"><div class="loading-row"><span class="spinner"></span> Reading slots…</div></div>`);
  const root = document.getElementById('modal-root');
  const list = root.querySelector('#slotList');
  const rows = await Promise.all(DV.SLOTS.map(async s=>{
    const data = await DV.Store.getJSON('save:'+s, false);
    return {slot:s, data};
  }));
  list.innerHTML = rows.map(r=>{
    const label = DV.SLOT_LABELS[r.slot];
    if(!r.data || !r.data.profile){
      return `<div class="slot-row empty" data-slot="${r.slot}">
        <div class="slot-info"><div class="slot-name">${label}</div><div class="slot-meta">Empty</div></div>
        <button class="dv-btn small ${mode==='save'?'':'ghost'}" data-slot="${r.slot}" ${mode==='load'?'disabled':''}>${mode==='save'?'Save here':'—'}</button>
      </div>`;
    }
    const p = r.data.profile;
    return `<div class="slot-row" data-slot="${r.slot}">
      <div class="slot-info"><div class="slot-name">${label} · ${DV.util.escapeHtml(p.nickname)}</div>
      <div class="slot-meta">${p.points||0} pts · ${DV.util.timeAgo(r.data.savedAt||p.lastPlayed)}</div></div>
      <button class="dv-btn small" data-slot="${r.slot}">${mode==='save'?'Overwrite':'Load'}</button>
    </div>`;
  }).join('');
  list.querySelectorAll('button[data-slot]').forEach(btn=>{
    if(btn.disabled) return;
    btn.onclick = async ()=>{
      const slot = btn.getAttribute('data-slot');
      if(mode==='save'){
        await DV.saveToSlot(slot);
        DV.toast('Saved to '+DV.SLOT_LABELS[slot], {icon:'💾'});
        root.innerHTML='';
      } else {
        const prof = await DV.loadFromSlot(slot);
        if(!prof) return;
        DV.profile = Object.assign(DV.freshProfile(), prof);
        root.innerHTML='';
        DV.toast('Loaded '+DV.SLOT_LABELS[slot], {icon:'📂'});
        DV.nav.go('view-hub');
      }
    };
  });
};

/* ---------------- Title screen ---------------- */
DV.Title = (function(){
  function el(id){ return document.getElementById(id); }

  function animateUnderline(){
    const path = document.getElementById('titleUnderline');
    if(!path) return;
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.style.transition = 'none';
    requestAnimationFrame(()=>{
      path.style.transition = 'stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1)';
      path.style.strokeDashoffset = 0;
    });
  }

  async function render(){
    el('titleWordmark').innerHTML = `
      <div style="font-family:var(--font-display);font-size:min(15vw,58px);line-height:1;color:var(--ink);letter-spacing:.5px;">
        Doodle<span style="color:var(--yellow);">Verse</span>
      </div>
      <svg viewBox="0 0 300 20" style="width:230px;height:20px;margin:8px auto 0;display:block;">
        <path id="titleUnderline" d="M5,10 Q40,1 75,12 T150,7 T220,13 T290,6" fill="none" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/>
      </svg>`;
    setTimeout(animateUnderline, 60);

    const slot0 = await DV.Store.getJSON('save:slot0', false);
    let anySlot = !!slot0;
    if(!anySlot){
      for(const s of ['slot1','slot2','slot3']){
        if(await DV.Store.getJSON('save:'+s, false)){ anySlot = true; break; }
      }
    }

    const actions = el('titleActions');
    let html = '';
    if(slot0 && slot0.profile){
      html += `<button class="dv-btn green full" id="btnContinue">Continue as ${DV.util.escapeHtml(slot0.profile.nickname)}</button>`;
    }
    html += `<button class="dv-btn full" id="btnNewGame">New Game</button>`;
    if(anySlot){
      html += `<button class="dv-btn ghost full" id="btnLoadGame">Load Game</button>`;
    }
    actions.innerHTML = html;

    if(el('btnContinue')) el('btnContinue').onclick = async ()=>{
      DV.profile = Object.assign(DV.freshProfile(), slot0.profile);
      DV.startAutosaveLoop();
      DV.nav.go('view-hub');
    };
    el('btnNewGame').onclick = ()=>{
      DV.nicknameModal(null, async (name)=>{
        DV.profile = DV.freshProfile(name);
        await DV.saveToSlot('slot0');
        DV.startAutosaveLoop();
        DV.toast('Welcome to DoodleVerse, '+name+'!', {icon:'🎨'});
        DV.nav.go('view-hub');
      });
    };
    if(el('btnLoadGame')) el('btnLoadGame').onclick = async ()=>{
      await DV.slotPickerModal('load');
      DV.startAutosaveLoop();
    };
  }

  return { render };
})();

/* ---------------- Hub ---------------- */
DV.Hub = (function(){
  function el(id){ return document.getElementById(id); }

  const ICONS = {
    pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l1.5-5L16 4.5 19.5 8 8 19.5 3 21z"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-8.5 8.5 8.5 8.5 0 01-4-1L3 20l1-5.5a8.5 8.5 0 1117-3z"/><path d="M8 10h.01M12 10h.01M16 10h.01" stroke-linecap="round"/></svg>',
    target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>',
    flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></svg>',
    heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.5-9.5-9A5 5 0 0112 5a5 5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>'
  };

  function menu(){
    DV.modal(`
      <h2>Menu</h2>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="dv-btn full" id="mSave">💾 Save Game</button>
        <button class="dv-btn ghost full" id="mLoad">📂 Load Game</button>
        <button class="dv-btn ghost full" id="mRename">✏️ Rename</button>
        <button class="dv-btn ghost full" id="mTitle">🏠 Back to Title</button>
      </div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-dim);font-family:var(--font-mono);">
        Playing as ${DV.util.escapeHtml(DV.profile.nickname)} · ${DV.profile.points} pts · ${DV.profile.coins} coins
      </div>
    `);
    const root = document.getElementById('modal-root');
    root.querySelector('#mSave').onclick = ()=>{ root.innerHTML=''; DV.slotPickerModal('save'); };
    root.querySelector('#mLoad').onclick = ()=>{ root.innerHTML=''; DV.slotPickerModal('load'); };
    root.querySelector('#mRename').onclick = ()=>{
      root.innerHTML='';
      DV.nicknameModal(DV.profile.nickname, async (name)=>{
        DV.profile.nickname = name;
        await DV.saveToSlot('slot0');
        DV.toast('Nickname updated', {icon:'✅'});
        render();
      });
    };
    root.querySelector('#mTitle').onclick = async ()=>{
      root.innerHTML='';
      await DV.saveToSlot('slot0');
      DV.nav.go('view-title');
      DV.Title.render();
    };
  }

  async function render(){
    el('hubAvatar').style.background = DV.profile.avatarColor;
    el('hubAvatar').textContent = (DV.profile.nickname||'D').charAt(0).toUpperCase();
    el('hubNickname').textContent = DV.profile.nickname;
    el('hubStats').innerHTML = `
      <div class="dv-chip">★ ${DV.profile.coins} coins</div>
      <div class="dv-chip">✨ ${DV.profile.points} points</div>
      <div class="dv-chip">🔥 ${DV.Challenges ? DV.Challenges.computeStreak() : 0} day streak</div>
    `;
    el('hubMenuBtn').onclick = menu;

    const cards = [
      {id:'studio', tilt:-1.2, cls:'mc-c1', icon:ICONS.pencil, title:'Studio', desc:'Sketch with pens, markers, and brushes.', stat:'Tap to create', action:()=>DV.Studio.open({type:'free'})},
      {id:'guess', tilt:1, cls:'mc-c5', icon:ICONS.chat, title:'Guess Arena', desc:'Draw a secret word, or guess someone else\'s.', stat:'…', action:()=>DV.nav.go('view-guess')},
      {id:'challenges', tilt:-0.8, cls:'mc-c4', icon:ICONS.target, title:'Challenges', desc:'One prompt a day, shared by everyone.', stat:'🔥 '+(DV.Challenges?DV.Challenges.computeStreak():0)+' day streak', action:()=>DV.nav.go('view-challenges')},
      {id:'obby', tilt:1.4, cls:'mc-c3', icon:ICONS.flag, title:'Doodle Obby', desc:'Run and jump through doodle obstacle courses.', stat:(DV.profile.obbyUnlocked?DV.profile.obbyUnlocked.length:1)+' / '+DV.Obby.LEVELS.length+' levels', action:()=>DV.nav.go('view-obby')},
      {id:'gallery', tilt:-1.5, cls:'mc-c2', icon:ICONS.heart, title:'Gallery', desc:'Browse everyone\'s doodles and drop a like.', stat:'…', action:()=>DV.nav.go('view-gallery')}
    ];

    el('hubGrid').innerHTML = cards.map(c=>`
      <button class="mode-card ${c.cls}" style="--tilt:${c.tilt}deg" data-id="${c.id}">
        <div class="pin"></div>
        <div class="mc-icon">${c.icon}</div>
        <div><h3>${c.title}</h3><p>${c.desc}</p></div>
        <div class="mc-stat" data-stat="${c.id}">${c.stat}</div>
      </button>
    `).join('');
    el('hubGrid').querySelectorAll('.mode-card').forEach((cardEl,i)=>{
      cardEl.onclick = cards[i].action;
    });

    DV.shared.fetchAll('guess:', 80).then(items=>{
      const n = items.filter(it=>!it.solved && it.author!==DV.profile.nickname).length;
      const s = el('hubGrid').querySelector('[data-stat="guess"]');
      if(s) s.textContent = n ? n+' to guess' : 'Draw one!';
    });
    DV.shared.fetchAll('gallery:', 60).then(items=>{
      const s = el('hubGrid').querySelector('[data-stat="gallery"]');
      if(s) s.textContent = items.length+' doodles';
    });
  }

  return { render, menu };
})();
/* =========================================================
   DoodleVerse — boot.js
   ========================================================= */
document.addEventListener('DOMContentLoaded', function(){
  try{
    DV.Studio.init();
  }catch(e){ console.error('[DoodleVerse] Studio init failed', e); }

  DV.nav.go('view-title');
  DV.Title.render();

  window.addEventListener('beforeunload', function(){
    if(DV.profile) DV.saveToSlot('slot0');
  });

  console.log('[DoodleVerse] boot complete');
});

</script>
